/* ============================================================
   Inner Sky — Design Tokens(与 globals.css 逐字一致)
   本项目无构建流程,tokens 以原生 CSS 变量使用。
   改颜色或字体请回 Figma,不要在组件样式里写死。
   ============================================================ */
:root {
  --background-midnight-navy: #09122e;
  --background-deep-space: #101a3e;
  --background-soft-night: #18224a;
  --background-story-navy: #0c1534;
  --surface-moon-cream: #f8f2ed;
  --surface-cloud-white: #fcf9f6;
  --surface-soft-blush: #f3e3e0;
  --accent-moon-lavender: #aaa0d5;
  --accent-sunset-pink: #ebc4c3;
  --accent-starlight-gold: #e8d3a2;
  --text-dark: #22233a;
  --text-light: #f9f6f2;
  --text-secondary: #77778a;
  --border-card: #f0e8e3;
  --gradient-primary: linear-gradient(135deg, #8176ad 0%, #e9b9b6 100%);
  --shadow-button: 0 8px 24px rgba(9, 18, 46, 0.15);
  --shadow-button-hover: 0 12px 30px rgba(9, 18, 46, 0.22);
  --shadow-card: 0 12px 40px rgba(9, 18, 46, 0.08);
  --font-display: "Cormorant Garamond", Georgia, serif;
  --font-serif-sc: "Noto Serif SC", Georgia, serif;
  --font-sans-sc: "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
  --display-en-72-font-size: 72px;  --display-en-72-line-height: 78px;
  --heading-h1-40-font-size: 40px;  --heading-h1-40-line-height: 60px;
  --heading-h2-36-font-size: 36px;  --heading-h2-36-line-height: 54px;
  --heading-h3-20-font-size: 20px;  --heading-h3-20-line-height: 32px;
  --body-regular-16-font-size: 16px; --body-regular-16-line-height: 30px;
  --body-caption-14-font-size: 14px; --body-caption-14-line-height: 26px;
  --body-label-12-font-size: 12px;  --body-label-12-line-height: 20px;
  --layout-max-width: 1200px;
  --layout-gutter: 24px;
  --layout-margin: 120px;
  --radius-card: 24px;
  --radius-card-sm: 16px;
  --radius-button: 28px;
  --ease-soft: cubic-bezier(0.22, 1, 0.36, 1);
  --duration-hover: 300ms;
  --duration-scroll: 400ms;
}
.type-display { font-family: var(--font-display); font-size: var(--display-en-72-font-size); font-weight: 300; line-height: var(--display-en-72-line-height); }
.type-h1 { font-family: var(--font-serif-sc); font-size: var(--heading-h1-40-font-size); font-weight: 500; line-height: var(--heading-h1-40-line-height); }
.type-h2 { font-family: var(--font-serif-sc); font-size: var(--heading-h2-36-font-size); font-weight: 500; line-height: var(--heading-h2-36-line-height); }
.type-h3 { font-family: var(--font-sans-sc); font-size: var(--heading-h3-20-font-size); font-weight: 500; line-height: var(--heading-h3-20-line-height); }
.type-body { font-family: var(--font-sans-sc); font-size: var(--body-regular-16-font-size); font-weight: 300; line-height: var(--body-regular-16-line-height); }
.type-caption { font-family: var(--font-sans-sc); font-size: var(--body-caption-14-font-size); font-weight: 300; line-height: var(--body-caption-14-line-height); }
.type-label { font-family: var(--font-sans-sc); font-size: var(--body-label-12-font-size); font-weight: 400; line-height: var(--body-label-12-line-height); }
@media (max-width: 767px) {
  :root {
    --display-en-72-font-size: 42px; --display-en-72-line-height: 48px;
    --heading-h1-40-font-size: 26px; --heading-h1-40-line-height: 40px;
    --heading-h2-36-font-size: 24px; --heading-h2-36-line-height: 38px;
    --heading-h3-20-font-size: 17px; --heading-h3-20-line-height: 28px;
    --layout-margin: 24px;
  }
}
@keyframes fade-in { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
@keyframes fade-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
@keyframes twinkle { 0%,100% { opacity: var(--o, .5); } 50% { opacity: calc(var(--o, .5) * 0.35); } }
.animate-fade-in { animation: fade-in 1s var(--animation-delay, 0s) var(--ease-soft) both; }
.animate-fade-up { animation: fade-up 1s var(--animation-delay, 0s) var(--ease-soft) both; }
@media (prefers-reduced-motion: reduce) {
  .animate-fade-in, .animate-fade-up { animation: none; opacity: 1; transform: none; }
  .starfield i { animation: none !important; }
}

/* ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
/* Midnight Frame:深蓝始终包着整个页面,中间一张亮底画布浮在上面,
   四边都是很宽的 feather,所以看不到边界 */
body {
  background:
    radial-gradient(90% 40vh at 74% 32vh, rgba(37,46,88,.55), rgba(37,46,88,0) 70%),
    linear-gradient(180deg,
      #071431 0vh, #101a3c 26vh, #16214a 58vh, #1a2450 100vh,
      #1b264f calc(100% - 620px), #17224a calc(100% - 300px),
      #101a3c calc(100% - 120px), #071431 100%);
  background-repeat: no-repeat;
  color: var(--text-dark); font-family: var(--font-sans-sc); -webkit-font-smoothing: antialiased;
}
/* Floating Canvas:一张珍珠白的内页浮在深蓝上,圆角 + 极淡的阴影与光晕,
   宽度从布局宽度(不含滚动条)推导,两侧始终露出深蓝 */
.canvas { position: relative; z-index: 1; overflow-x: clip; overflow-y: visible; }
.canvas::before, .canvas::after {
  content: ""; position: absolute; z-index: -1; pointer-events: none;
  --cw: min(78%, 1120px);
  left: 0; right: 0; margin-inline: auto; width: var(--cw);
}
.canvas::before {
  top: -34px; bottom: 10px;
  background: linear-gradient(180deg, #f8f5f0, #f6f3ef 46%, #f5f1ec);
  border-radius: 32px;
  box-shadow: 0 24px 70px rgba(7,20,51,.08);
  /* 底边不切断:珍珠白向下渐隐,溶进深蓝而非留一条硬线 */
  -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 150px), rgba(0,0,0,.55) calc(100% - 60px), transparent 100%);
  mask-image: linear-gradient(180deg, #000 calc(100% - 150px), rgba(0,0,0,.55) calc(100% - 60px), transparent 100%);
}
/* 香槝色的 atmospheric mist:只是让边缘不硬,透明度极低 */
.canvas::after {
  top: -74px; bottom: -30px; z-index: -2;
  width: calc(var(--cw) + 52px);
  border-radius: 52px;
  background: radial-gradient(120% 60% at 50% 0%, rgba(237,229,219,.16), rgba(237,229,219,0) 70%),
              radial-gradient(120% 46% at 50% 100%, rgba(240,234,226,.13), rgba(240,234,226,0) 72%),
              linear-gradient(180deg, rgba(246,243,239,.1), rgba(236,237,239,.07));
  filter: blur(22px);
}
/* Canvas 后方的连续云雾(cloud atmosphere)
   clouds.webp 本身就是一张「上下贯通、中间透空」的云廊素材。
   这里把它整张贴满 Canvas 的完整高度:::before 取素材左半边贴左缘,
   ::after 取素材右半边贴右缘,两半在中央交叠淡出,所以是同一张图的左右两侧,
   不是上下叠两张、也不是平铺重复,画面从 Canvas 顶部到底部不会断开。
   background-size 只按高度等比缩放,不横向拉伸变形。 */
.canvas > .clouds {
  position: absolute; inset: 0; z-index: -3; pointer-events: none;
  opacity: .44;
  /* 素材本身对比偏高,这里压低并柔化,保持 soft / diffused / moonlit 的质感 */
  filter: blur(4px) saturate(.7) brightness(.98) contrast(.85);
  /* 纵向密度曲线:顶部只是极淡的一层 → 中段低对比但不消失 → 下段回升 → 底部化进深蓝 */
  -webkit-mask-image: linear-gradient(180deg,
    rgba(0,0,0,0) 0%, rgba(0,0,0,.4) 4%, rgba(0,0,0,.55) 13%,
    rgba(0,0,0,.52) 28%, rgba(0,0,0,.54) 50%,
    rgba(0,0,0,.72) 72%, rgba(0,0,0,.88) 87%, rgba(0,0,0,.55) 95%, rgba(0,0,0,0) 100%);
  mask-image: linear-gradient(180deg,
    rgba(0,0,0,0) 0%, rgba(0,0,0,.4) 4%, rgba(0,0,0,.55) 13%,
    rgba(0,0,0,.52) 28%, rgba(0,0,0,.54) 50%,
    rgba(0,0,0,.72) 72%, rgba(0,0,0,.88) 87%, rgba(0,0,0,.55) 95%, rgba(0,0,0,0) 100%);
}
.canvas > .clouds::before, .canvas > .clouds::after {
  content: ""; position: absolute; top: 0; bottom: 0; width: 52%;
  background-image: url(clouds.webp);
  background-repeat: no-repeat;
  /* 132%:上下各裁掉约 12%,把素材顶部那道锐利的云沿裁出画面,
     免得云在 Canvas 上方几百像素处「忽然开始」,看起来像一块贴上去的云图 */
  background-size: auto 132%;
}
.canvas > .clouds::before {
  left: 0; background-position: left center;
  -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 46%, rgba(0,0,0,.55) 72%, rgba(0,0,0,0) 100%);
  mask-image: linear-gradient(90deg, #000 0%, #000 46%, rgba(0,0,0,.55) 72%, rgba(0,0,0,0) 100%);
}
.canvas > .clouds::after {
  right: 0; background-position: right center;
  -webkit-mask-image: linear-gradient(270deg, #000 0%, #000 46%, rgba(0,0,0,.55) 72%, rgba(0,0,0,0) 100%);
  mask-image: linear-gradient(270deg, #000 0%, #000 46%, rgba(0,0,0,.55) 72%, rgba(0,0,0,0) 100%);
}
/* Canvas 内的内容比 Canvas 窄一大截,四周留白 */
.canvas .wrap { width: min(880px, 74%); }
@media (max-width: 1250px) {
  .canvas::before, .canvas::after { --cw: min(92%, 1120px); }
  .canvas .wrap { width: min(880px, 86%); }
  .canvas > .clouds { opacity: .42; }
}
@media (max-width: 900px) {
  /* 手机端把 Canvas 两侧的深蓝缝加宽到 24px,让云层真的露得出来;
     .wrap 同步收窄,保持 Canvas 内原本的左右留白不变 */
  .canvas::before, .canvas::after { --cw: calc(100% - 48px); }
  .canvas .wrap { width: min(880px, 84%); }
  .canvas > .clouds { opacity: .5; filter: blur(2px) saturate(.72) brightness(1) contrast(.88); }
  /* 手机端缝太窄,等比缩放只能看到素材最外缘的一条平缓渐层。
     这里改成把整张云图压进侧栏(100% 132%),让缝里出现真正的云形与星点;
     缝只有 24px 宽,看不出横向压缩,仍是同一张图、左右各一侧,不平铺不镜像。 */
  .canvas > .clouds::before, .canvas > .clouds::after { width: 60%; background-size: 100% 132%; }
  .canvas::before { top: -22px; bottom: 6px; border-radius: 18px;
    -webkit-mask-image: linear-gradient(180deg, #000 calc(100% - 110px), transparent 100%);
    mask-image: linear-gradient(180deg, #000 calc(100% - 110px), transparent 100%); }
  .canvas::after { display: none; }
}
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }
.wrap { max-width: var(--layout-max-width); margin: 0 auto; padding: 0 var(--layout-gutter); }

/* ---------- 星空:细小、不规则、疏密不均 ---------- */
/* 星点越靠近浅色区越自然淡出 */
.starfield { position: absolute; inset: 0; overflow: hidden; pointer-events: none;
  -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 74%, rgba(0,0,0,.55) 88%, rgba(0,0,0,.15) 100%);
          mask-image: linear-gradient(180deg, #000 0%, #000 74%, rgba(0,0,0,.55) 88%, rgba(0,0,0,.15) 100%); }
.starfield i {
  position: absolute; display: block; border-radius: 50%;
  background: #fff; opacity: var(--o); animation: twinkle var(--d) ease-in-out var(--delay) infinite;
}
.starfield i.bright { box-shadow: 0 0 var(--glow) var(--glow) rgba(255,255,255,.45); }

/* ---------- 按钮 ---------- */
.btn-primary {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 14px 34px; border-radius: var(--radius-button);
  background: var(--gradient-primary); color: var(--text-light);
  font-family: var(--font-sans-sc); font-size: 15px; letter-spacing: .05em;
  box-shadow: var(--shadow-button);
  transition: box-shadow var(--duration-hover) var(--ease-soft), transform var(--duration-hover) var(--ease-soft);
}
.btn-primary:hover { box-shadow: var(--shadow-button-hover); transform: translateY(-2px); }
.btn-ghost {
  display: inline-block; padding: 11px 26px; border-radius: var(--radius-button);
  border: 1px solid rgba(249,246,242,.45); color: var(--text-light); font-size: 14px; letter-spacing: .04em;
  transition: border-color var(--duration-hover) var(--ease-soft), background var(--duration-hover) var(--ease-soft);
}
.btn-ghost:hover { border-color: rgba(249,246,242,.9); background: rgba(249,246,242,.06); }

/* ---------- Header ---------- */
/* Header 位于页面最顶端,与 Hero 共用同一片背景(不自带任何底色/遮罩),
   因此从页面最顶端到 Hero 底部是一整块连续的星空背景 */
header.site { position: relative; z-index: 5; background: transparent; }
/* Header 与应用内页面(app.html 的 .dp-topbar)对齐:不受 1200px 容器限制,
   品牌贴左上角、账号 / 注册贴右上角,左右留白用同一个 clamp */
header.site > .wrap.nav {
  max-width: none; padding: 26px clamp(20px, 6vw, 120px) 16px;
}
.nav { display: flex; align-items: center; }
.brand { font-family: var(--font-display); font-size: 19px; letter-spacing: .42em; color: var(--text-light); }
.nav-links { display: flex; gap: 32px; margin-left: auto; align-items: center; }
.nav-links a { color: rgba(249,246,242,.82); font-size: 14px; letter-spacing: .06em; transition: color var(--duration-hover); }
.nav-links a:hover { color: var(--text-light); }
/* 注册 / 登入:Header 最右,位于「关于我们」右侧 */
.nav-cta {
  margin-left: 28px; padding: 9px 22px; border-radius: var(--radius-button);
  background: linear-gradient(135deg, rgba(170,160,213,.9), rgba(235,196,195,.9));
  color: var(--background-midnight-navy); font-size: 13.5px; font-weight: 500; letter-spacing: .04em;
  transition: box-shadow var(--duration-hover) var(--ease-soft);
}
.nav-cta:hover { box-shadow: 0 6px 20px rgba(170,160,213,.4); }
/* 已登录:用户名 + 极简下拉,延续 Header 的克制风格 */
.nav-user { position: relative; margin-left: 28px; }
.nav-user-btn {
  display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
  font-family: var(--font-sans-sc); font-size: 14px; letter-spacing: .06em;
  color: rgba(249,246,242,.88); background: transparent;
  border: 1px solid rgba(249,246,242,.22); border-radius: var(--radius-button);
  padding: 8px 18px; transition: border-color var(--duration-hover) var(--ease-soft), color var(--duration-hover);
}
.nav-user-btn:hover { border-color: rgba(232,211,162,.6); color: var(--text-light); }
.nav-user-btn .caret { font-size: 10px; color: rgba(249,246,242,.5); transition: transform var(--duration-hover); }
.nav-user.open .nav-user-btn .caret { transform: rotate(180deg); }
.nav-user-menu {
  position: absolute; right: 0; top: calc(100% + 10px); min-width: 168px;
  display: none; flex-direction: column; padding: 8px;
  background: rgba(16,26,62,.94); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(249,246,242,.14); border-radius: 16px;
  box-shadow: 0 18px 46px rgba(9,18,46,.42); z-index: 20;
}
.nav-user.open .nav-user-menu { display: flex; }
.nav-user-menu a, .nav-user-menu button {
  font-family: var(--font-sans-sc); font-size: 13.5px; text-align: left; letter-spacing: .04em;
  color: rgba(249,246,242,.82); background: none; border: none; cursor: pointer;
  padding: 9px 12px; border-radius: 10px; transition: background var(--duration-hover), color var(--duration-hover);
}
.nav-user-menu a:hover, .nav-user-menu button:hover { background: rgba(249,246,242,.08); color: var(--text-light); }
.nav-user-menu #navLogout { color: rgba(235,196,195,.9); margin-top: 2px; }
/* Dropdown 里的账号抬头:先让人确认自己是谁,再是入口 */
.nav-user-menu .who { padding: 9px 12px 12px; margin-bottom: 5px; border-bottom: 1px solid rgba(249,246,242,.1); }
.nav-user-menu .who small { display: block; font-size: 10px; letter-spacing: .2em; color: rgba(249,246,242,.42); margin-bottom: 5px; }
.nav-user-menu .who b {
  display: block; font-family: var(--font-serif-sc); font-weight: 500; font-size: 14.5px; color: var(--text-light);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.nav-user-menu .sep { height: 1px; margin: 6px 5px; background: rgba(249,246,242,.1); }
/* 当前所在页面:非常轻微的 active state */
.nav-user-menu a.on { background: rgba(170,160,213,.15); color: var(--text-light); }
/* Desktop 上这些入口已经在横向 Header 里,Dropdown 不重复;Mobile 才出现 */
.nav-user-menu .m-only { display: none; }
/* 未登录时的 Mobile 菜单入口(Desktop 隐藏,横向 Header 已有这些项目) */
.nav-menu { position: relative; display: none; margin-right: 12px; }
.nav-menu[hidden] { display: none !important; }
@media (max-width: 860px) {
  .nav-user { margin-left: 0; }
  /* Menu item 之间留足点击区域 */
  .nav-user-btn { padding: 9px 15px; font-size: 13px; max-width: 52vw; }
  .nav-user-btn > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-user-menu { min-width: 208px; max-width: min(78vw, 280px); }
  .nav-user-menu a, .nav-user-menu button { padding: 12px 13px; }
  .nav-user-menu .m-only { display: block; }
  /* 横向导航收起,但项目不会消失 —— 全部搬进右上角的 Dropdown。
     只作用于 Header 的直接子层,Dropdown 内的项目不受影响。 */
  .nav-links > a:not(.nav-cta) { display: none; }
  .nav-links { margin-left: auto; gap: 0; }
  .nav-cta { margin-left: 0; padding: 9px 16px; white-space: nowrap; }
  .nav-menu { display: block; }
}
/* 窄屏:品牌与两颗按钮同一行放得下,不换行、不挤压 */
@media (max-width: 520px) {
  .brand { font-size: 15px; letter-spacing: .26em; }
  .nav-cta { font-size: 12.5px; padding: 8px 13px; }
  .nav-menu { margin-right: 8px; }
  .nav-user-btn { padding: 8px 12px; font-size: 12.5px; }
}

/* ---------- Hero ---------- */
.hero { position: relative; overflow: hidden; color: var(--text-light);
  background: transparent; }
/* Hero 内容:较宽的 responsive container,左 40% 文字 / 右 60% 星球
   用 > 直接子元素选择器,避免命中 header 内的 .wrap.nav */
.hero > .wrap { position: relative; z-index: 2; display: grid; grid-template-columns: 40fr 60fr;
  gap: clamp(24px, 5vw, 80px); align-items: center;
  width: min(92%, 1400px); max-width: none;
  /* 上下留白一致:Header 底 → 标题 的距离 与 Hero 底部留白相同 */
  min-height: 0;
  padding-top: clamp(22px, 2.2vw, 34px); padding-bottom: clamp(64px, 5vw, 84px); }
.hero-copy { justify-self: start; text-align: left; }
.hero-copy h1 { font-size: clamp(36px, 3.9vw, 60px); line-height: 1.14; }
.hero-copy h1 { color: var(--text-light); }
/* 问候 kicker:小字 + 短线,名字用星光金,是 Hero 里唯一的彩色文字 */
.hero-kicker[hidden] { display: none; }   /* 未登录时彻底不占位,也不露出前置短线 */
.hero-kicker { margin: 0 0 20px; }
.hero-kicker .l1 {
  display: flex; align-items: center; gap: 12px;
  font-family: var(--font-serif-sc); font-size: clamp(17px, 1.5vw, 21px); font-weight: 500;
  letter-spacing: .1em; color: rgba(249,246,242,.9);
}
.hero-kicker .l1::before { content: ""; width: 26px; height: 1px; flex: none; background: rgba(232,211,162,.6); }
.hero-kicker .nm { color: var(--accent-starlight-gold); }
.hero-kicker .l2 {
  margin: 7px 0 0 38px; font-size: 13px; letter-spacing: .16em;
  color: rgba(249,246,242,.58); font-weight: 300;
}
@media (max-width: 520px) {
  .hero-kicker .l1 { font-size: 16px; letter-spacing: .06em; }
  .hero-kicker .l2 { font-size: 12px; margin-left: 38px; }
}
.hero-copy .sub { margin-top: 16px; color: rgba(249,246,242,.72); letter-spacing: .3em; font-weight: 300; font-size: 16px; font-family: var(--font-serif-sc); }
/* 中文品牌 tagline:柔和奶油白,不抢英文主标题;Desktop 保持一行 */
.hero-copy .brand-line {
  margin: 12px 0 0; font-family: var(--font-serif-sc); font-weight: 400;
  font-size: clamp(17px, 1.5vw, 23px); line-height: 1.75; letter-spacing: .14em;
  color: rgba(250,243,238,.92); white-space: nowrap;
}
.hero-copy .brand-line .bl-emoji { font-size: .86em; margin-left: .1em; }
@media (max-width: 520px) { .hero-copy .brand-line { white-space: normal; letter-spacing: .08em; } }
/* 细分隔线:位于中文品牌句与「看见完整的自己」之间,柔和不抢眼 */
.hero-copy .rule {
  width: 88px; height: 1px; border: 0; margin: 20px 0 0;
  background: linear-gradient(90deg, rgba(249,246,242,.34), rgba(249,246,242,.06));
}
.hero-copy .cta-row { display: flex; align-items: center; margin-top: 26px; }
/* 行星:完整显示,永不裁切 */
.hero-visual { position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; }
.hero-visual img {
  width: 100%; max-width: min(38vw, 560px); height: auto; object-fit: contain;
  /* 收敛的柔光:小范围、低透明度,让球体边缘与光环保持清晰 */
  filter: drop-shadow(0 10px 34px rgba(150,120,200,.3)) drop-shadow(0 0 14px rgba(232,211,162,.16));
  animation: fade-up 1.4s .2s var(--ease-soft) both;
}
@media (max-width: 900px) {
  .hero > .wrap { grid-template-columns: 1fr; min-height: 0; padding-top: 24px; padding-bottom: 64px; width: min(92%, 1400px); }
  .hero-copy { justify-self: stretch; }
  .hero-visual { min-height: 0; margin-top: 30px; }
  .hero-visual img { max-width: 78vw; }
}

/* ---------- 人生章节(星体入口) ---------- */
.chapters { background: transparent; padding: 56px 0 58px; text-align: center; }
/* Section Title:视觉权重明显低于 Hero Headline(Know Yourself Through the Stars),
   字号、行高、字距与下方留白一起调,避免只缩字号造成上下比例不协调。 */
.chapters .sec-title {
  font-family: var(--font-serif-sc); font-weight: 500;
  font-size: clamp(20px, 1.05vw + 15px, 29px);
  line-height: 1.62; letter-spacing: .07em;
  color: var(--text-dark); margin: 0 auto; max-width: 22em;
}
.chapters .lead { margin-top: 14px; color: var(--text-secondary); letter-spacing: .04em; }
@media (max-width: 767px) {
  .chapters .sec-title { line-height: 1.68; letter-spacing: .04em; }
  .chapters .lead { margin-top: 11px; }
}
/* 标准 3 × 3 Grid:固定三列,不因 responsive 出现两排 / 不平均分布 */
.chapter-grid {
  /* 素材本身在球体外圈留了透明边(为了完整显示光环),视觉上已自带上下留白,
     所以 row-gap 不需要再给大值,否则整段会被撑得很空 */
  margin-top: 40px; display: grid; gap: 42px 72px;
  grid-template-columns: repeat(3, 1fr);
  max-width: 760px; margin-left: auto; margin-right: auto;
  justify-items: center;
}
/* 一个星体 = 一个完整单元:星球、标题、描述共用同一列,天然居中对齐 */
.planet-chapter {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  gap: 3px; padding: 0 4px; width: 100%; max-width: 240px;
}
/* 九颗星球共用同一尺寸盒;素材已统一球体比例,视觉大小因此一致 */
.planet-chapter .orb {
  width: clamp(96px, 9vw, 128px); aspect-ratio: 1; display: grid; place-items: center;
  margin-bottom: 4px;
}
/* 未读:降饱和 + 略降亮度,保留质感、阴影与光环;已读:恢复完整颜色 */
.planet-chapter .orb img {
  width: 100%; height: 100%; object-fit: contain;
  filter: grayscale(.82) saturate(.35) brightness(1.04) opacity(.72);
  transition: transform var(--duration-hover) var(--ease-soft), filter var(--duration-hover) var(--ease-soft);
}
.planet-chapter .orb.read img { filter: none; }
.planet-chapter:hover .orb img { filter: grayscale(.45) saturate(.6) opacity(.9); }
.planet-chapter:hover .orb.read img { filter: none; }
.planet-chapter:hover .orb img { transform: translateY(-5px) scale(1.04); }
.planet-chapter .name { font-family: var(--font-serif-sc); font-size: 18px; font-weight: 500; letter-spacing: .05em; }
.planet-chapter .cap { color: var(--text-secondary); font-size: 13px; line-height: 23px; font-weight: 300; }
.planet-chapter .done { margin-top: 3px; font-size: 11px; letter-spacing: .1em; color: var(--accent-moon-lavender); min-height: 12px; }
/* 平板:仍保持 3 列,只缩小星球与间距,避免出现「两排 / 不平均」排列 */
@media (max-width: 860px) { .chapters { padding: 68px 0 74px; } .chapter-grid { margin-top: 40px; gap: 26px 10px; } .planet-chapter .orb { margin-bottom: 10px; } .planet-chapter .orb { width: clamp(74px, 11vw, 96px); } .planet-chapter .name { font-size: 16px; } }
@media (max-width: 520px) { .chapters { padding: 68px 0 74px; } .chapter-grid { margin-top: 38px; gap: 26px 8px; } .planet-chapter .orb { width: 64px; margin-bottom: 12px; } .planet-chapter .name { font-size: 14px; letter-spacing: .02em; } .planet-chapter .cap { font-size: 11.5px; line-height: 19px; } }

/* ---------- Dashboard 预览 ---------- */
.preview { padding: 40px 0 96px; background: transparent; }
.preview-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: var(--layout-gutter); align-items: stretch; }
/* 左栏与右栏(星空 + 收藏)等高:脉络卡片吃掉剩下的高度 */
.preview-grid > .card { display: flex; flex-direction: column; }
.card { background: #fff; border: 1px solid var(--border-card); border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding: 30px 32px; }
.card h4 { font-family: var(--font-serif-sc); font-size: 20px; font-weight: 500; }
.card .link { float: right; color: var(--text-secondary); font-size: 13px; }
.card .link:hover { color: var(--text-dark); }
.greet { font-family: var(--font-serif-sc); font-size: 26px; font-weight: 500; }
.greet-sub { color: var(--text-secondary); font-size: 13.5px; margin-top: 6px; }
.section-label { margin: 26px 0 12px; font-size: 12.5px; letter-spacing: .08em; color: var(--text-secondary); }
/* 未读章节滑轨 */
.rail { display: flex; gap: 16px; min-width: 0; max-width: 100%; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; scrollbar-width: thin; }
.rail::-webkit-scrollbar { height: 4px; }
.rail::-webkit-scrollbar-thumb { background: var(--border-card); border-radius: 2px; }
.chapter-card {
  scroll-snap-align: start; flex: 0 0 min(100%, 420px);
  position: relative; overflow: hidden; border-radius: var(--radius-card-sm);
  min-height: 158px; padding: 24px 26px; color: var(--text-light);
  display: flex; flex-direction: column; justify-content: space-between;
  background-color: var(--background-deep-space); background-size: cover; background-position: center;
}
.chapter-card::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(100deg, rgba(12,21,52,.93) 0%, rgba(12,21,52,.78) 46%, rgba(12,21,52,.25) 100%); }
.chapter-card > * { position: relative; z-index: 1; }
.chapter-card .q { font-family: var(--font-serif-sc); font-size: 20px; line-height: 33px; max-width: 62%; }
.chapter-card .go { align-self: flex-start; padding: 8px 18px; border-radius: var(--radius-button); border: 1px solid rgba(249,246,242,.5); font-size: 13px; }
.chapter-card .tag { font-size: 11px; letter-spacing: .16em; color: rgba(249,246,242,.62); font-family: var(--font-display); }
/* 推荐 */
.reco-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.reco { border: 1px solid var(--border-card); border-radius: var(--radius-card-sm); padding: 14px; transition: box-shadow var(--duration-hover) var(--ease-soft), transform var(--duration-hover) var(--ease-soft); }
.reco:hover { box-shadow: var(--shadow-card); transform: translateY(-3px); }
.reco .win { height: 108px; border-radius: 56px 56px 12px 12px; margin-bottom: 12px; background-size: cover; background-position: center 22%; }
.reco .q { font-size: 13.5px; line-height: 22px; min-height: 44px; }
.reco .tag { display: inline-block; margin-top: 10px; padding: 3px 10px; border-radius: 10px; background: var(--surface-soft-blush); color: #a5766f; font-size: 11.5px; }
/* 侧栏 */
.side { display: flex; flex-direction: column; gap: var(--layout-gutter); }
.sky-card { background: linear-gradient(150deg, #f5dfe6, #e6def2 55%, #f8ecdf); border: none; }
.wheel { position: relative; width: 100%; aspect-ratio: 1; margin-top: 18px; display: grid; place-items: center; }
.wheel img, .wheel svg { width: 100%; height: 100%; object-fit: contain; }
.wheel .hint { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; font-size: 11px; color: var(--text-secondary); }
.fav { background: var(--surface-moon-cream); border-radius: var(--radius-card-sm); padding: 20px 22px; margin-top: 16px; }
.fav blockquote { font-family: var(--font-serif-sc); font-size: 15.5px; line-height: 30px; }
.fav .meta { display: flex; justify-content: space-between; margin-top: 12px; color: var(--text-secondary); font-size: 12px; }
.empty { color: var(--text-secondary); font-size: 13px; line-height: 26px; margin-top: 14px; }
/* Canvas 让内容比视口窄,所以两栏预览要提前收成一栏,否则右栏会被压成手机宽度 */
@media (max-width: 1180px) { .preview-grid { grid-template-columns: minmax(0, 1fr); align-items: start; } .preview-grid .thread, .preview-grid .thread-gate { flex: none; } }
@media (max-width: 900px) { .preview-grid { grid-template-columns: minmax(0, 1fr); align-items: start; } .thread, .thread-gate { flex: none; } .reco-grid { grid-template-columns: repeat(2, 1fr); } .chapter-card .q { max-width: 100%; } }

.wheel-empty { padding: 30px 18px; text-align: center; color: var(--text-secondary); font-size: 13.5px; line-height: 26px; }
.wheel-empty a { display: inline-block; margin-top: 10px; color: var(--accent-moon-lavender); font-size: 13px; }
.fav-empty { padding: 18px 4px; color: var(--text-secondary); font-size: 13px; line-height: 24px; }

/* ---------- 你的生命脉络(复用应用内已生成的内容,不重新生成) ---------- */
.thread { margin-top: 4px; flex: 1; display: flex; flex-direction: column; }
.thread .lead {
  font-family: var(--font-serif-sc); font-size: 15.5px; line-height: 30px;
  color: var(--text-dark); padding: 0 0 20px; margin-bottom: 6px;
  border-bottom: 1px solid var(--border-card);
}
.thread-list { display: grid; gap: 2px; }

/* 一行一段脉络:标题在外,正文收起 */
.thread-item { border-bottom: 1px solid var(--border-card); }
.thread-item:last-child { border-bottom: none; }
/* 每一段脉络:标题在外,点击进入独立页面阅读 */
.thread-item {
  position: relative; display: flex; align-items: center; gap: 14px;
  padding: 17px 4px; color: var(--text-dark);
  transition: color var(--duration-hover) var(--ease-soft), padding-left var(--duration-hover) var(--ease-soft);
}
.thread-item:hover { color: var(--accent-moon-lavender); padding-left: 8px; }
.thread-item:focus-visible { outline: 2px solid var(--accent-moon-lavender); outline-offset: 3px; border-radius: 8px; }
.thread-item .t {
  flex: 1; font-family: var(--font-serif-sc); font-size: 15.5px; font-weight: 500; line-height: 27px;
}
.thread-item .go {
  flex: none; font-size: 14px; color: var(--text-secondary); opacity: 0;
  transform: translateX(-4px);
  transition: opacity var(--duration-hover) var(--ease-soft), transform var(--duration-hover) var(--ease-soft);
}
.thread-item:hover .go { opacity: .85; transform: none; }

/* 未点亮:描边小星,低透明、无光 */
.thread-item .star {
  position: relative; flex: none; width: 15px; height: 15px;
  background: currentColor; opacity: .3; color: var(--text-secondary);
  -webkit-mask: var(--star-mask) center / contain no-repeat;
          mask: var(--star-mask) center / contain no-repeat;
  transition: opacity var(--duration-hover) var(--ease-soft), color var(--duration-hover);
}
:root {
  --star-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 1.6c.5 4.6 1.9 7.9 4.3 9.3-2.4 1.4-3.8 4.7-4.3 9.3-.5-4.6-1.9-7.9-4.3-9.3C10.1 9.5 11.5 6.2 12 1.6z' fill='black'/><path d='M12 3.4c.4 3.6 1.5 6.2 3.4 7.5-1.9 1.3-3 3.9-3.4 7.5-.4-3.6-1.5-6.2-3.4-7.5C10.5 9.6 11.6 7 12 3.4z' fill='black'/></svg>");
}
/* 已点亮:星芯发亮 + 柔和外晕 + 极缓慢的呼吸 */
.thread-item.lit .star {
  opacity: 1; color: var(--accent-starlight-gold);
  filter: drop-shadow(0 0 3px rgba(232,211,162,.9)) drop-shadow(0 0 9px rgba(232,211,162,.45));
  animation: starBreath 3.6s var(--ease-soft) infinite;
}
.thread-item.lit::before {
  content: ""; position: absolute; left: -6px; width: 28px; height: 28px; border-radius: 50%;
  background: radial-gradient(circle, rgba(232,211,162,.22), transparent 68%);
  pointer-events: none;
}

@keyframes starBreath {
  0%, 100% { filter: drop-shadow(0 0 3px rgba(232,211,162,.75)) drop-shadow(0 0 8px rgba(232,211,162,.32)); }
  50%      { filter: drop-shadow(0 0 4px rgba(232,211,162,1))   drop-shadow(0 0 13px rgba(232,211,162,.55)); }
}
@media (prefers-reduced-motion: reduce) { .thread-item.lit .star { animation: none; } }

.thread-aha { display: grid; gap: 8px; margin-top: 22px; }
.thread-aha .a {
  font-family: var(--font-serif-sc); font-size: 14px; line-height: 26px; color: var(--text-dark);
  padding: 12px 16px; border-radius: var(--radius-card-sm);
  border: 1px solid var(--border-card); border-left: 2px solid var(--accent-starlight-gold);
}
.thread-q {
  margin-top: 12px; padding: 13px 16px; border-radius: var(--radius-card-sm);
  border: 1px dashed var(--accent-moon-lavender); background: rgba(170,160,213,.06);
  font-size: 13.5px; line-height: 25px; color: var(--text-dark);
}
/* 未开启时的安静进度:一条金线串起九个节点,读过的亮起 */
.thread-label { display: flex; align-items: center; gap: 8px; }
.thread-label::before {
  content: "✦"; font-size: 11px; line-height: 1; color: var(--accent-starlight-gold);
}
.thread-gate {
  flex: 1; display: flex; flex-direction: column; justify-content: center;
  padding: 30px 34px 24px; text-align: center;
  border: 1px solid rgba(214,186,131,.42); border-radius: 16px;
  background: linear-gradient(170deg, #fdfaf6, #fbf5ee);
}
/* 轨迹:节点是使用者实际读过的主题星球,按阅读顺序排列 */
.thread-gate .track {
  position: relative; display: flex; align-items: center; justify-content: center;
  min-height: 52px; margin: 0 2px; max-width: 100%;
}
.thread-gate .track.empty::before {
  content: ""; position: absolute; left: 8%; right: 8%; top: 50%; height: 1px;
  background: linear-gradient(90deg, rgba(202,171,116,0), rgba(202,171,116,.4) 20%, rgba(202,171,116,.4) 80%, rgba(202,171,116,0));
}
/* 星球:统一显示盒 + contain,原始素材比例与外圈光晕都不被裁切 */
.thread-gate .orb {
  position: relative; flex: 0 1 40px; min-width: 0; aspect-ratio: 1;
  display: grid; place-items: center; padding: 2px;
}
.thread-gate .orb img { width: 100%; height: 100%; object-fit: contain; display: block; }
.thread-gate .orb::after {
  content: ""; position: absolute; left: 50%; top: 50%; width: 150%; height: 150%;
  transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(232,211,162,.2), rgba(232,211,162,0) 66%);
}
/* 连接线:很细的星光,中段带一点微弱星尘,不抢星球的重点 */
.thread-gate .link {
  flex: 1 1 6px; min-width: 0; height: 9px; position: relative;
}
.thread-gate .link::before {
  content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1px;
  background: linear-gradient(90deg, rgba(202,171,116,.15), rgba(202,171,116,.7) 45%, rgba(202,171,116,.15));
}
.thread-gate .link::after {
  content: ""; position: absolute; left: 50%; top: 50%; width: 3px; height: 3px;
  transform: translate(-50%, -50%) rotate(45deg);
  background: rgba(232,211,162,.9); box-shadow: 0 0 5px rgba(232,211,162,.8);
}
/* 新读完的主题:淡入 + 一层柔光,前一条连接线缓慢生成,结束后保持静态 */
.thread-gate .orb.fresh { animation: orbArrive 1.5s var(--ease-soft) both; }
.thread-gate .link.fresh::before { transform-origin: left center; animation: threadDraw 1.1s var(--ease-soft) both; }
.thread-gate .link.fresh::after { animation: dustIn .9s var(--ease-soft) 1s both; }
@keyframes orbArrive {
  from { opacity: 0; transform: scale(.9); filter: drop-shadow(0 0 10px rgba(232,211,162,.85)); }
  60%  { opacity: 1; filter: drop-shadow(0 0 8px rgba(232,211,162,.55)); }
  to   { opacity: 1; transform: none; filter: none; }
}
@keyframes threadDraw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes dustIn { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .thread-gate .orb.fresh, .thread-gate .link.fresh::before, .thread-gate .link.fresh::after { animation: none; }
}
/* 节点是一颗小菱形星,而不是圆点:线上像串起来的星子 */
.thread-gate .node {
  position: relative; z-index: 1; flex: none;
  width: 9px; height: 9px; transform: rotate(45deg);
  background: #fdfaf5; border: 1px solid rgba(196,164,108,.8);
  outline: 3px solid #fbf6ef;
}
.thread-gate .node.on {
  background: var(--accent-starlight-gold); border-color: rgba(196,164,108,.95);
  box-shadow: 0 0 8px rgba(232,211,162,.95);
}
/* 下一个待读的节点:略大一圈,带一层柔光与亮芯 */
.thread-gate .node.next { width: 11px; height: 11px; border-color: rgba(196,164,108,.95); }
.thread-gate .node.next::before {
  content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px;
  transform: translate(-50%, -50%); border-radius: 50%;
  background: var(--accent-starlight-gold);
}
.thread-gate .node.next::after {
  content: ""; position: absolute; left: 50%; top: 50%; width: 24px; height: 24px;
  transform: translate(-50%, -50%) rotate(-45deg); border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(232,211,162,.6), rgba(232,211,162,0) 68%);
}
.thread-gate .tx {
  margin: 22px 0 0; font-family: var(--font-serif-sc);
  font-size: 14.5px; line-height: 29px; color: #4d4859;
}
.thread-gate .count { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 22px; }
.thread-gate .count i { display: block; width: 44px; height: 1px; background: rgba(202,171,116,.5); }
.thread-gate .num {
  font-family: var(--font-display); font-size: 15px; letter-spacing: .2em;
  color: #9b8a68;
}
.thread-gate .go {
  display: inline-block; margin-top: 22px; padding: 10px 24px; border-radius: var(--radius-button);
  border: 1px solid rgba(196,164,108,.75); color: #8d7a55; font-size: 13px;
  transition: background var(--duration-hover) var(--ease-soft), color var(--duration-hover);
}
.thread-gate .go:hover { background: rgba(232,211,162,.16); }
.thread-gate.ready .tx { color: var(--text-dark); }
/* 完成态:星球连接之下的主标题。
   它是星球之后的第二视觉重点,但不抢 section title,所以不额外套卡片。 */
.thread-crown { margin-top: 30px; display: flex; flex-direction: column; align-items: center; }
.thread-crown .mark {
  display: block; font-size: 11px; line-height: 1; color: rgba(196,164,108,.75); margin-bottom: 14px;
}
.thread-crown .lead-title {
  margin: 0; max-width: 30ch; text-align: center;
  font-family: var(--font-serif-sc); font-size: 19px; line-height: 34px;
  color: var(--text-dark); letter-spacing: .01em;
}
.thread-gate.done .go { margin-top: 26px; }
@media (max-width: 520px) {
  .thread-crown { margin-top: 24px; }
  .thread-crown .lead-title { font-size: 16.5px; line-height: 30px; max-width: 22ch; }
}

/* ---------- Mobile:脉络星球改成换行排列 ----------
   手机上九颗星球挤在同一行,flex 会把每颗压到只剩几个 px,既看不清也没有质感。
   改成一行三颗:星球不再收缩(放大到 46px),第三、第六颗后面的那条连接线
   撑成整行并转成一段竖线 —— 换行处仍然连着,读起来还是一条脉络。
   星球数量会随阅读一颗颗增加,这套写法在 1~9 颗都成立。
   Desktop 维持原本一条横线,不受影响。 */
@media (max-width: 560px) {
  .thread-gate .track { flex-wrap: wrap; justify-content: center; row-gap: 2px; }
  /* 用百分比而不是固定 px:不论卡片多宽,一行都刚好放得下三颗 */
  .thread-gate .orb { flex: 0 0 26%; max-width: 64px; }
  .thread-gate .link { flex: 1 1 auto; min-width: 10px; }
  .thread-gate .link:nth-child(6),
  .thread-gate .link:nth-child(12) { flex: 0 0 100%; height: 24px; }
  .thread-gate .link:nth-child(6)::before,
  .thread-gate .link:nth-child(12)::before {
    left: 50%; right: auto; top: 0; width: 1px; height: 100%;
    background: linear-gradient(180deg, rgba(202,171,116,.15), rgba(202,171,116,.7) 45%, rgba(202,171,116,.15));
  }
  .thread-gate .link:nth-child(6)::after,
  .thread-gate .link:nth-child(12)::after { display: none; }
}
@media (max-width: 520px) {
  .thread-gate { padding: 28px 20px 22px; }
  .thread-gate .tx { font-size: 14px; line-height: 28px; }
  .thread-item { gap: 11px; padding: 15px 2px; }
  .thread-item .t { font-size: 14.5px; line-height: 25px; }
  .thread-item .go { opacity: .6; transform: none; }
}

/* ---------- 品牌故事:整片星夜 + 左右构图(与前后 section 自然衔接) ---------- */
.story { padding: 10px 0 84px; background: transparent; }
.story-panel {
  position: relative; overflow: hidden; isolation: isolate;
  border-radius: var(--radius-card); color: var(--text-light);
  background: var(--background-story-navy);
  padding: clamp(44px, 4vw, 64px) clamp(26px, 5vw, 72px) clamp(44px, 4vw, 64px);
}

.story-panel .starfield { z-index: 1; }
/* 文字侧的暗场,保证主文案永远是视觉重点 */
.story-glow {
  position: absolute; inset: 0; z-index: 1;
  background:
    radial-gradient(70% 90% at 6% 40%, rgba(12,21,52,.92) 0%, rgba(12,21,52,.6) 45%, transparent 78%),
    linear-gradient(180deg, transparent 55%, rgba(12,21,52,.75) 100%);
}
.story-inner {
  position: relative; z-index: 2;
  display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr);
  gap: clamp(28px, 5vw, 72px); align-items: center;
}
.story-title {
  font-family: var(--font-serif-sc); font-weight: 500;
  font-size: clamp(25px, 2.5vw, 38px); line-height: 1.66; letter-spacing: .02em;
  color: var(--text-light); margin: 0; text-wrap: balance;
}
/* 「看见」:斜体衬线 + 极轻微柔光,不过度设计 */
.story-title em {
  font-style: italic; color: var(--accent-starlight-gold);
  text-shadow: 0 0 18px rgba(232,211,162,.32);
}
.story-lead {
  margin: clamp(16px, 1.8vw, 24px) 0 0;
  font-size: clamp(13.5px, 1vw, 15px); line-height: 2; font-weight: 300;
  color: rgba(249,246,242,.72);
}
.story-lead em { font-style: normal; color: var(--accent-starlight-gold); }
/* 描边光晕按钮,呼应星轨 */
.story-btn {
  position: relative; display: inline-flex; align-items: center; gap: 14px;
  margin-top: clamp(20px, 2.2vw, 30px); padding: 13px 34px;
  border: 1px solid rgba(232,211,162,.5); border-radius: var(--radius-button);
  font-size: 14.5px; letter-spacing: .1em; color: var(--text-light);
  box-shadow: 0 0 22px rgba(232,211,162,.16), inset 0 0 18px rgba(232,211,162,.06);
  transition: border-color var(--duration-hover) var(--ease-soft), box-shadow var(--duration-hover) var(--ease-soft), transform var(--duration-hover) var(--ease-soft);
}
.story-btn:hover { border-color: rgba(232,211,162,.9); box-shadow: 0 0 34px rgba(232,211,162,.28); transform: translateY(-1px); }
.story-btn:focus-visible { outline: 2px solid var(--accent-starlight-gold); outline-offset: 4px; }

.story-social .lead-sm { font-size: 13.5px; letter-spacing: .06em; color: rgba(249,246,242,.7); margin: 0 0 18px; font-weight: 300; }
.story-social .lead-sm i { font-family: var(--font-display); font-style: italic; font-size: 16px; letter-spacing: .04em; }
.story-social .chips { display: grid; gap: 12px; }
.social-chip {
  display: flex; align-items: center; gap: 14px; padding: 15px 18px; border-radius: 18px;
  border: 1px solid rgba(249,246,242,.14); background: rgba(249,246,242,.06);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  transition: border-color var(--duration-hover) var(--ease-soft), background var(--duration-hover) var(--ease-soft), transform var(--duration-hover) var(--ease-soft);
}
.social-chip:hover { border-color: rgba(232,211,162,.45); background: rgba(249,246,242,.1); transform: translateY(-1px); }
.social-chip:focus-visible { outline: 2px solid var(--accent-starlight-gold); outline-offset: 3px; }
.social-chip .mark {
  width: 42px; height: 42px; flex: none; display: grid; place-items: center; border-radius: 50%;
  border: 1px solid rgba(249,246,242,.2); background: rgba(249,246,242,.06); color: rgba(249,246,242,.9);
}
.social-chip .mark.xhs { font-size: 10px; letter-spacing: .02em; color: rgba(249,246,242,.85); }
.social-chip .txt { display: flex; flex-direction: column; gap: 2px; line-height: 1.5; }
.social-chip .t1 { font-size: 15px; color: rgba(249,246,242,.95); letter-spacing: .03em; }
.social-chip .t2 { font-size: 12.5px; color: rgba(249,246,242,.5); }
.social-chip .go { margin-left: auto; color: rgba(249,246,242,.55); font-size: 15px; }


@media (max-width: 900px) {
  /* Mobile 重新排版,而不是等比缩小 */
  .story-panel { padding: 40px 24px 40px; }
  .story-inner { grid-template-columns: 1fr; gap: 34px; align-items: start; }
  .story-sky { background-position: 68% 10%; opacity: .42;
    -webkit-mask-image: radial-gradient(130% 70% at 78% 6%, #000 6%, rgba(0,0,0,.5) 42%, transparent 72%);
            mask-image: radial-gradient(130% 70% at 78% 6%, #000 6%, rgba(0,0,0,.5) 42%, transparent 72%); }
  .story-glow { background: linear-gradient(180deg, rgba(12,21,52,.6) 0%, rgba(12,21,52,.86) 46%, rgba(12,21,52,.92) 100%); }
  .story-title { font-size: clamp(23px, 6vw, 30px); line-height: 1.72; }
  .story-btn { width: 100%; justify-content: center; }
}

/* ---------- 页脚 ---------- */
footer.site { background: transparent; color: rgba(249,246,242,.75); position: relative; overflow: hidden; }
footer .wrap { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; padding-top: 130px; padding-bottom: 52px; }
footer .brand { color: var(--text-light); }
footer .fine { font-size: 12.5px; display: flex; align-items: center; gap: 20px; }
.seal-img { width: 74px; height: auto; opacity: .9; }
@media (max-width: 640px) { footer .wrap { flex-direction: column; gap: 18px; text-align: center; } }

/* ---- assets/inner-sky-chart.css(外链样式表,一并带进 artboard)---- */
/* 我的星空 · 落地页星盘 section */
.isky-card{
  position:relative;
  padding:0;
  border:none;
  overflow:hidden;
  background:#0b1231;
  border-radius:var(--radius-card);
  box-shadow:var(--shadow-card);
  color:#e6dcf4;
}
.isky-bg{position:absolute;inset:0;pointer-events:none;background:url('section-bg.png') center/cover no-repeat;opacity:.85}
.isky-scrim{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(9,14,42,.18) 0%,rgba(9,14,42,.12) 45%,rgba(9,14,42,.55) 100%)}
/* wheel overflows its box slightly for axis labels */
.isky-inner{position:relative;padding:clamp(20px,2vw,28px) clamp(18px,1.8vw,26px) clamp(18px,1.8vw,24px)}
.isky-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.isky-head h4{margin:0;font-family:var(--font-display);font-size:22px;font-weight:500;letter-spacing:.02em;color:#f7f1ff;float:none}
.isky-head h4 .st{color:#e8c877;font-size:.55em;vertical-align:.4em}
.isky-head p{display:none}
.isky-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.isky-btn{cursor:pointer;font-family:var(--font-serif-sc);font-size:12px;letter-spacing:.04em;color:#cdc0e4;background:rgba(255,255,255,.06);border:1px solid rgba(226,196,133,.28);border-radius:999px;padding:7px 13px;transition:.2s}
.isky-btn:hover{background:rgba(255,255,255,.12);color:#f0dcae}
.isky-more{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-serif-sc);font-size:12.5px;letter-spacing:.04em;color:#eed9a8;background:none;border:none;padding:0;transition:.2s;float:none}
.isky-more:hover{color:#fff3d6}
.isky-wheel{position:relative;margin:0 auto}
.isky-wheel svg{position:relative;z-index:1;display:block;width:100%;height:auto;overflow:visible}
.isky-tip,.isky-sign{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);animation:iskyFade .25s ease both}
.isky-tip{min-width:180px;max-width:280px;text-align:center;background:rgba(28,19,56,.82);backdrop-filter:blur(10px);border:1px solid rgba(226,196,133,.24);border-radius:16px;padding:16px 20px;box-shadow:0 14px 40px rgba(8,4,24,.4);pointer-events:none}
.isky-tip .t{font-family:var(--font-serif-sc);font-size:16px;color:#f4eeff;letter-spacing:.03em;margin-bottom:6px}
.isky-tip .b{font-size:13px;color:#bdaedb;line-height:1.7}
.isky-sign{width:min(300px,88%);background:rgba(28,19,56,.86);backdrop-filter:blur(12px);border:1px solid rgba(226,196,133,.26);border-radius:20px;padding:22px 24px;box-shadow:0 18px 50px rgba(8,4,24,.45)}
.isky-sign .row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px}
.isky-sign .ttl{display:flex;align-items:center;gap:10px;font-family:var(--font-serif-sc);font-size:20px;color:#f4eeff;letter-spacing:.04em}
.isky-sign .thumb{width:74px;height:34px;border-radius:6px;flex:none;background-size:cover;background-position:center}
.isky-sign .x{cursor:pointer;border:none;background:none;font-size:16px;color:#8d7fae;padding:2px 4px}
.isky-sign .meta{font-size:12.5px;letter-spacing:.08em;color:#e2c485;margin:0 0 14px}
.isky-sign .body{font-family:var(--font-serif-sc);font-size:13.5px;line-height:1.9;color:#c3b5df;text-wrap:pretty}
.isky-legend{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px 6px;margin:16px auto 0;padding-top:14px;opacity:.92}
.isky-legend .it{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
.isky-legend .ic{width:25px;height:25px;background-size:contain;background-repeat:no-repeat;background-position:center}
.isky-legend .nm{font-family:var(--font-serif-sc);font-size:10.5px;color:rgba(233,225,250,.95);letter-spacing:.02em;white-space:nowrap}
.isky-legend .kw{display:none;font-size:10px;color:rgba(190,178,222,.88);letter-spacing:.01em;line-height:1.4}
.isky-foot{margin:16px 0 0;text-align:center;font-family:var(--font-serif-sc);font-size:11.5px;line-height:1.8;letter-spacing:.04em;color:rgba(214,204,238,.85)}
