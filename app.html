  /* ============================================================
     划词收藏
     · 只在标了 data-saveable 的解读正文里生效
     · 不拦截 copy、不改变浏览器原生 selection 行为
     · Mobile 走原生长按选字,选完同样浮出动作
     ============================================================ */
  let saveTipEl = null, toastEl = null, pendingSel = null;

  function dpToast(msg) {
    if (!toastEl) {
      toastEl = document.createElement("div");
      toastEl.id = "dpToast";
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = msg;
    toastEl.classList.add("on");
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(function () { toastEl.classList.remove("on"); }, 2400);
  }

  function hideSaveTip() {
    if (saveTipEl) saveTipEl.style.display = "none";
    pendingSel = null;
  }

  function ensureSaveTip() {
    if (saveTipEl) return saveTipEl;
    saveTipEl = document.createElement("button");
    saveTipEl.id = "dpSaveTip";
    saveTipEl.type = "button";
    saveTipEl.addEventListener("mousedown", function (ev) { ev.preventDefault(); });
    saveTipEl.addEventListener("click", function () {
      if (!pendingSel) return;
      const p = pendingSel;
      const c = activeChart();
      if (!c) { dpToast(dpT("请先选择一张星盘", "Choose a chart first")); hideSaveTip(); return; }
      const k = favKey(p.source, p.section, p.text);
      if (isFaved(k)) { dpToast(dpT("已经收藏过了 ✦", "Already saved ✦")); hideSaveTip(); return; }
      toggleFav(k, { text: p.text, source: p.source, section: p.section, route: p.route });
      dpToast(dpT("✦ 已收藏到你的星空", "✦ Saved to your sky"));
      hideSaveTip();
      const sel = window.getSelection();
      if (sel) sel.removeAllRanges();
    });
    document.body.appendChild(saveTipEl);
    return saveTipEl;
  }

  document.addEventListener("selectionchange", function () {
    // 交给浏览器完成选择动作后再判断,避免拖拽途中闪烁
    clearTimeout(document._dpSelT);
    document._dpSelT = setTimeout(function () {
      const sel = window.getSelection();
      if (!sel || sel.isCollapsed) { hideSaveTip(); return; }
      const text = String(sel.toString() || "").trim();
      if (text.length < 4) { hideSaveTip(); return; }
      const node = sel.anchorNode;
      const host = node && (node.nodeType === 1 ? node : node.parentElement);
      const box = host && host.closest ? host.closest("[data-saveable]") : null;
      if (!box) { hideSaveTip(); return; }   // 非正文内容不可收藏
      const rect = sel.getRangeAt(0).getBoundingClientRect();
      if (!rect || !rect.width) { hideSaveTip(); return; }
      pendingSel = {
        text: text.slice(0, 600),
        source: box.getAttribute("data-source") || "",
        section: box.getAttribute("data-section") || "",
        route: location.hash || ""
      };
      const tip = ensureSaveTip();
      tip.textContent = "☆ " + dpT("收藏", "Save");
      tip.style.display = "inline-flex";
      const tw = tip.offsetWidth || 78;
      tip.style.left = Math.max(10, Math.min(window.innerWidth - tw - 10,
        rect.left + rect.width / 2 - tw / 2 + window.scrollX)) + "px";
      tip.style.top = (rect.top + window.scrollY - tip.offsetHeight - 10) + "px";
    }, 130);
  });
  window.addEventListener("scroll", hideSaveTip, { passive: true });

            (f.ts ? '<br>' + esc0(f.ts) : "") + '</div>' +
            '<div class="acts">' +
            (back ? '<a href="' + esc0(back) + '">' + dpT("查看原文", "View in context") + ' →</a>' : "") +
            '<button class="rm' + (favConfirmKey === f.key ? " confirm" : "") + '" data-fav-rm="' + k + '">' +
            (favConfirmKey === f.key ? dpT("确定取消?", "Confirm remove?") : dpT("取消收藏", "Remove")) +
            '</button></div></div>';

    dpScaffold({
      chip: dpT("我的收藏", "SAVED"),
      title: dpT("我的收藏", "My Saved Lines"),

               "Some lines are worth returning to at different points in your life."),

    });

    $("dpage").querySelectorAll("[data-fav-filter]").forEach(function (b) {

        favFilter = b.getAttribute("data-fav-filter"); favConfirmKey = null; renderFavoritesPage();
      });
    });
    const sb = $("dpage").querySelector("[data-fav-sort]");
    if (sb) sb.addEventListener("click", function () { favSortNew = !favSortNew; renderFavoritesPage(); });
    // 取消收藏:先确认一次,避免误触永久删除
    $("dpage").querySelectorAll("[data-fav-rm]").forEach(function (b) {
      b.addEventListener("click", function () {

      if (saved) { body = dpAnswerHtml(saved, dpT("人生探索地图", "Life Map")); foot = dpReturnFoot(); }
      else if (mapBusy) body = dpLoading(dpT("正在汇整你的探索地图…", "Drawing your map…"));
      else if (mapErr) body = dpError(mapErr, "dpRetryM");
      else body = '<div class="dp-card dp-loading"><span class="g">✹</span>' +
        dpT("地图还没有生成,请回到主页从「探索地图」开始。", "The map hasn’t been generated yet — start it from the home page.") +
        '<br><a class="dp-cta" style="margin-top:16px" href="' + LANDING_URL + '">' + dpT("回到主页", "Back to home") + "</a></div>";
    }
    dpScaffold({
      chip: dpT("人生探索地图", "LIFE MAP"),
      title: dpT("我的探索地图", "My Exploration Map"),
      sub: dpT("把走过的问题连成一张属于你的地图", "Connecting what you’ve explored into one map of you"),
      body: body, foot: foot, backLabel: dpT("返回主页", "Back to home"), seed: 55
    });
    const rm = document.getElementById("dpRetryM");
    if (rm) rm.addEventListener("click", function () { mapErr = null; toggleMap(); });
  }

  // ---------- 初始化 ----------
  function init() {
    // —— 星空登录页的星点(细小、大小不一、疏密不均)——
    (function () {
      const el = document.getElementById("authStars");
      if (!el) return;
      let s = 987654321;
      const rnd = function () { s = (s * 1103515245 + 12345) % 2147483648; return s / 2147483648; };
      let h = "";
      for (let i = 0; i < 110; i++) {
        const r = rnd();
        const size = r < .72 ? (.6 + rnd() * .6) : (r < .95 ? (1.3 + rnd() * .9) : (2.2 + rnd() * 1.1));
        const op = r < .72 ? (.18 + rnd() * .3) : (r < .95 ? (.4 + rnd() * .3) : (.75 + rnd() * .25));
        h += '<i style="left:' + (rnd() * 100).toFixed(2) + '%;top:' + (rnd() * 100).toFixed(2) +
          '%;width:' + size.toFixed(2) + 'px;height:' + size.toFixed(2) + 'px;--o:' + op.toFixed(2) +
          ';--d:' + (3 + rnd() * 5).toFixed(1) + 's;--delay:' + (rnd() * 6).toFixed(1) + 's"></i>';
      }
      el.innerHTML = h;
    })();

    // —— 语言切换器 ——
    function paintLangBtns() {
      document.querySelectorAll("#langSwitch button").forEach(function (b) {
        b.classList.toggle("on", b.dataset.lang === window.I18N.lang);
      });
    }
    document.querySelectorAll("#langSwitch button").forEach(function (b) {
      b.addEventListener("click", function () { window.I18N.setLang(b.dataset.lang); });
    });
    // 语言变更 → 只重画介面与已存在的内容,不发出任何生成请求
    window.I18N.onChange(function () {
      paintLangBtns();
      closeDrawer();
      renderChartList();
      if (activeChart() && curResult) {
        ensureToggleBar();
        drawWheel();
        drawPosTable();
        curTopic = null; mapOpen = false; curDomain = null; curQ = null;
        renderReading();
        renderTopics();
      }
      applyRoute();   // 独立页面跟随语言切换重绘
    });
    window.I18N.applyStatic();
    paintLangBtns();

    initForm();
    // —— 云端登录门 ——
    function setAuthMsg(t, ok) { const m = $("authMsg"); m.textContent = t || ""; m.style.color = ok ? "var(--gold)" : "var(--fire)"; }
    function enterApp() {
      $("authOverlay").style.display = "none";
      // 页面顶部右上角账号条(位于 header 内,随页面滚动一起离开画面)
      const bar = document.getElementById("acctBar");
      if (bar && !bar.dataset.ready) {
        bar.dataset.ready = "1";
        bar.style.display = "flex";
        bar.innerHTML = '<span></span><button id="logoutBtn" data-i18n="logout"></button>';
        bar.firstChild.textContent = window.Cloud.email();
        document.getElementById("logoutBtn").textContent = T("logout");
        document.getElementById("logoutBtn").addEventListener("click", function () {
          window.Cloud.logout(); location.reload();
        });
      }
      // 拉取偏好与星盘
      Promise.all([
        window.Cloud.loadPrefs().catch(function () { return {}; }),
        window.Cloud.loadCharts().catch(function (e) { console.warn(e); return []; })
      ]).then(function (r) {
        const prefs = r[0] || {};
        store.charts = r[1] || [];
        applyCloudPrefs(prefs);
        if (!store.charts.length) {
          // 首次登录:自动迁移旧本地数据
          return window.Cloud.migrateLegacy().then(function (mig) {
            if (mig.length) store.charts = mig;
          });
        }
      }).then(function () {
        if (!store.activeId || !store.charts.some(c => c.id === store.activeId)) {
          const usable = store.charts.filter(isCompleteBirthData);
          store.activeId = usable.length ? usable[0].id : (store.charts.length ? store.charts[0].id : null);
        }
        chartsLoaded = true;
        renderChartList(); drawActive();
        applyRoute();   // 资料到位后再判断一次受保护路由
        setTimeout(function () { saveWheelSnapshot(); renderFavs(); applyDeepLink(); }, 600);
      });
    }
    $("authLogin").addEventListener("click", function () {
      if (signupMode) {   // 从注册态退回登录态
        signupMode = false;
        $("authIdField").style.display = "none";
        $("authSignup").textContent = T("signup");
        $("authLogin").textContent = T("login");
        setAuthMsg("");
        return;
      }
      const em = $("authEmail").value.trim(), pw = $("authPw").value;
      if (!em || pw.length < 6) { setAuthMsg(T("authNeed")); return; }
      setAuthMsg(T("loggingIn"), true);
      window.Cloud.login(em, pw).then(enterApp).catch(function (e) { setAuthMsg(e.message); });
    });
    // 第一次点「注册」先展开 User ID 栏位,第二次才真的送出
    let signupMode = false;
    $("authSignup").addEventListener("click", function () {
      if (!signupMode) {
        signupMode = true;
        $("authIdField").style.display = "";
        $("authSignup").textContent = T("signupGo");
        $("authLogin").textContent = T("backToLogin");
        setAuthMsg("");
        $("authUserId").focus();
        return;
      }
      const em = $("authEmail").value.trim(), pw = $("authPw").value, uid = $("authUserId").value.trim();
      if (!em || pw.length < 6) { setAuthMsg(T("authNeed")); return; }
      if (!uid) { setAuthMsg(T("userIdNeed")); return; }
      setAuthMsg(T("signingUp"), true);
      try { localStorage.setItem("inner_sky_userid_v1", uid); } catch (e) { }
      window.Cloud.signup(em, pw, uid).then(function (r) {
        if (r.loggedIn) enterApp();
        else setAuthMsg(T("signupOk"), true);
      }).catch(function (e) { setAuthMsg(e.message); });
    });
    $("authPw").addEventListener("keydown", function (e) { if (e.key === "Enter") $("authLogin").click(); });
    // 已有会话:静默续期后直接进入
    if (window.Cloud.hasSession()) {
      // 乐观进入:令牌已在本地,先放行,不闪 Login Page
      enterApp();
      window.Cloud.refresh().catch(function () {
        // 令牌失效才回到登录页
        $("authOverlay").style.display = "";
      });
    } else {
      $("authOverlay").style.display = "";
    }
    // —— 解读面板按钮 ——
    function copyText(txt, btn, okLabel) {
      function done() { const t = btn.textContent; btn.textContent = okLabel; setTimeout(function () { btn.textContent = t; }, 1800); }
      function fallback() {
        const ta = document.createElement("textarea");
        ta.value = txt; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); done(); } catch (e) { }
        document.body.removeChild(ta);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback);
      else fallback();
    }
    $("mapBtn").addEventListener("click", toggleMap);
    // 「你的人生章节」整区收合
    $("topicHead").addEventListener("click", function () {
      const g = $("topicGrid");
      const closed = g.style.display === "none";
      g.style.display = closed ? "" : "none";
      $("topicArrow").textContent = closed ? "\u2227" : "\u2228";
    });
    // 「人生探索地图」整区收合(Version 1 隐藏中,事件保留)
    $("qaHead").addEventListener("click", function () {
      if (!SHOW_EXPLORATION_MAP) return;
      qaOpen = !qaOpen;
      renderQA();
    });
    $("posHead").addEventListener("click", function () {
      const tb = $("posTable");
      const closed = tb.style.display === "none";
      tb.style.display = closed ? "" : "none";
      $("posArrow").textContent = closed ? "\u2227" : "\u2228";
    });
    document.querySelectorAll("#sysSeg button").forEach(function (b) {
      b.addEventListener("click", function () {
        const c = activeChart();
        if (!c) return;
        c.sys = b.dataset.sys;
        window.Cloud.updateChart(c).catch(function (e) { console.warn(T("syncFail"), e); });
        drawActive();
      });
    });
    $("drawerX").addEventListener("click", closeDrawer);
    $("scrim").addEventListener("click", closeDrawer);
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDrawer(); });
    renderChartList();
    drawActive();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();

</script>
</body>
</html>
