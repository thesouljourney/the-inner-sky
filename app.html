      const other = res.planets[a.a].key === p.key ? res.planets[a.b] : res.planets[a.a];

    }).join("<br>") : T("noAspects");

      '<div class="d-glyph">' + glyphCell(p, 40, "#a8792a") + "</div>" +

      '<div class="d-kw">' + (x.house ? T("inHouse", x.house) : "") + (x.retro ? " · " + T("retro") : "") + "</div>" +

      erisHtml

  // ---------- 初始空盘:十二宫从白羊开始(第一宫),不画任何行星 ----------
  function drawEmptyWheel() {
    const svg = $("emptyWheel");
    if (!svg) return;
    svg.innerHTML = "";
    // curResult 为 null 时 pt() 以 0° 为上升 → 白羊 0° 恰在第一宫起点
    el("circle", { cx: CX, cy: CY, r: R_EDGE, fill: "var(--w-face)", stroke: "var(--line)", "stroke-width": 1.4 }, svg);
    for (let i = 0; i < 12; i++) {
      const a0 = i * 30, a1 = a0 + 30;
      const [x0, y0] = pt(R_EDGE, a0), [x1, y1] = pt(R_EDGE, a1);
      const [xi1, yi1] = pt(R_ZI, a1), [xi0, yi0] = pt(R_ZI, a0);
      el("path", {
        d: `M ${x0} ${y0} A ${R_EDGE} ${R_EDGE} 0 0 0 ${x1} ${y1} L ${xi1} ${yi1} A ${R_ZI} ${R_ZI} 0 0 1 ${xi0} ${yi0} Z`,
        fill: ELEM_TINT[C.SIGNS[i].elem], "fill-opacity": .14, stroke: "none"
      }, svg);
    }
    el("circle", { cx: CX, cy: CY, r: R_ZI, fill: "none", stroke: "var(--line)", "stroke-width": 1.2 }, svg);
    el("circle", { cx: CX, cy: CY, r: R_CORE, fill: "var(--w-core)", stroke: "var(--line)", "stroke-width": 1 }, svg);
    for (let i = 0; i < 12; i++) {
      const lonB = i * 30;
      // 星座分隔线 + 符号
      const [x0, y0] = pt(R_ZI, lonB), [x1, y1] = pt(R_EDGE, lonB);
      el("line", { x1: x0, y1: y0, x2: x1, y2: y1, stroke: "var(--line)", "stroke-width": 1 }, svg);
      const [gx, gy] = pt(276, lonB + 15);
      svg.appendChild(GL.symbolGroup(svgNS, C.SIGNS[i].glyph, gx, gy, 20, "var(--w-sglyph)"));
      // 宫界线(整宫制:与星座界重合)+ 宫号 1~12
      const [hx0, hy0] = pt(R_CORE, lonB), [hx1, hy1] = pt(R_ZI, lonB);
      el("line", { x1: hx0, y1: hy0, x2: hx1, y2: hy1, stroke: "var(--w-cusp)", "stroke-width": 1 }, svg);
      const [nx, ny] = pt(R_CORE + 16, lonB + 15);
      const num = el("text", { x: nx, y: ny + 4, "text-anchor": "middle", "font-size": 12.5, fill: "var(--w-hnum)" }, svg);
      num.textContent = i + 1;
    }
  }

  // 解读面板:有完整解读显示五章,否则显示本地简版
  // ---------- 故障诊断:一眼看出卡在哪一环 ----------
  function diagnose(err) {
    const cfg = window.CloudCfg || {};
    const msg = (err && err.message) || String(err || "");
    return fetch(cfg.funcUrl, { method: "GET", headers: { "apikey": cfg.anon } })
      .then(function (r) { return r.text().then(function (t) { return { status: r.status, text: t }; }); })
      .catch(function (e) { return { status: 0, text: String(e) }; })
      .then(function (probe) {
        let hint = "", detail = "";
        try {
          const o = JSON.parse(probe.text);
          if (o.anthropic_key_set === false) hint = T("dgNoKey");
          else if (o.function) detail = T("dgFnVer") + o.function;
        } catch (e) { }
        if (!hint) {
          if (probe.status === 401 || /401/.test(msg)) hint = T("dg401");
          else if (probe.status === 404 || /404/.test(msg)) hint = T("dg404");
          else if (probe.status === 0) hint = T("dg0");
          else if (/502/.test(msg)) hint = T("dg502");
          else if (/504|timeout|时/.test(msg)) hint = T("dg504");
          else if (/解析|截断/.test(msg)) hint = T("dgParse");
        }
        return { hint: hint || T("dgUnknown"), raw: msg, probe: probe.status, detail: detail };
      });
  }

  // ── 收藏 ──────────────────────────────────────────────
  // 保存:文字、来源主题、来源章节、时间。存在 chart.favs,随既有云同步走。
  function favList() { const c = activeChart(); return (c && c.favs) || []; }
  function favKey(src, title, text) { return src + "|" + title + "|" + String(text).slice(0, 40); }
  function isFaved(k) { return favList().some(function (f) { return f.key === k; }); }
  function toggleFav(k, payload) {
    const c = activeChart();
    if (!c) return false;
    c.favs = c.favs || [];
    const i = c.favs.findIndex(function (f) { return f.key === k; });
    if (i >= 0) c.favs.splice(i, 1);
    else c.favs.unshift(Object.assign({ key: k, ts: new Date().toISOString().slice(0, 10) }, payload));
    window.Cloud.updateChart(c).catch(function () { });
    saveProfileCache();
    renderFavs();
    return i < 0;
  }
  function favButton(k) {
    return '<button class="fav-btn' + (isFaved(k) ? " on" : "") + '" data-fav="' + esc0(k) + '" title="' + esc0(T("saveIt")) + '">' +
      (isFaved(k) ? "★" : "☆") + '</button>';
  }
  // 事件委派:任何解读区块里的收藏按钮都能用
  document.addEventListener("click", function (ev) {
    const b = ev.target.closest && ev.target.closest("[data-fav]");

    ev.preventDefault();
    const payload = {
      text: b.getAttribute("data-text") || "",
      source: b.getAttribute("data-source") || "",
      section: b.getAttribute("data-section") || ""
    };
    const on = toggleFav(b.getAttribute("data-fav"), payload);
    b.textContent = on ? "★" : "☆";

  });

  function answerHtml(data) {
    let h = '<div style="padding:2px 2px 4px">';
    if (data.tagline)
      h += '<div style="font-size:15px;line-height:1.85;color:var(--parchment);padding:14px 16px;margin:0 0 16px;border-left:2px solid var(--gold-soft);background:rgba(var(--accent-rgb),.06);border-radius:0 9px 9px 0">' + esc0(data.tagline) + "</div>";
    // 每一段标题旁挂收藏按钮:保存这一段文字、来源主题、来源章节与时间

  // 展开/收合后保持点击项在视窗中的位置
  function keepPosition(anchorId, fn) {
    const before = document.getElementById(anchorId);
    const top0 = before ? before.getBoundingClientRect().top : null;
    fn();
    if (top0 === null) return;
    const after = document.getElementById(anchorId);
    if (!after) return;
    const delta = after.getBoundingClientRect().top - top0;
    if (Math.abs(delta) < 1) return;
    const sc = document.getElementById("main");
    if (sc && sc.scrollHeight > sc.clientHeight) sc.scrollTop += delta;
    else window.scrollBy(0, delta);
  }

  // 由使用者主动触发的生成(不会覆盖任何既有语言版本)
  function generateTopic(tid) {
    const c = activeChart();
    if (!c || !curResult || topicBusy) return;
    const TK = window.Reading.LK("topics");
    curTopic = tid;
    topicBusy = true; topicErrs[tid] = null;
    routeRefresh();
    const fpSeed = [c.date, c.time, c.lat.toFixed(4), c.lon.toFixed(4)].join("|");
    // 英文以中文版为源本,缺中文时先补齐中文
    const needSrc = window.I18N.isEN() && !window.Reading.hasChinese(c, "topic", tid);
    const job = needSrc
      ? window.Reading.fetchTopic(curResult, tid, fpSeed, c.reading, c.topics, c, "zh").then(function (zhData) {
          zhData.ver = window.Reading.CONTENT_VER;
          if (window.Reading.guardWriteZh(c, "topic", tid, zhData)) {
            window.Cloud.updateChart(c).catch(function () { });
          }
          return window.Reading.fetchTopic(curResult, tid, fpSeed, c[window.Reading.LK("reading")], c[TK], c, "en");
        })
      : window.Reading.fetchTopic(curResult, tid, fpSeed, c[window.Reading.LK("reading")], c[TK], c);
    job.then(function (data) {
      topicBusy = false;
      if (!activeChart() || activeChart().id !== c.id) return;
      c[TK] = c[TK] || {};
      data.ver = window.Reading.CONTENT_VER;
      c[TK][tid] = data;
      window.Cloud.updateChart(c).catch(function (e) { console.warn("cloud", e); });
      renderTopics(); routeRefresh();
    }).catch(function (e) {
      topicBusy = false;
      topicErrs[tid] = { msg: (e && e.message) || String(e), hint: "" };
      routeRefresh();
      diagnose(e).then(function (d) {
        if (topicErrs[tid]) { topicErrs[tid].hint = d.hint; routeRefresh(); }
      });
    });
  }

  let autoGenBusy = false;
  function renderReading(retrying, forceGen) {
    const c = activeChart(), body = $("nineBody");
    if (!c || !curResult) { body.innerHTML = ""; return; }
    const RK = window.Reading.LK("reading");
    const revived = window.Reading.reviveReading(c[RK]);
    if (revived) {
      if (revived !== c[RK]) {          // 本地修复成功:回存,以后直接可用
        c[RK] = revived;
        window.Cloud.updateChart(c).catch(function () { });
      }
      renderBlueprintEntry(revived, body);   // 主页只放入口卡,全文在 #/reading 独立页面
      $("readState").textContent = "";
      renderTopics();
      routeRefresh();
      return;
    }
    // 英文版本尚未生成时,不自动呼叫 AI:显示按钮,由使用者决定。
    // 中文维持原本行为(首次开盘自动整理),既有资料一律直接读取。
    if (window.I18N.isEN() && !autoGenBusy && !forceGen) {
      body.innerHTML = "";
      $("readState").textContent = "";
      const box = document.createElement("div");
      box.innerHTML = missingLangHtml("bpGen");
      body.appendChild(box);
      const bg = document.getElementById("bpGen");
      if (bg) bg.addEventListener("click", function () { renderReading(false, true); });
      renderTopics();
      return;
    }
    if (window.Reading.hasSupabase() && !autoGenBusy) {
      autoGenBusy = true;
      body.innerHTML = '<div style="padding:30px 8px;text-align:center;color:var(--muted);font-size:13px;line-height:2">' +
        '<div style="font-size:22px;color:var(--gold);margin-bottom:10px">✶</div>' +
        (retrying ? T("regenerating") : T("genBlueprint")) +
        '<br><span style="font-size:11.5px;opacity:.75">' + T("firstTimeHint") + '</span></div>';
      $("readState").textContent = "";
      const fpSeed = [c.date, c.time, c.lat.toFixed(4), c.lon.toFixed(4)].join("|");
      // 中文是 source of truth:要产出英文而中文版尚未存在时,
      // 先产生中文来源并保存(它本身就是完整的中文解读),再据以改写英文。
      const needSource = window.I18N.isEN() && !window.Reading.hasChinese(c, "blueprint");
      const job = needSource
        ? window.Reading.fetchReading(curResult, fpSeed, c, "zh").then(function (zhParsed) {
            var zhVal = Object.assign({ ts: new Date().toISOString().slice(0, 10), ver: window.Reading.CONTENT_VER }, zhParsed);
            if (window.Reading.guardWriteZh(c, "blueprint", null, zhVal)) {
              window.Cloud.updateChart(c).catch(function () { });
            }
            return window.Reading.fetchReading(curResult, fpSeed, c, "en");
          })
        : window.Reading.fetchReading(curResult, fpSeed, c);
      job
        .then(function (parsed) {
          autoGenBusy = false;
          if (!activeChart() || activeChart().id !== c.id) return;
          c[RK] = Object.assign({ ts: new Date().toISOString().slice(0, 10), ver: window.Reading.CONTENT_VER }, parsed);   // 含 raw 原文
          window.Cloud.updateChart(c).catch(function (e) { console.warn(T("syncFail"), e); });
          renderReading();
        })
        .catch(function (e) {
          autoGenBusy = false;
          if (!retrying) { setTimeout(function () { renderReading(true, true); }, 1500); return; }
          // 两次都失败:给出说明与重试入口
          body.innerHTML = "";
          $("readState").textContent = "";
          const tip = document.createElement("div");
          tip.style.cssText = "margin-top:16px;padding:12px 14px;border:1px dashed var(--line);border-radius:10px;font-size:12.5px;color:var(--muted);line-height:1.8";
          tip.innerHTML = esc0(T("failed")) + '<a href="#" id="againLink" style="color:var(--gold)">' + esc0(T("tryAgain")) + '</a>' +
            '<div id="diagBox" style="margin-top:8px;font-size:11.5px;opacity:.8"></div>';
          body.appendChild(tip);
          routeRefresh();
          const a2 = document.getElementById("againLink");
          if (a2) a2.addEventListener("click", function (ev) { ev.preventDefault(); renderReading(false, true); });
          diagnose(e).then(function (d) {
            const box = document.getElementById("diagBox");
            if (box) box.innerHTML = T("diagnosis") + d.hint + '<br><span style="opacity:.65">(' + d.raw + T("probe") + d.probe + " " + d.detail + ")</span>";
          });
        });
    } else if (!autoGenBusy) {
      body.innerHTML = '<div style="padding:24px 8px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.9">' + esc0(T("noService")) + '</div>';
    }
  }

  // ---------- 蓝图入口卡(主页):全文移到 #/reading 独立页面 ----------
  function renderBlueprintEntry(r, body) {
    const chs = r.chapters || [];
    function chName(ch, i) {
      return ch.title || ((window.I18N.isEN() ? "Chapter " : "第" + "一二三四五"[i]) + (window.I18N.isEN() ? String(i + 1) : "章"));
    }
    body.innerHTML =
      '<div style="padding:6px 2px 2px">' +
      (r.spine ? '<div style="font-size:14.5px;line-height:2;color:var(--parchment);padding:12px 16px;margin:0 0 14px;border-left:2px solid var(--gold-soft);background:rgba(var(--accent-rgb),.05);border-radius:0 10px 10px 0">' + esc0(r.spine) + '</div>' : "") +
      '<div style="display:grid;gap:7px;margin-bottom:14px">' +
      chs.map(function (ch, i) {
        return '<a href="#/reading/' + i + '" style="display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--line);border-radius:11px;text-decoration:none;color:var(--parchment);background:var(--card-soft)">' +
          '<span style="color:var(--gold);font-size:12px">✦</span>' +
          '<span style="font-size:13.5px;font-weight:600">' + esc0(chName(ch, i)) + '</span>' +

  let readingTab = 0;
  let curRoute = null;

  function dpT(zh, en) { return window.I18N.isEN() ? en : zh; }

  function parseRoute() {
    const h = location.hash || "";
    let m;
    if ((m = h.match(/^#\/topic\/([a-z]+)$/))) return { k: "topic", id: m[1] };
    if ((m = h.match(/^#topic-([a-z]+)$/))) return { k: "topic", id: m[1] };
    if ((m = h.match(/^#\/q\/(q\d\d)$/))) return { k: "q", id: m[1] };
    if ((m = h.match(/^#\/reading(?:\/(\d))?$/))) return { k: "reading", tab: m[1] ? +m[1] : 0 };
    if (h === "#/map") return { k: "map" };
    return null;
  }
  function applyRoute() {
    curRoute = parseRoute();
    const dp = $("dpage");
    if (!dp) return;
    if (!curRoute) {
      dp.style.display = "none";
      document.body.classList.remove("dp-open");
      return;
    }
    document.body.classList.add("dp-open");
    dp.style.display = "";
    window.scrollTo(0, 0);
    renderRoute();
  }
  function routeRefresh() { if (curRoute) renderRoute(); }
  function renderRoute() {
    const r = curRoute;
    if (!r) return;
    if (r.k === "topic") renderTopicPage(r.id);
    else if (r.k === "q") renderQPage(r.id);
    else if (r.k === "reading") { readingTab = r.tab || 0; renderReadingPage(); }
    else if (r.k === "map") renderMapPage();
  }
  window.addEventListener("hashchange", applyRoute);
  applyRoute();   // 冷启动带路由 hash 时立即渲染(登录后 applyDeepLink 会再刷新一次)

  function dpStars(n, seed) {
    let sd = (seed || 7) * 977 + 13, h = "";
    const rnd = function () { sd = (sd * 1103515245 + 12345) % 2147483648; return sd / 2147483648; };
    for (let i = 0; i < n; i++) {
      const r = rnd();
      const size = r < .7 ? (.6 + rnd() * .7) : (r < .94 ? (1.3 + rnd()) : (2.2 + rnd() * 1.2));
      const op = r < .7 ? (.16 + rnd() * .3) : (.45 + rnd() * .4);
      h += '<i style="left:' + (rnd() * 100).toFixed(2) + '%;top:' + (rnd() * 100).toFixed(2) +
        '%;width:' + size.toFixed(2) + 'px;height:' + size.toFixed(2) + 'px;--o:' + op.toFixed(2) +
        ';--d:' + (3 + rnd() * 5).toFixed(1) + 's;--delay:' + (rnd() * 6).toFixed(1) + 's"></i>';
    }
    return '<div class="dp-stars" aria-hidden="true">' + h + "</div>";
  }
  function dpScaffold(o) {
    $("dpage").innerHTML =
      '<div class="dp-hero">' + dpStars(90, o.seed || 7) +
      '<div class="dp-topbar"><span class="dp-brand"><span class="s">✶</span> INNER SKY</span>' +
      '<a class="dp-back" href="#">← ' + esc0(o.backLabel || dpT("返回主页", "Back")) + '</a></div>' +
      '<div class="dp-hero-grid"><div>' +
      (o.chip ? '<span class="dp-chip">' + esc0(o.chip) + '</span>' : "") +
      '<h1 class="dp-title">' + esc0(o.title || "") + '</h1>' +
      (o.sub ? '<div class="dp-sub">' + esc0(o.sub) + '</div>' : "") +
      '</div>' +
      (o.art ? '<img class="dp-hero-art" src="' + o.art + '" alt="">' : "") +
      '</div></div>' +
      '<div class="dp-body">' + (o.body || "") + (o.foot || "") + '</div>';
  }
  function dpPara(x) {
    return esc0(x).split(/\n\s*\n|\n/).filter(function (y) { return y.trim(); })
      .map(function (y) { return "<p>" + y.trim() + "</p>"; }).join("");
  }
  function dpAnswerHtml(data, favSource) {
    let h = "";
    if (data.tagline)
      h += '<div class="dp-card"><div class="dp-quote"><span class="q">“</span>' + esc0(data.tagline) + "</div></div>";
    h += '<div class="dp-card"><div class="dp-sec-label">' + dpT("主题解读", "READING") + "</div>";
    h += (data.sections || []).map(function (sc) {
      const k = favKey(favSource, sc.title || "", sc.body || "");
      const btn = '<button class="fav-btn' + (isFaved(k) ? " on" : "") + '" data-fav="' + esc0(k) +
        '" data-text="' + esc0(String(sc.body || "").slice(0, 300)) + '" data-source="' + esc0(favSource) +
        '" data-section="' + esc0(sc.title || "") + '" title="' + esc0(T("saveIt")) + '">' + (isFaved(k) ? "★" : "☆") + "</button>";
      return '<div style="margin:0 0 22px"><div class="dp-h-row">' +
        (sc.title ? '<h3 class="dp-h">' + esc0(sc.title) + "</h3>" : "<span></span>") + btn + "</div>" +
        '<div class="dp-prose">' + dpPara(sc.body) + "</div></div>";
    }).join("");
    h += "</div>";
    if (data.steps && data.steps.length)
      h += '<div class="dp-card"><div class="dp-sec-label">' + dpT("从这里开始", "WHERE TO START") + '</div><div class="dp-steps">' +
        data.steps.map(function (st, i) {
          return '<div class="st"><b>' + (i + 1) + " · " + esc0(st.title) + "</b><div>" + dpPara(st.body) + "</div></div>";
        }).join("") + "</div></div>";
    if (data.aha && data.aha.length)
      h += '<div class="dp-card"><div class="dp-sec-label">' + dpT("值得记住", "WORTH KEEPING") + '</div><div class="dp-aha">' +
        data.aha.map(function (q) { return '<div class="a">' + esc0(q) + "</div>"; }).join("") + "</div></div>";
    if (data.question || data.action)
      h += '<div class="dp-think">' +
        (data.question ? '<div class="t">' + dpT("留给你的思考", "A QUESTION FOR YOU") + '</div><div class="dp-prose">' + dpPara(data.question) + "</div>" : "") +
        (data.action ? '<div class="dp-prose" style="margin-top:8px"><b style="font-weight:500">' + dpT("试试看:", "Try this: ") + "</b>" + esc0(data.action) + "</div>" : "") +
        "</div>";
    return h;
  }

    const list = window.Reading.TOPICS9, idx = list.indexOf(t);
    const prev = list[(idx + list.length - 1) % list.length], next = list[(idx + 1) % list.length];
    const tName = window.I18N.TTopic(tid, "name") || t.name;
    const tSub = window.I18N.TTopic(tid, "sub") || t.sub;
    const tTeaser = window.I18N.TTopic(tid, "teaser") || t.teaser;
    const c = activeChart();
    let body;
    if (!c || !curResult) body = dpNeedChart();
    else {
      const saved = window.Reading.reviveTopic((c[window.Reading.LK("topics")] || {})[tid]);
      if (saved) body = dpAnswerHtml(saved, tName);
      else if (topicBusy) body = dpLoading(dpT("正在为你整理这一章,大约需要一分钟…", "Preparing this chapter for you — about a minute…"));
      else if (topicErrs[tid]) body = dpError(topicErrs[tid], "dpRetryT");

    const foot =
      '<div class="dp-footnav">' +
      '<a href="#/topic/' + prev.id + '"><small>' + dpT("上一个主题", "Previous") + "</small>" + esc0(window.I18N.TTopic(prev.id, "name") || prev.name) + "</a>" +
      '<span class="pos">' + (idx + 1) + " / " + list.length + "</span>" +
      '<a class="nx" href="#/topic/' + next.id + '"><small>' + dpT("下一个主题", "Next") + "</small>" + esc0(window.I18N.TTopic(next.id, "name") || next.name) + "</a></div>" +

  // ---------- 初始化 ----------
  function init() {
    // —— 星空登录页的星点(细小、大小不一、疏密不均)——
    (function () {
      const el = document.getElementById("authStars");
      if (!el) return;
      let s = 987654321;
      const rnd = function () { s = (s * 1103515245 + 12345) % 2147483648; return s / 2147483648; };
      let h = "";
      for (let i = 0; i < 110; i++) {
        const r = rnd();
        const size = r < .72 ? (.6 + rnd() * .6) : (r < .95 ? (1.3 + rnd() * .9) : (2.2 + rnd() * 1.1));
        const op = r < .72 ? (.18 + rnd() * .3) : (r < .95 ? (.4 + rnd() * .3) : (.75 + rnd() * .25));
        h += '<i style="left:' + (rnd() * 100).toFixed(2) + '%;top:' + (rnd() * 100).toFixed(2) +
          '%;width:' + size.toFixed(2) + 'px;height:' + size.toFixed(2) + 'px;--o:' + op.toFixed(2) +
          ';--d:' + (3 + rnd() * 5).toFixed(1) + 's;--delay:' + (rnd() * 6).toFixed(1) + 's"></i>';
      }
      el.innerHTML = h;
    })();

    // —— 语言切换器 ——
    function paintLangBtns() {
      document.querySelectorAll("#langSwitch button").forEach(function (b) {
        b.classList.toggle("on", b.dataset.lang === window.I18N.lang);
      });
    }
    document.querySelectorAll("#langSwitch button").forEach(function (b) {
      b.addEventListener("click", function () { window.I18N.setLang(b.dataset.lang); });
    });
    // 语言变更 → 只重画介面与已存在的内容,不发出任何生成请求
    window.I18N.onChange(function () {
      paintLangBtns();
      closeDrawer();
      renderChartList();
      if (activeChart() && curResult) {
        ensureToggleBar();
        drawWheel();
        drawPosTable();
        curTopic = null; mapOpen = false; curDomain = null; curQ = null;
        renderReading();
        renderTopics();
      }
      applyRoute();   // 独立页面跟随语言切换重绘
    });
    window.I18N.applyStatic();
    paintLangBtns();

    initForm();
    // —— 云端登录门 ——
    function setAuthMsg(t, ok) { const m = $("authMsg"); m.textContent = t || ""; m.style.color = ok ? "var(--gold)" : "var(--fire)"; }
    function enterApp() {
      $("authOverlay").style.display = "none";
      // 页面顶部右上角账号条(位于 header 内,随页面滚动一起离开画面)
      const bar = document.getElementById("acctBar");
      if (bar && !bar.dataset.ready) {
        bar.dataset.ready = "1";
        bar.style.display = "flex";
        bar.innerHTML = '<span></span><button id="logoutBtn" data-i18n="logout"></button>';
        bar.firstChild.textContent = window.Cloud.email();
        document.getElementById("logoutBtn").textContent = T("logout");
        document.getElementById("logoutBtn").addEventListener("click", function () {
          window.Cloud.logout(); location.reload();
        });
      }
      // 拉取偏好与星盘
      Promise.all([
        window.Cloud.loadPrefs().catch(function () { return {}; }),
        window.Cloud.loadCharts().catch(function (e) { console.warn(e); return []; })
      ]).then(function (r) {
        const prefs = r[0] || {};
        store.charts = r[1] || [];
        applyCloudPrefs(prefs);
        if (!store.charts.length) {
          // 首次登录:自动迁移旧本地数据
          return window.Cloud.migrateLegacy().then(function (mig) {
            if (mig.length) store.charts = mig;
          });
        }
      }).then(function () {
        if (!store.activeId || !store.charts.some(c => c.id === store.activeId))
          store.activeId = store.charts.length ? store.charts[0].id : null;
        renderChartList(); drawActive();
        setTimeout(function () { saveWheelSnapshot(); renderFavs(); applyDeepLink(); }, 600);
      });
    }
    $("authLogin").addEventListener("click", function () {
      if (signupMode) {   // 从注册态退回登录态
        signupMode = false;
        $("authIdField").style.display = "none";
        $("authSignup").textContent = T("signup");
        $("authLogin").textContent = T("login");
        setAuthMsg("");
        return;
      }
      const em = $("authEmail").value.trim(), pw = $("authPw").value;
      if (!em || pw.length < 6) { setAuthMsg(T("authNeed")); return; }
      setAuthMsg(T("loggingIn"), true);
      window.Cloud.login(em, pw).then(enterApp).catch(function (e) { setAuthMsg(e.message); });
    });
    // 第一次点「注册」先展开 User ID 栏位,第二次才真的送出
    let signupMode = false;
    $("authSignup").addEventListener("click", function () {
      if (!signupMode) {
        signupMode = true;
        $("authIdField").style.display = "";
        $("authSignup").textContent = T("signupGo");
        $("authLogin").textContent = T("backToLogin");
        setAuthMsg("");
        $("authUserId").focus();
        return;
      }
      const em = $("authEmail").value.trim(), pw = $("authPw").value, uid = $("authUserId").value.trim();
      if (!em || pw.length < 6) { setAuthMsg(T("authNeed")); return; }
      if (!uid) { setAuthMsg(T("userIdNeed")); return; }
      setAuthMsg(T("signingUp"), true);
      try { localStorage.setItem("inner_sky_userid_v1", uid); } catch (e) { }
      window.Cloud.signup(em, pw, uid).then(function (r) {
        if (r.loggedIn) enterApp();
        else setAuthMsg(T("signupOk"), true);
      }).catch(function (e) { setAuthMsg(e.message); });
    });
    $("authPw").addEventListener("keydown", function (e) { if (e.key === "Enter") $("authLogin").click(); });
    // 已有会话:静默续期后直接进入
    if (window.Cloud.hasSession()) {
      window.Cloud.refresh().then(enterApp).catch(function () { /* 停留在登录页 */ });
    }
    // —— 解读面板按钮 ——
    function copyText(txt, btn, okLabel) {
      function done() { const t = btn.textContent; btn.textContent = okLabel; setTimeout(function () { btn.textContent = t; }, 1800); }
      function fallback() {
        const ta = document.createElement("textarea");
        ta.value = txt; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); done(); } catch (e) { }
        document.body.removeChild(ta);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback);
      else fallback();
    }
    $("mapBtn").addEventListener("click", toggleMap);
    // 「你的人生章节」整区收合
    $("topicHead").addEventListener("click", function () {
      const g = $("topicGrid");
      const closed = g.style.display === "none";
      g.style.display = closed ? "" : "none";
      $("topicArrow").textContent = closed ? "\u2227" : "\u2228";
    });
    // 「人生探索地图」整区收合(Version 1 隐藏中,事件保留)
    $("qaHead").addEventListener("click", function () {
      if (!SHOW_EXPLORATION_MAP) return;
      qaOpen = !qaOpen;
      renderQA();
    });
    $("posHead").addEventListener("click", function () {
      const tb = $("posTable");
      const closed = tb.style.display === "none";
      tb.style.display = closed ? "" : "none";
      $("posArrow").textContent = closed ? "\u2227" : "\u2228";
    });
    document.querySelectorAll("#sysSeg button").forEach(function (b) {
      b.addEventListener("click", function () {
        const c = activeChart();
        if (!c) return;
        c.sys = b.dataset.sys;
        window.Cloud.updateChart(c).catch(function (e) { console.warn(T("syncFail"), e); });
        drawActive();
      });
    });
    $("drawerX").addEventListener("click", closeDrawer);
    $("scrim").addEventListener("click", closeDrawer);
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDrawer(); });
    renderChartList();
    drawActive();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();

</script>
</body>
</html>
