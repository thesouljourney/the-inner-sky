      { id: "q22", q: "我的情绪到底怎么运作?" },
      { id: "q23", q: "我的安全感来自哪里?" },
      { id: "q24", q: "我最需要突破什么?" },
      { id: "q25", q: "我的隐藏潜力是什么?" }
    ]},
    { id: "soul", icon: "\u2728", name: "灵魂探索", lead: "如果越来越理解自己,我会成为谁?", items: [
      { id: "q26", q: "我为什么来到这里?" },
      { id: "q27", q: "我的人生使命是什么?" },
      { id: "q28", q: "我的幸运藏在哪里?" },
      { id: "q29", q: "我的人生什么时候开始改变?" },
      { id: "q30", q: "我真正该活成什么样子?", sub: "整份内容的收束" }
    ]}
  ];
  const ALL_Q = [];
  DOMAINS.forEach(function (d) { d.items.forEach(function (it) { ALL_Q.push(Object.assign({ domain: d.id, domainName: d.name, icon: d.icon }, it)); }); });
  function findQ(qid) { return ALL_Q.find(x => x.id === qid) || null; }

  // ---------- 解析服务端返回 ----------
  const CH_TITLES_ZH = ["你生命最初的设定", "你如何面对世界", "你成长路上的礼物与考验", "生命想带你去的地方", "属于你的生命剧本"];
  // 仅用于「服务端回传缺标题」时的备用文案,不影响任何生成逻辑
  function chTitles() {
    return (window.I18N && window.I18N.lang === "en") ? window.I18N.CH_TITLES_EN : CH_TITLES_ZH;
  }
  const CH_TITLES = CH_TITLES_ZH;
  function parseChapters(txt) {
    txt = String(txt || "").trim();
    const m = txt.match(/\{[\s\S]*\}/);
    if (m) {
      try {
        const o = JSON.parse(m[0]);
        if (o.chapters && o.chapters.length >= 3)
          return {
            spine: String(o.spine || "").trim(),
            cards: Array.isArray(o.cards) ? o.cards.map(c => ({ title: String(c.title || "").trim(), line: String(c.line || "").trim() })).filter(c => c.title && c.line) : [],
            chapters: o.chapters.slice(0, 5).map((c, i) => ({
              title: c.title || chTitles()[i],
              summary: String(c.summary || "").trim(),
              body: String(c.body || "").trim()
            }))
          };
      } catch (e) { }
    }
    const parts = txt.split(/第[一二三四五]章[|｜:：·\s]*/).filter(p => p.trim());
    if (parts.length >= 3)
      return { spine: "", cards: [], chapters: parts.slice(0, 5).map(function (p, i) {
        const lines = p.trim().split("\n");
        let title = lines[0].replace(/[#*■\s]+/g, "").slice(0, 20);
        let body = p.trim();
        if (title && CH_TITLES.some(t => title.indexOf(t) !== -1 || t.indexOf(title) !== -1)) body = lines.slice(1).join("\n").trim();
        else title = chTitles()[i];
        return { title: title, summary: "", body: body };
      }) };
    return null;
  }
  function parseTopic(txt) {
    const m = String(txt || "").match(/\{[\s\S]*\}/);
    if (!m) return null;
    try {
      const o = JSON.parse(m[0]);
      if (!Array.isArray(o.sections) || !o.sections.length) return null;
      return {
        tagline: String(o.tagline || "").trim(),
        sections: o.sections.map(x => ({ title: String(x.title || "").trim(), body: String(x.body || "").trim() })).filter(x => x.body),
        aha: Array.isArray(o.aha) ? o.aha.map(x => String(x).trim()).filter(Boolean) : [],
        steps: Array.isArray(o.steps) ? o.steps.map(x => ({ title: String(x.title || "").trim(), body: String(x.body || "").trim() })).filter(x => x.body) : [],
        question: String(o.question || "").trim(),
        action: String(o.action || "").trim()
      };
    } catch (e) { return null; }
  }

  // ---------- 指纹(缓存键) ----------
  function fingerprint(str) {
    if (window.crypto && crypto.subtle && crypto.subtle.digest) {
      return crypto.subtle.digest("SHA-256", new TextEncoder().encode(str))
        .then(buf => Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join(""));
    }
    let h1 = 5381, h2 = 52711;
    for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = (h1 * 33 ^ c) >>> 0; h2 = (h2 * 31 + c) >>> 0; }
    return Promise.resolve("djb2_" + h1.toString(16) + h2.toString(16) + "_" + str.length);
  }

  // ---------- 请求:只送星盘计算结果 ----------
  // 目前语言(zh 预设)。zh 时送出的请求与本次修改前完全一致。
  function curLang() { return (window.I18N && window.I18N.lang === "en") ? "en" : "zh"; }
  // 分语言的储存键:中文沿用原键(reading / topics / lifemap / qa),
  // 英文另存 *_en。既有中文资料永远不会被覆盖或删除。
  function LK(base) { return curLang() === "en" ? base + "_en" : base; }

  // 中文版 = source of truth。生成英文时把中文版「全文」一起送出,
  // 服务端据此做文学改写(literary adaptation),不是翻译、也不重新分析。
  // 中文生成时一律回传 null → payload 与指纹与修改前完全一致。
  function chineseSource(c, kind, key) {
    if (!c) return null;
    if (kind === "blueprint") {
      const r = c.reading;
      if (!r || !r.chapters || !r.chapters.length) return null;
      return {
        spine: r.spine || "",
        cards: (r.cards || []).map(function (x) { return { title: x.title, line: x.line || x.body || "" }; }),
        chapters: r.chapters.map(function (x) {
          return { title: x.title, summary: x.summary || "", body: x.body || "" };
        })
      };
    }
    const src = kind === "map" ? c.lifemap
              : ((kind === "topic" ? c.topics : c.qa) || {})[key];
    if (!src || !src.sections || !src.sections.length) return null;
    return {
      tagline: src.tagline || "",
      sections: src.sections.map(function (x) { return { title: x.title, body: x.body || "" }; }),
      aha: src.aha || [],
      question: src.question || "",
      action: src.action || ""
    };
  }
  // 中文版是否已存在(决定要不要先产生来源)
  function hasChinese(c, kind, key) { return !!chineseSource(c, kind, key); }

  // ── 中文栏位写入保护 ──
  // 自动流程(为英文补中文来源)只允许「填空」,绝不允许覆盖已有中文。
  // 已有有效中文时回传 false 并放弃写入;呼叫端应改用既有内容。
  function guardWriteZh(c, kind, key, value) {
    if (hasChinese(c, kind, key)) {
      console.warn("[Inner Sky] 中文栏位已有内容,自动流程拒绝覆盖:", kind, key || "");
      return false;
    }
    if (kind === "blueprint") c.reading = value;
    else if (kind === "map") c.lifemap = value;
    else { c.topics = c.topics || {}; c.topics[key] = value; }
    return true;
  }

  function chartPayload(res) {
    return {
      ang: { asc: res.ang.asc, mc: res.ang.mc },
      cusps: res.cusps,
      planets: res.planets.map(p => ({ key: p.key, lon: p.lon, house: p.house, retro: !!p.retro, speed: p.speed })),
      extras: (res.extras || []).map(x => ({ key: x.key, lon: x.lon, house: x.house }))
    };
  }
  function callFunc(payload, retried) {
    const bearer = (window.Cloud && window.Cloud.token && window.Cloud.token()) || SUPABASE_ANON_KEY;
    return fetch(SUPABASE_FUNC_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + bearer, "apikey": SUPABASE_ANON_KEY },
      body: JSON.stringify(payload)
    }).then(function (r) {
      // 令牌过期:静默续期一次后重试(服务端 question 层已开启使用者验证)
      if (r.status === 401 && !retried && window.Cloud && window.Cloud.refresh)
        return window.Cloud.refresh().then(function () { return callFunc(payload, true); });
      return r.text().then(function (t) {
        if (!r.ok) {
          let msg = "HTTP " + r.status;
          try { const o = JSON.parse(t); msg += " · " + (o.error || "") + (o.detail ? " · " + o.detail : ""); } catch (e) { msg += " · " + t.slice(0, 160); }
          throw new Error(msg);
        }
        try { return JSON.parse(t); } catch (e) { throw new Error("返回不是 JSON:" + t.slice(0, 120)); }
      });
    });
  }
  function askServer(kind, extra, res, fpSeed, parseFn, forceLang) {
    const chart = chartPayload(res);
    // forceLang 只在「先产生中文来源」时使用;其余情况一律跟随介面语言
    const lang = (forceLang === "zh" || forceLang === "en") ? forceLang : curLang();
    function attempt(seed) {
      return fingerprint(seed).then(function (fp) {
        // lang 为额外参数;服务端只在 lang==="en" 时追加一句输出语言指示,
        // 其余 Prompt、九步定调、资料抽取完全不变。
        return callFunc(Object.assign({ kind: kind, fingerprint: fp, chart: chart, lang: lang }, extra));
      }).then(function (d) {
        const raw = d.text || d.content || "";
        const parsed = parseFn(raw);
        if (!parsed) { const e = new Error("内容解析失败(可能被截断)"); e.parseFail = true; throw e; }
        parsed.raw = raw;
        return parsed;
      });
    }
    // 指纹必须区分每一道题,否则 30 题会共用同一份缓存、互相覆盖
    const sub = extra.tid ? ":" + extra.tid : (extra.qid ? ":" + extra.qid : "");
    // 中文指纹与本次修改前完全一致 → 既有服务端缓存继续命中,不会重新生成;
    // 英文另起指纹,与中文互不覆盖。
    // en-w2:英文写作系统第二版(Bilingual Writing System v1.0 + 内部两步 + 文风修正)。
    //   只换英文标签 —— 中文标签一个字元都没动,既有中文缓存继续命中。
    const base = String(fpSeed || "") + "|" + kind + sub + "|v10" + (lang === "en" ? "|en-w2" : "");
    return attempt(base).catch(function (e) {
      if (e.parseFail) return attempt(base + "|retry" + Date.now());
      throw e;
    });
  }
  // chart:当前星盘物件,用于取出中文版全文(生成英文时)
  // forceLang:内部使用,"zh" 表示这一次是在产生英文所需的中文来源
  function fetchReading(res, fpSeed, chart, forceLang) {
    return askServer("blueprint", withSource({}, chart, "blueprint", null, forceLang), res, fpSeed, parseChapters, forceLang);
  }
  function fetchTopic(res, tid, fpSeed, blueprint, topics, chart, forceLang) {
    return askServer("topic", withSource({ tid: tid, blueprint: blueprint, topics: topics }, chart, "topic", tid, forceLang), res, fpSeed, parseTopic, forceLang);
  }
  function fetchMap(res, fpSeed, blueprint, topics, chart, forceLang) {
    return askServer("map", withSource({ blueprint: blueprint, topics: topics }, chart, "map", null, forceLang), res, fpSeed, parseTopic, forceLang);
  }
  function fetchQuestion(res, qid, fpSeed, blueprint, topics, answered, chart, forceLang) {
    return askServer("question", withSource({ qid: qid, blueprint: blueprint, topics: topics, answered: answered }, chart, "question", qid, forceLang), res, fpSeed, parseTopic, forceLang);
  }
  // 只有「这一次要产出英文」时才附上中文源本;中文生成一律原样返回
  function withSource(extra, chart, kind, key, forceLang) {
    const target = (forceLang === "zh" || forceLang === "en") ? forceLang : curLang();
    if (target !== "en") return extra;
    const src = chineseSource(chart, kind, key);
    if (src) extra.source = src;
    return extra;
  }

  // ---------- 渲染:生命蓝图 ----------
  // 卡片显示名映射(仅改标题文案,不影响服务端生成)
  // 英文卡片标题(与中文各自成体系);中文对照表在下方,完全未改动
  const CARD_LABEL_EN = {
    "你的核心人格模式": "What Gives You Your Strength",
    "组成你的核心力量": "What Gives You Your Strength",
    "你的核心人格特质": "What Gives You Your Strength",
    "你的情绪运作方式": "How You Experience the World",
    "你如何感受这个世界": "How You Experience the World",
    "你的天赋特质": "A Strength That Comes Naturally",
    "你自带的能力": "A Strength That Comes Naturally",
    "你的理想状态": "When You Feel Most Like Yourself",
    "什么状态最像真正的你": "When You Feel Most Like Yourself"
  };
  const CARD_LABEL = {
    "你的核心人格模式": "组成你的核心力量",
    "你的核心人格特质": "组成你的核心力量",
    "你的情绪运作方式": "你如何感受这个世界",
    "你的天赋特质": "你自带的能力",
    "你的理想状态": "什么状态最像真正的你"
  };
  // 英文模式优先用固定英文标题;找不到对照时用模型输出的标题
  function cardLabel(title) {
    if (window.I18N && window.I18N.lang === "en") return CARD_LABEL_EN[title] || title;
    return CARD_LABEL[title] || title;
  }

  function renderChapters(reading, mount) {
    const chs = Array.isArray(reading) ? reading : (reading.chapters || []);
    const spine = Array.isArray(reading) ? "" : (reading.spine || "");
    const cards = Array.isArray(reading) ? [] : (reading.cards || []);
    const esc = t => String(t || "").replace(/</g, "&lt;");
    const para = t => esc(t).split(/\n\s*\n|\n/).filter(x => x.trim()).map(x => '<p style="margin:0 0 12px">' + x.trim() + "</p>").join("");
    const inChapter = {};
    chs.forEach(c => { inChapter[c.title] = 1; });
    let h = "";
    if (spine) {
      h += '<div style="margin:2px 0 20px;padding:16px 18px;border-left:3px solid var(--gold);background:rgba(var(--accent-rgb),.07);border-radius:0 12px 12px 0">' +
        '<div style="font-size:10.5px;letter-spacing:.18em;color:var(--gold);margin-bottom:6px">' + esc(T("oneLine")) + "</div>" +
        '<div style="font-size:15.5px;line-height:1.85;color:var(--parchment)">' + esc(spine) + "</div></div>";
    }
    const quick = cards.filter(c => !inChapter[c.title]);
    if (quick.length) {
      h += '<div style="font-size:11px;letter-spacing:.16em;color:var(--gold);margin:0 0 10px">' + esc(T("aboutYou")) + "</div>" +
        '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:10px;margin-bottom:26px">' +
        quick.map(function (c) {
          return '<div style="border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--card-soft)">' +
            '<div style="font-size:11.5px;color:var(--gold-soft);margin-bottom:6px;letter-spacing:.04em">' + esc(cardLabel(c.title)) + "</div>" +
            '<div style="font-size:13.5px;line-height:1.8;color:var(--parchment)">' + esc(c.line) + "</div></div>";
        }).join("") + "</div>";
    }
    if (chs.length) {
      const cardMap = {};
      cards.forEach(c => { cardMap[c.title] = c.line; });
      h += '<div style="font-size:11px;letter-spacing:.16em;color:var(--gold);margin:0 0 10px">' + esc(T("innerMap")) + "</div>" +
        '<div style="display:grid;gap:11px">' + chs.map(function (c, i) {
        const line = cardMap[c.title] || "";
        const sum = c.summary || "";
        return '<div class="rd-item" style="border:1px solid var(--line);border-radius:13px;padding:16px 18px;background:var(--card-soft)">' +
          '<div style="font-size:14px;font-weight:700;color:var(--gold);margin-bottom:9px">' + (i + 1) + " · " + esc(c.title) + "</div>" +
          (line ? '<div style="font-size:14.5px;line-height:1.85;color:var(--parchment);margin-bottom:' + (sum ? "9px" : "0") + '">' + esc(line) + "</div>" : "") +
          (sum ? '<div style="font-size:13.5px;line-height:1.9;color:var(--parchment);opacity:.88">' + esc(sum) + "</div>" : "") +
          (c.body ? '<div class="rd-full" style="display:none;margin-top:13px;padding-top:13px;border-top:1px dashed var(--line);font-size:13.5px;line-height:2;color:var(--parchment)">' + para(c.body) + "</div>" +
            '<button class="rd-more" style="margin-top:11px;font-family:inherit;font-size:12.5px;padding:5px 15px;border:1px solid var(--line);border-radius:14px;background:transparent;color:var(--gold);cursor:pointer">' + esc(T("readMore")) + "</button>" : "") +
          "</div>";
      }).join("") + "</div>";
    }
    mount.innerHTML = h;
    mount.querySelectorAll(".rd-more").forEach(function (btn) {
      btn.addEventListener("click", function () {
        const full = btn.parentNode.querySelector(".rd-full");
        const closed = full.style.display === "none";
        full.style.display = closed ? "" : "none";
        btn.textContent = closed ? T("readLess") : T("readMore");
      });
    });
  }

  // ---------- 兼容层:版本过期自动重生成;结构损坏用原文重解析 ----------
  function isStale(saved) { return !saved || (saved.ver || 0) < CONTENT_VER; }
  function reviveReading(saved) {
    if (!saved || isStale(saved)) return null;
    if (saved.chapters && saved.chapters.length) {
      if (!Array.isArray(saved.cards)) saved.cards = [];
      saved.chapters.forEach(function (c) {
        if (typeof c.summary !== "string") c.summary = "";
        if (typeof c.body !== "string") c.body = "";
        if (typeof c.title !== "string") c.title = "";
      });
      if (typeof saved.spine !== "string") saved.spine = "";
      return saved;
    }
    if (saved.raw) {
      const re = parseChapters(saved.raw);
      if (re) { re.raw = saved.raw; re.ts = saved.ts; re.ver = saved.ver; return re; }
    }
    return null;
  }
  function reviveTopic(saved) {
    if (!saved || isStale(saved)) return null;
    if (saved.sections && saved.sections.length) {
      if (typeof saved.tagline !== "string") saved.tagline = "";
      if (!Array.isArray(saved.aha)) saved.aha = [];
      if (!Array.isArray(saved.steps)) saved.steps = [];
      saved.sections.forEach(function (x) {
        if (typeof x.title !== "string") x.title = "";
        if (typeof x.body !== "string") x.body = "";
      });
      return saved;
    }
    if (saved.raw) {
      const re = parseTopic(saved.raw);
      if (re) { re.raw = saved.raw; re.ver = saved.ver; return re; }
    }
    return null;
  }
  const LEGACY_TOPIC_IDS = ["personal", "destined", "sibling"];
  function cleanupLegacy(c) {
    let changed = false;
    if (c.answers) { delete c.answers; changed = true; }
    // CONTENT_VER 未变动 → 既有解读(ver === CONTENT_VER)一律保留,不会被清除
    ["topics", "topics_en"].forEach(function (tk) {
      if (!c[tk]) return;
      LEGACY_TOPIC_IDS.forEach(function (k) { if (c[tk][k]) { delete c[tk][k]; changed = true; } });
      Object.keys(c[tk]).forEach(function (k) { if (isStale(c[tk][k])) { delete c[tk][k]; changed = true; } });
    });
    ["qa", "qa_en"].forEach(function (qk) {
      if (!c[qk]) return;
      Object.keys(c[qk]).forEach(function (k) { if (isStale(c[qk][k])) { delete c[qk][k]; changed = true; } });
    });
    ["lifemap", "lifemap_en", "reading", "reading_en"].forEach(function (rk) {
      if (c[rk] && isStale(c[rk])) { delete c[rk]; changed = true; }
    });
    return changed;
  }

  window.Reading = {
    CONTENT_VER: CONTENT_VER,
    curLang: curLang, LK: LK,
    TOPICS9: TOPICS9, findTopic: findTopic, DOMAINS: DOMAINS, findQ: findQ,
    parseChapters: parseChapters, parseTopic: parseTopic,
    fetchReading: fetchReading, fetchTopic: fetchTopic, fetchMap: fetchMap, fetchQuestion: fetchQuestion,
    chineseSource: chineseSource, hasChinese: hasChinese, guardWriteZh: guardWriteZh,
    renderChapters: renderChapters,
    reviveReading: reviveReading, reviveTopic: reviveTopic, cleanupLegacy: cleanupLegacy,
    hasSupabase: function () { return !!(SUPABASE_FUNC_URL && SUPABASE_ANON_KEY); }
  };
})();

  // ---------- 本地存储 ----------
  // 云端存储:内存态 + Supabase 持久化(charts 表逐条同步,activeId 走偏好)

  /* ============================================================
     方案 A:主星盘
     出生资料仍然按「一个用户可以有多张盘」存放,其中一张标记为主星盘
     (= 用户本人的出生资料)。所有页面统一用 hasCompleteBirthProfile()
     判断,不各自判断。
     ============================================================ */
  let primaryChartId = null;

  function primaryChart() {
    const byId = store.charts.find(function (c) { return c.id === primaryChartId; });
    // 未标记过 → 以第一张盘为主星盘(既有用户自动兼容)
    return byId || store.charts[0] || null;
  }
  // 出生资料是否完整:日期 + 时间 + 地点(经纬度)缺一不可
  function isCompleteBirthData(c) {
    return !!(c && c.date && c.time &&
      typeof c.lat === "number" && isFinite(c.lat) &&
      typeof c.lon === "number" && isFinite(c.lon));
  }
  function hasCompleteBirthProfile() { return isCompleteBirthData(primaryChart()); }
  function setPrimaryChart(id) {
    primaryChartId = id;
    window.Cloud.savePrefs({ primaryChartId: id });
  }
  function saveStore() { window.Cloud.savePrefs({ activeId: store.activeId }); }
  function activeChart() { return store.charts.find(c => c.id === store.activeId) || null; }

  // ---------- 时间:固定 UTC+8 ----------
  function chartDate(c) {
    const [y, mo, d] = c.date.split("-").map(Number);
    const [h, mi] = c.time.split(":").map(Number);
    return new Date(Date.UTC(y, mo - 1, d, h - 8, mi, 0));
  }

  // ---------- 计算并缓存 ----------
  function computeFor(c) {
    const res = C.computeChart({ date: chartDate(c), lat: c.lat, lon: c.lon, system: c.sys || "placidus" });
    res.extras = X.computeExtras(res, c.lat);
    return res;
  }

  // ---------- 表单 ----------
  function initForm() {
    const sel = $("f_city");
    function fillCity(q) {
      q = (q || "").trim().toLowerCase();
      sel.innerHTML = '<option value=""></option>';
      sel.firstChild.textContent = T("fPlacePick");
      let idx = 0, shown = 0, firstMatch = null;
      CITY_GROUPS.forEach(function (g) {
        const matched = [];
        g[1].forEach(function (ct) {
          const myIdx = idx++;
          if (!q || ct[0].toLowerCase().indexOf(q) !== -1 || g[0].toLowerCase().indexOf(q) !== -1
              || window.I18N.TRegion(g[0]).toLowerCase().indexOf(q) !== -1) {
            matched.push([myIdx, ct[0]]);
          }
        });
        if (matched.length) {
          const og = document.createElement("optgroup");
          og.label = window.I18N.TRegion(g[0]);
          matched.forEach(function (m) {
            const o = document.createElement("option");
            o.value = m[0]; o.textContent = m[1];
            og.appendChild(o);
            if (firstMatch === null) firstMatch = m[0];
            shown++;
          });
          sel.appendChild(og);
        }
      });
      // 搜索唯一命中时直接选中并填坐标
      if (q && shown === 1 && firstMatch !== null) {
        sel.value = firstMatch;
        const ct = CITIES[firstMatch];
        $("f_lat").value = ct[1]; $("f_lon").value = ct[2];
      }
    }
    fillCity("");
    $("f_citysearch").addEventListener("input", function () { fillCity(this.value); });
    sel.addEventListener("change", function () {
      if (sel.value === "") return;
      const ct = CITIES[+sel.value];
      $("f_lat").value = ct[1]; $("f_lon").value = ct[2];
    });
    $("formTitle").addEventListener("click", function () {
      const b = $("newChartBody");
      const closed = b.style.display === "none";
      b.style.display = closed ? "" : "none";
      $("formToggleArrow").textContent = closed ? T("collapse") : T("expand");
      $("formToggleArrow").setAttribute("data-i18n", closed ? "collapse" : "expand");
    });
    $("clearBtn").addEventListener("click", function () {
      editingId = null;
      $("formTitleText").textContent = T("newChart");
      $("formTitleText").setAttribute("data-i18n", "newChart");
      $("f_nick").value = ""; $("f_city").value = "";
      $("f_date").value = "1990-01-01"; $("f_time").value = "12:00";
      $("f_lat").value = 31.2304; $("f_lon").value = 121.4737;
    });
    $("saveBtn").addEventListener("click", function () {
      const nick = $("f_nick").value.trim() || T("unnamed");
      const date = $("f_date").value, time = $("f_time").value;
      const lat = parseFloat($("f_lat").value), lon = parseFloat($("f_lon").value);
      if (!date || !time || !isFinite(lat) || !isFinite(lon)) { alert(T("alertFields")); return; }
      if (lat < -89.9 || lat > 89.9) { alert(T("alertLat")); return; }
      if (editingId) {
        const c = store.charts.find(x => x.id === editingId);
        if (c) {
          Object.assign(c, { nick, date, time, lat, lon });
          store.activeId = c.id;
          window.Cloud.updateChart(c).catch(e => console.warn(T("syncFail"), e));
        }
        editingId = null;
        $("formTitleText").textContent = T("newChart");
        $("formTitleText").setAttribute("data-i18n", "newChart");
      } else {
        const c = { id: window.Cloud.uuid(), nick, date, time, lat, lon, sys: "placidus" };
        store.charts.push(c);
        store.activeId = c.id;
        window.Cloud.insertChart(c).catch(e => console.warn(T("syncFail"), e));
        // onboarding:第一张盘即用户本人的出生资料,自动设为主星盘
        if (!primaryChartId) setPrimaryChart(c.id);
      }
      saveStore(); renderChartList(); drawActive();
    });
  }

  // ---------- 盘列表 ----------
  // 写入本地展示档案:落地页用它显示「早安, 名字」。只含昵称与邮箱前缀来源,不含任何令牌。
  // 从落地页带进来的 hash:#blueprint / #chapters / #lifemap / #chart / #favs / #topic-xxx
  function applyDeepLink() {
    const h = (location.hash || "").replace("#", "");
    if (!h) return;
    const go = function (id, extra) {
      const el = document.getElementById(id);
      if (!el) return;
      setTimeout(function () {
        el.scrollIntoView({ behavior: "smooth", block: "start" });
        if (extra) extra();
      }, 260);
    };
    if (h === "blueprint") go("readPanel");
    else if (h === "chapters") go("topicPanel");
    else if (h === "lifemap") go("mapPanel");
    else if (h === "chart") go("wheelPanel");
    else if (h === "favs") go("favPanel");
    else if (h.indexOf("topic-") === 0) { location.hash = "#/topic/" + h.slice(6); return; }
    else if (h.charAt(0) === "/") { applyRoute(); return; }   // 独立页面路由:保留 hash
    history.replaceState(null, "", location.pathname + location.search);
  }

  function saveProfileCache() {
    try {
      var c = activeChart();
      var uid = "";
      try { uid = localStorage.getItem("inner_sky_userid_v1") || ""; } catch (e2) { }
      localStorage.setItem("inner_sky_profile_v1", JSON.stringify({
        nick: uid || (c ? (c.nick || "") : ""),
        email: (window.Cloud && window.Cloud.email) ? window.Cloud.email() : ""
      }));
      // 已读章节:落地页据此优先展示未读
      if (c) {
        var read = {};
        Object.keys(c[window.Reading.LK("topics")] || {}).forEach(function (k) { read[k] = true; });
        localStorage.setItem("inner_sky_read_v1", JSON.stringify(read));
        // 收藏(取最近几条给落地页预览)
        localStorage.setItem("inner_sky_favs_v1", JSON.stringify((c.favs || []).slice(0, 4)));
      }
    } catch (e) { }
  }

  function renderChartList() {
    saveProfileCache();
    const box = $("chartList");
    box.innerHTML = "";
    if (!store.charts.length) {
      box.innerHTML = '<div class="hint" data-i18n="noCharts"></div>';
      box.firstChild.textContent = T("noCharts");
      return;
    }
    store.charts.forEach(function (c) {
      const btn = document.createElement("button");
      btn.className = "chart-item" + (c.id === store.activeId ? " active" : "");
      btn.innerHTML = '<span class="nick"></span><span class="meta"></span>' +
        '<button class="edit" data-i18n-title="edit">✎</button><button class="del" data-i18n-title="del">×</button>';
      btn.querySelector(".edit").title = T("edit");
      btn.querySelector(".del").title = T("del");
      btn.querySelector(".nick").textContent = c.nick;
      btn.querySelector(".meta").textContent = c.date + " " + c.time;
      btn.addEventListener("click", function (e) {
        if (e.target.classList.contains("del") || e.target.classList.contains("edit")) return;
        store.activeId = c.id; saveStore(); renderChartList(); drawActive();
      });
      btn.querySelector(".edit").addEventListener("click", function (e) {
        e.stopPropagation();
        editingId = c.id;

        $("newChartBody").style.display = ""; $("formToggleArrow").textContent = T("collapse");
        $("formToggleArrow").setAttribute("data-i18n", "collapse");
        $("f_nick").value = c.nick; $("f_date").value = c.date; $("f_time").value = c.time;
        $("f_lat").value = c.lat; $("f_lon").value = c.lon; $("f_city").value = "";
      });
      const del = btn.querySelector(".del");
      del.addEventListener("click", function (e) {
        e.stopPropagation();
        if (confirmDelId !== c.id) {
          confirmDelId = c.id; del.classList.add("confirm"); del.textContent = T("confirmDel");
          setTimeout(function () { if (confirmDelId === c.id) { confirmDelId = null; del.classList.remove("confirm"); del.textContent = "×"; } }, 2500);
          return;
        }
        store.charts = store.charts.filter(x => x.id !== c.id);
        window.Cloud.deleteChart(c.id).catch(e => console.warn(T("delFail"), e));
        if (store.activeId === c.id) store.activeId = store.charts.length ? store.charts[0].id : null;
        confirmDelId = null;
        saveStore(); renderChartList(); drawActive();
      });
      box.appendChild(btn);
    });
  }

  // ---------- 盘面几何 ----------
  const CX = 300, CY = 300, R_EDGE = 296, R_ZI = 240, R_PL = 216, R_CORE = 150;
  function scrA(lon) { return (180 + (lon - (curResult ? curResult.ang.asc : 0))) * Math.PI / 180; }
  function pt(r, lon) { const a = scrA(lon); return [CX + r * Math.cos(a), CY - r * Math.sin(a)]; }
  function ptA(r, aDeg) { const a = aDeg * Math.PI / 180; return [CX + r * Math.cos(a), CY - r * Math.sin(a)]; }
  function el(tag, attrs, parent) {
    const e = document.createElementNS(svgNS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  const ELEM_TINT = { 火: "#c2372a", 水: "#2f6fb5", 土: "#7a5230", 风: "#2f9e9e" };

  // ---------- 盘面显示开关条 ----------
  function ensureToggleBar() {
    let bar = $("wheelToggles");
    if (!bar) {
      bar = document.createElement("div");
      bar.id = "wheelToggles";
      const w = $("wheel");
      w.parentNode.insertBefore(bar, w);
      // 盘面左右滑动切换 符号/名称
      let sx = null, sy = null;
      w.addEventListener("touchstart", function (e) {
        if (e.touches.length === 1) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }
      }, { passive: true });
      w.addEventListener("touchend", function (e) {
        if (sx === null) return;
        const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
        sx = null;
        if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) {
          glyphMode = glyphMode === "sym" ? "name" : "sym";
          saveShow(); ensureToggleBar(); drawWheel();
        }
      }, { passive: true });
    }
    bar.style.cssText = "display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:4px 6px 8px";
    bar.innerHTML = "";
    // 符号/名称 切换
    const segWrap = document.createElement("div");
    segWrap.style.cssText = "display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden";
    [["sym", T("symbols")], ["name", T("names")]].forEach(function (m) {
      const b = document.createElement("button");
      const on = glyphMode === m[0];
      b.textContent = m[1];
      b.style.cssText = "font-family:inherit;font-size:12px;padding:3px 12px;border:none;cursor:pointer;transition:.15s;" +
        (on ? "background:rgba(var(--accent-rgb),.18);color:var(--gold)" : "background:transparent;color:var(--muted)");
      b.addEventListener("click", function () {
        if (glyphMode === m[0]) return;
        glyphMode = m[0]; saveShow(); ensureToggleBar(); drawWheel();
      });
      segWrap.appendChild(b);
    });
    bar.appendChild(segWrap);
    // 行星设定按钮
    const gear = document.createElement("button");
    gear.textContent = T("wheelSettings");
    gear.style.cssText = "font-family:inherit;font-size:12px;padding:3px 12px;border-radius:20px;cursor:pointer;transition:.15s;" +
      (settingsOpen ? "border:1px solid var(--gold-soft);background:rgba(var(--accent-rgb),.16);color:var(--gold)"
                    : "border:1px solid var(--line);background:transparent;color:var(--muted)");
    gear.addEventListener("click", function () {
      settingsOpen = !settingsOpen;
      ensureToggleBar();
    });
    bar.appendChild(gear);
    const hint = document.createElement("span");
    hint.textContent = T("wheelSwipeHint");
    hint.style.cssText = "font-size:10.5px;color:var(--muted);opacity:.7";
    bar.appendChild(hint);
    // 设定面板
    let panel = $("wheelSettings");
    if (!panel) {
      panel = document.createElement("div");
      panel.id = "wheelSettings";
      bar.parentNode.insertBefore(panel, bar.nextSibling);
    }
    panel.style.cssText = "display:" + (settingsOpen ? "block" : "none") +
      ";margin:0 6px 10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(var(--accent-rgb),.04)";
    panel.innerHTML = "";
    if (settingsOpen) {
      // 顶部一行:左侧说明,右侧全选按钮(与网格右缘对齐)
      const head = document.createElement("div");
      head.style.cssText = "display:flex;align-items:flex-start;gap:12px;margin-bottom:8px";
      const std = document.createElement("div");
      std.style.cssText = "flex:1;font-size:11.5px;color:var(--muted);line-height:1.6";
      std.textContent = T("alwaysShown");
      head.appendChild(std);
      const allOn = OPT_KEYS.every(function (k) { return wheelShow[k[0]]; });
      const selAll = document.createElement("button");
      selAll.textContent = allOn ? T("selectNone") : T("selectAll");
      selAll.style.cssText = "flex:none;font-family:inherit;font-size:12px;padding:3px 14px;border-radius:16px;cursor:pointer;transition:.15s;white-space:nowrap;" +
        (allOn ? "border:1px solid var(--gold-soft);background:rgba(var(--accent-rgb),.16);color:var(--gold)"
               : "border:1px solid var(--line);background:transparent;color:var(--parchment)");
      selAll.addEventListener("click", function () {
        const target = !allOn;
        OPT_KEYS.forEach(function (k) { wheelShow[k[0]] = target; });
        saveShow(); ensureToggleBar(); drawWheel();
      });
      head.appendChild(selAll);
      panel.appendChild(head);
      const grid = document.createElement("div");
      grid.style.cssText = "display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:4px 10px";
      OPT_KEYS.forEach(function (k) {
        const lab = document.createElement("label");
        lab.style.cssText = "display:flex;align-items:center;gap:6px;font-size:12.5px;cursor:pointer;font-weight:500;color:" +
          (wheelShow[k[0]] ? "var(--gold)" : "var(--parchment)");
        const cb = document.createElement("input");
        cb.type = "checkbox"; cb.checked = !!wheelShow[k[0]];
        cb.style.accentColor = "var(--gold)";
        cb.addEventListener("change", function () {
          wheelShow[k[0]] = cb.checked;
          saveShow(); ensureToggleBar(); drawWheel();
        });
        lab.appendChild(cb);
        lab.appendChild(document.createTextNode(window.I18N.TOpt(k[0], k[1])));
        grid.appendChild(lab);
      });
      panel.appendChild(grid);
    }
  }

  // 盘上可见扩展点(逐颗开关;轴线另行呈现,EP 收而不用)
  function visibleExtras() {
    if (!curResult) return [];
    return curResult.extras.filter(function (x) {
      if (x.group === "axes" || x.group === "table-only") return false;
      return !!wheelShow[x.key];
    });
  }

  // ---------- 星盘轮 ----------
  function drawWheel() {
    const svg = $("wheel");
    svg.innerHTML = "";
    if (!curResult) return;
    const res = curResult;

    // 底
    el("circle", { cx: CX, cy: CY, r: R_EDGE, fill: "var(--w-face)", stroke: "var(--line)", "stroke-width": 1.4 }, svg);
    // 黄道带扇区(元素淡彩)
    for (let i = 0; i < 12; i++) {
      const a0 = i * 30, a1 = a0 + 30;
      const [x0, y0] = pt(R_EDGE, a0), [x1, y1] = pt(R_EDGE, a1);
      const [xi1, yi1] = pt(R_ZI, a1), [xi0, yi0] = pt(R_ZI, a0);
      el("path", {
        d: `M ${x0} ${y0} A ${R_EDGE} ${R_EDGE} 0 0 0 ${x1} ${y1} L ${xi1} ${yi1} A ${R_ZI} ${R_ZI} 0 0 1 ${xi0} ${yi0} Z`,
        fill: ELEM_TINT[C.SIGNS[i].elem], "fill-opacity": .18, stroke: "none"
      }, svg);
    }
    el("circle", { cx: CX, cy: CY, r: R_ZI, fill: "none", stroke: "var(--line)", "stroke-width": 1.2 }, svg);
    // 星座分隔 + 符号 + 刻度
    for (let i = 0; i < 12; i++) {
      const lonB = i * 30;
      const [x0, y0] = pt(R_ZI, lonB), [x1, y1] = pt(R_EDGE, lonB);
      el("line", { x1: x0, y1: y0, x2: x1, y2: y1, stroke: "var(--line)", "stroke-width": 1 }, svg);
      const [gx, gy] = pt(276, lonB + 15);
      svg.appendChild(GL.symbolGroup(svgNS, C.SIGNS[i].glyph, gx, gy, 20, "var(--w-sglyph)"));
      // 星座单字名
      const SIGN_CHAR = window.I18N.isEN()
        ? window.I18N.SIGN_CHAR_EN
        : ["羊", "牛", "双", "蟹", "狮", "处", "秤", "蝎", "射", "摩", "瓶", "鱼"];
      const [zx, zy] = pt(253, lonB + 15);
      const zc = el("text", { x: zx, y: zy + 4.2, "text-anchor": "middle", "font-size": window.I18N.isEN() ? 9 : 12, "font-weight": 600, fill: "var(--w-schar)", "font-family": "inherit" }, svg);
      zc.textContent = SIGN_CHAR[i];
      for (let d = 5; d < 30; d += 5) {
        const L = lonB + d, len = (d % 10 === 0) ? 8 : 5;
        const [tx0, ty0] = pt(R_ZI, L), [tx1, ty1] = pt(R_ZI + len, L);
        el("line", { x1: tx0, y1: ty0, x2: tx1, y2: ty1, stroke: "var(--w-cusp)", "stroke-width": .8 }, svg);
      }
    }
    // 内核
    el("circle", { cx: CX, cy: CY, r: R_CORE, fill: "var(--w-core)", "fill-opacity": .75, stroke: "var(--line)", "stroke-width": 1 }, svg);
    const aspLayer = el("g", { "data-layer": "aspects" }, svg); // 相位线专属图层,限定在内核圆盘内

    // 宫头线 + 宫号
    const axes = { 0: "ASC", 3: "IC", 6: "DSC", 9: "MC" };
    for (let i = 0; i < 12; i++) {
      const cl = res.cusps[i];
      const isAxis = (res.system !== "whole") && (i in axes);
      const [x0, y0] = pt(R_CORE, cl), [x1, y1] = pt(R_ZI, cl);
      el("line", {
        x1: x0, y1: y0, x2: x1, y2: y1,
        stroke: isAxis ? "var(--w-axis)" : "var(--w-cusp)", "stroke-width": isAxis ? 2 : 1,
        "data-cusp": i
      }, svg);
      // 宫号(可点击)
      const mid = cl + C.n360(res.cusps[(i + 1) % 12] - cl) / 2;
      const [nx, ny] = pt(168, mid);
      const t = el("text", {
        x: nx, y: ny + 4, "text-anchor": "middle", "font-size": 12,
        fill: "var(--w-hnum)", "font-family": "inherit"
      }, svg);
      t.textContent = i + 1;
    }
    // 四轴线(Whole Sign 下单独画,虚线) + 轴标签
    const axLons = { ASC: res.ang.asc, IC: C.n360(res.ang.mc + 180), DSC: C.n360(res.ang.asc + 180), MC: res.ang.mc };
    for (const k in axLons) {
      if (res.system === "whole") {
        const [x0, y0] = pt(R_CORE, axLons[k]), [x1, y1] = pt(R_ZI, axLons[k]);
        el("line", { x1: x0, y1: y0, x2: x1, y2: y1, stroke: "var(--w-axis)", "stroke-width": 1.6, "stroke-dasharray": "5 4" }, svg);
      }
      const [lx, ly] = pt(R_EDGE + 13, axLons[k]);
      const t = el("text", { x: lx, y: ly + 4, "text-anchor": "middle", "font-size": 12.5, fill: "var(--w-axis)", "font-weight": 700, "letter-spacing": ".05em" }, svg);
      t.textContent = k;
    }

    // ---- 行星与扩展点:合并排布 ----
    const majors = res.planets.map(p => ({ obj: p, isMajor: true }));
    const extras = visibleExtras().map(x => ({ obj: x, isMajor: false }));
    const all = majors.concat(extras).sort((a, b) => C.n360(a.obj.lon - res.ang.asc) - C.n360(b.obj.lon - res.ang.asc));
    // 排布:角度保持真实黄经;拥挤时向内圈分层堆叠(与 astro-seek 一致),
    // 只有同层实在放不下才做很小的角度让位 —— 指引线因此始终短而近似径向
    const RINGS = [R_PL, R_PL - 23, R_PL - 45];
    const disp = [];   // 每颗最终显示角(相对上升点)
    const ringOf = []; // 每颗所在层
    const lastOn = RINGS.map(() => -999); // 各层上一颗的显示角
    all.forEach(function (it, idx) {
      const trueA = C.n360(it.obj.lon - res.ang.asc);
      const need = r => 6.6 * (R_PL / RINGS[r]); // 内层半径小,需要更大角距
      let chosen = -1;
      for (let r = 0; r < RINGS.length; r++) {
        if (trueA - lastOn[r] >= need(r)) { chosen = r; break; }
      }
      if (chosen === -1) {
        // 全部层都挤:选空隙最大的层,并向前做最小角度让位
        let best = 0, bestGap = -1e9;
        for (let r = 0; r < RINGS.length; r++) {
          const gap = trueA - lastOn[r];
          if (gap > bestGap) { bestGap = gap; best = r; }
        }
        chosen = best;
        disp.push(lastOn[chosen] + need(chosen));
      } else {
        disp.push(trueA);
      }
      ringOf.push(chosen);
      lastOn[chosen] = disp[idx];
    });
    const planetScreen = {}; // 主星 key → 内核端点坐标(相位线用)
    all.forEach(function (it, idx) {
      const p = it.obj;
      const aDeg = 180 + disp[idx]; // 屏幕角
      const rPl = RINGS[ringOf[idx]]; // 本颗所在层半径
      // 真位置刻度
      const [m0x, m0y] = pt(R_ZI, p.lon), [m1x, m1y] = pt(R_ZI - 7, p.lon);
      el("line", { x1: m0x, y1: m0y, x2: m1x, y2: m1y, stroke: it.isMajor ? "var(--w-ink)" : "var(--w-tick2)", "stroke-width": it.isMajor ? 1.5 : 1 }, svg);
      const [gx, gy] = ptA(rPl, aDeg);
      // 指引线:内层符号才需要,短而近似径向
      if (ringOf[idx] > 0 || Math.abs(disp[idx] - C.n360(p.lon - res.ang.asc)) > .8) {
        const [lx, ly] = ptA(rPl + (it.isMajor ? 13 : 10), aDeg);
        el("line", {
          x1: m1x, y1: m1y, x2: lx, y2: ly,
          stroke: "var(--w-leader)", "stroke-width": .8, "stroke-opacity": .5
        }, svg);
      }
      const color = it.isMajor ? "var(--w-ink)" : "var(--w-sub)";
      const size = it.isMajor ? 19 : 14;
      const grp = el("g", { cursor: "pointer", "data-planet": p.key }, svg);
      const NM = window.I18N.isEN() ? window.I18N.NAME1_EN : NAME1;
      if (glyphMode === "name" && NM[p.key]) {
        const t = el("text", { x: gx, y: gy + (it.isMajor ? 5 : 4), "text-anchor": "middle", "font-size": window.I18N.isEN() ? (it.isMajor ? 10.5 : 9) : (it.isMajor ? 15 : 12), "font-weight": 700, fill: color, "font-family": "inherit" }, grp);
        t.textContent = NM[p.key];
      } else if (p.glyphKey) {
        grp.appendChild(GL.symbolGroup(svgNS, p.glyphKey, gx, gy, size, color));
      } else {
        const t = el("text", { x: gx, y: gy + 3.6, "text-anchor": "middle", "font-size": it.isMajor ? 13 : 10, "font-weight": 700, fill: color, "font-family": "inherit" }, grp);
        t.textContent = p.glyphTxt || p.name;
      }
      // 逆行小标
      if (p.retro) {
        const rt = el("text", { x: gx + size * .62, y: gy + size * .55, "text-anchor": "start", "font-size": 8.5, fill: "var(--w-retro)", "font-family": "inherit" }, grp);
        rt.textContent = "℞";
      }
      // 透明热区
      el("circle", { cx: gx, cy: gy, r: 13, fill: "transparent" }, grp);
      grp.addEventListener("click", function () { it.isMajor ? openPlanet(p) : openExtra(p); });
      if (it.isMajor) planetScreen[p.key] = pt(R_CORE - 3, p.lon);
    });

    // 相位线:按类型分色,越紧越显;行星永远盖在线上
    const NA = (res.aspects || []).map(function (a) {
      return { a: res.planets[a.a].key, b: res.planets[a.b].key, type: a.type, orb: a.orb };
    });
    const ASP_LINE = {
      opp: { color: "#c0392b", dash: null, max: 8 },   // 冲:深红
      squ: { color: "#d9662a", dash: null, max: 6 },   // 刑:橙
      tri: { color: "#2e6fb0", dash: null, max: 6 },   // 拱:蓝
      sex: { color: "#3f9e63", dash: "3 3", max: 4 }   // 六合:绿虚线
      // 合相不画线:两星本就相邻
    };
    const endDots = {};
    if (NA) {
      NA.slice().sort((x, y) => y.orb - x.orb).forEach(function (asp) {
        const st = ASP_LINE[asp.type];
        if (!st) return;
        const a = planetScreen[asp.a], b = planetScreen[asp.b];
        if (!a || !b) return;
        const tight = Math.max(0, 1 - asp.orb / st.max);
        const attrs = {
          x1: a[0], y1: a[1], x2: b[0], y2: b[1],
          stroke: st.color,
          "stroke-width": (0.8 + tight * 1.0).toFixed(2),
          "stroke-opacity": (0.3 + tight * 0.52).toFixed(2),
          "stroke-linecap": "round",
          "data-aspline": asp.a + "-" + asp.b
        };
        if (st.dash) attrs["stroke-dasharray"] = st.dash;
        el("line", attrs, aspLayer);
        endDots[asp.a] = a; endDots[asp.b] = b;
      });
    }
    Object.keys(endDots).forEach(function (k) {
      const d = endDots[k];
      el("circle", { cx: d[0], cy: d[1], r: 1.8, fill: "var(--w-aspdot)", "fill-opacity": .8 }, aspLayer);
    });
  }

  // 引导高亮:keys=null 恢复;否则淡化非 keys 的行星
  function glyphCell(o, px, color) {
    if (o.glyphKey) return GL.symbolSVG(o.glyphKey, px, color);
    return '<span style="font-family:inherit;font-weight:700;font-size:12px;color:' + color + '">' + (o.glyphTxt || "") + "</span>";
  }
  function drawPosTable() {
    const res = curResult, tb = $("posTable");
    tb.innerHTML = "";
    if (!res) return;
    const rows = res.planets.map(function (p) {
      return "<tr><td style='padding:5px 10px 5px 0;width:34px'>" + glyphCell(p, 20, "var(--w-sglyph)") + "</td>" +
             "<td style='padding:5px 8px 5px 0'>" + window.I18N.TN(p.name) + "</td>" +
             "<td style='padding:5px 8px 5px 0;color:var(--gold-soft)'>" + window.I18N.TSign(p.sign) + "</td>" +
             "<td style='padding:5px 0;text-align:right;width:44px;white-space:nowrap;font-variant-numeric:tabular-nums'>" + window.I18N.houseLabel(p.house) + "</td></tr>";
    });
    const ascIdx = Math.floor(((res.ang.asc % 360) + 360) % 360 / 30);
    rows.push("<tr><td style='padding:5px 10px 5px 0;text-align:center;font-weight:700;color:var(--w-axis)'>ASC</td>" +
              "<td style='padding:5px 8px 5px 0'>" + T("ascendant") + "</td>" +
              "<td style='padding:5px 8px 5px 0;color:var(--gold-soft)'>" + window.I18N.TSign(C.SIGNS[ascIdx].name) + "</td>" +
              "<td style='padding:5px 0;text-align:right;white-space:nowrap'>—</td></tr>");
    tb.innerHTML = rows.join("");
  }
  function openDrawer(html) {
    $("drawerBody").innerHTML = html;
    $("drawer").classList.add("open");
    $("scrim").classList.add("show");
  }
  function closeDrawer() {
    $("drawer").classList.remove("open");
    $("scrim").classList.remove("show");
  }
  function sec(title, body) {
    return '<div class="d-section"><p class="eyebrow">' + title + '</p><div class="d-text">' + body + "</div></div>";
  }
  function openPlanet(p) {
    const res = curResult;
    let chips = '<div class="chips">';
    if (p.retro) chips += '<span class="chip" style="color:var(--fire)">' + T("retro") + ' ℞</span>';
    chips += "</div>";
    const rel = res.aspects.filter(a => res.planets[a.a].key === p.key || res.planets[a.b].key === p.key);
    const aspHtml = rel.length ? rel.map(function (a) {
      const other = res.planets[a.a].key === p.key ? res.planets[a.b] : res.planets[a.a];
      return '<span style="color:' + a.color + '">' + a.glyph + "</span> " + window.I18N.TN(a.name) + " " + window.I18N.TN(other.name);
    }).join("<br>") : T("noAspects");
    openDrawer(
      '<div class="d-glyph">' + glyphCell(p, 40, "#a8792a") + "</div>" +
      '<div class="d-title">' + window.I18N.TN(p.name) + " · " + window.I18N.TSign(p.sign) + "</div>" +
      '<div class="d-kw">' + (p.retro ? T("retro") : "") + "</div>" +
      chips +
      sec(T("aspectsHere"), aspHtml)
    );

  function openExtra(x) {

  // ---------- 初始空盘:十二宫从白羊开始(第一宫),不画任何行星 ----------
  function drawEmptyWheel() {
    const svg = $("emptyWheel");
    if (!svg) return;
    svg.innerHTML = "";
    // curResult 为 null 时 pt() 以 0° 为上升 → 白羊 0° 恰在第一宫起点
    el("circle", { cx: CX, cy: CY, r: R_EDGE, fill: "var(--w-face)", stroke: "var(--line)", "stroke-width": 1.4 }, svg);
    for (let i = 0; i < 12; i++) {
      const a0 = i * 30, a1 = a0 + 30;
      const [x0, y0] = pt(R_EDGE, a0), [x1, y1] = pt(R_EDGE, a1);
      const [xi1, yi1] = pt(R_ZI, a1), [xi0, yi0] = pt(R_ZI, a0);
      el("path", {
        d: `M ${x0} ${y0} A ${R_EDGE} ${R_EDGE} 0 0 0 ${x1} ${y1} L ${xi1} ${yi1} A ${R_ZI} ${R_ZI} 0 0 1 ${xi0} ${yi0} Z`,
        fill: ELEM_TINT[C.SIGNS[i].elem], "fill-opacity": .14, stroke: "none"
      }, svg);
    }
    el("circle", { cx: CX, cy: CY, r: R_ZI, fill: "none", stroke: "var(--line)", "stroke-width": 1.2 }, svg);
    el("circle", { cx: CX, cy: CY, r: R_CORE, fill: "var(--w-core)", stroke: "var(--line)", "stroke-width": 1 }, svg);
    for (let i = 0; i < 12; i++) {
      const lonB = i * 30;
      // 星座分隔线 + 符号
      const [x0, y0] = pt(R_ZI, lonB), [x1, y1] = pt(R_EDGE, lonB);
      el("line", { x1: x0, y1: y0, x2: x1, y2: y1, stroke: "var(--line)", "stroke-width": 1 }, svg);
      const [gx, gy] = pt(276, lonB + 15);
      svg.appendChild(GL.symbolGroup(svgNS, C.SIGNS[i].glyph, gx, gy, 20, "var(--w-sglyph)"));
      // 宫界线(整宫制:与星座界重合)+ 宫号 1~12
      const [hx0, hy0] = pt(R_CORE, lonB), [hx1, hy1] = pt(R_ZI, lonB);
      el("line", { x1: hx0, y1: hy0, x2: hx1, y2: hy1, stroke: "var(--w-cusp)", "stroke-width": 1 }, svg);
      const [nx, ny] = pt(R_CORE + 16, lonB + 15);
      const num = el("text", { x: nx, y: ny + 4, "text-anchor": "middle", "font-size": 12.5, fill: "var(--w-hnum)" }, svg);
      num.textContent = i + 1;
    }
  }

  // 解读面板:有完整解读显示五章,否则显示本地简版
  // ---------- 故障诊断:一眼看出卡在哪一环 ----------
  function diagnose(err) {
    const cfg = window.CloudCfg || {};
    const msg = (err && err.message) || String(err || "");
    return fetch(cfg.funcUrl, { method: "GET", headers: { "apikey": cfg.anon } })
      .then(function (r) { return r.text().then(function (t) { return { status: r.status, text: t }; }); })
      .catch(function (e) { return { status: 0, text: String(e) }; })
      .then(function (probe) {
        let hint = "", detail = "";
        try {
          const o = JSON.parse(probe.text);
          if (o.anthropic_key_set === false) hint = T("dgNoKey");
          else if (o.function) detail = T("dgFnVer") + o.function;
        } catch (e) { }
        if (!hint) {
          if (probe.status === 401 || /401/.test(msg)) hint = T("dg401");
          else if (probe.status === 404 || /404/.test(msg)) hint = T("dg404");
          else if (probe.status === 0) hint = T("dg0");
          else if (/502/.test(msg)) hint = T("dg502");
          else if (/504|timeout|时/.test(msg)) hint = T("dg504");
          else if (/解析|截断/.test(msg)) hint = T("dgParse");
        }
        return { hint: hint || T("dgUnknown"), raw: msg, probe: probe.status, detail: detail };
      });
  }

  // 展开/收合后保持点击项在视窗中的位置
  function keepPosition(anchorId, fn) {
    const before = document.getElementById(anchorId);
    const top0 = before ? before.getBoundingClientRect().top : null;
    fn();
    if (top0 === null) return;
    const after = document.getElementById(anchorId);
    if (!after) return;
    const delta = after.getBoundingClientRect().top - top0;
    if (Math.abs(delta) < 1) return;
    const sc = document.getElementById("main");
    if (sc && sc.scrollHeight > sc.clientHeight) sc.scrollTop += delta;
    else window.scrollBy(0, delta);
  }

  // 由使用者主动触发的生成(不会覆盖任何既有语言版本)
  function generateTopic(tid) {
    const c = activeChart();
    if (!c || !curResult || topicBusy) return;
    const TK = window.Reading.LK("topics");
    curTopic = tid;
    topicBusy = true; topicErrs[tid] = null;
    routeRefresh();
    const fpSeed = [c.date, c.time, c.lat.toFixed(4), c.lon.toFixed(4)].join("|");
    // 英文以中文版为源本,缺中文时先补齐中文
    const needSrc = window.I18N.isEN() && !window.Reading.hasChinese(c, "topic", tid);
    const job = needSrc
      ? window.Reading.fetchTopic(curResult, tid, fpSeed, c.reading, c.topics, c, "zh").then(function (zhData) {
          zhData.ver = window.Reading.CONTENT_VER;
          if (window.Reading.guardWriteZh(c, "topic", tid, zhData)) {
            window.Cloud.updateChart(c).catch(function () { });
          }
          return window.Reading.fetchTopic(curResult, tid, fpSeed, c[window.Reading.LK("reading")], c[TK], c, "en");
        })
      : window.Reading.fetchTopic(curResult, tid, fpSeed, c[window.Reading.LK("reading")], c[TK], c);
    job.then(function (data) {
      topicBusy = false;
      if (!activeChart() || activeChart().id !== c.id) return;
      c[TK] = c[TK] || {};
      data.ver = window.Reading.CONTENT_VER;
      c[TK][tid] = data;
      window.Cloud.updateChart(c).catch(function (e) { console.warn("cloud", e); });
      renderTopics(); routeRefresh();
    }).catch(function (e) {
      topicBusy = false;
      topicErrs[tid] = { msg: (e && e.message) || String(e), hint: "" };
      routeRefresh();
      diagnose(e).then(function (d) {
        if (topicErrs[tid]) { topicErrs[tid].hint = d.hint; routeRefresh(); }
      });
    });
  }

          const qb = document.createElement("button");
          qb.id = "qhead-" + it.id;
          qb.style.cssText = "width:100%;text-align:left;font-family:inherit;padding:12px 14px;border:none;background:transparent;cursor:pointer";
          qb.innerHTML =
            '<div style="display:flex;align-items:flex-start;gap:8px">' +
            '<span style="color:var(--gold);font-size:12px;line-height:1.7;flex:none">' + (on ? "\u25BC" : "\u25B8") + "</span>" +
            '<div style="flex:1"><div style="font-size:13.5px;font-weight:600;color:' + (on ? "var(--gold)" : "var(--parchment)") + ';line-height:1.6">' +
            esc0(it.q) + (ans ? '<span style="color:var(--gold);font-size:11px;margin-left:6px">\u2713</span>' : "") + "</div>" +
            (it.sub ? '<div style="font-size:11.5px;color:var(--muted);margin-top:4px">' + esc0(it.sub) + "</div>" : "") +
            "</div></div>";
          // 每一道问题开启独立页面
          qb.addEventListener("click", function () { location.hash = "#/q/" + it.id; });
          item.appendChild(qb);
          list.appendChild(item);
        });
        wrap.appendChild(list);
      }
      grid.appendChild(wrap);
    });
  }

  // 问题内容生成:由独立页面触发(#/q/<id>)
  function generateQ(qid) {
    const c = activeChart();
    if (!SHOW_EXPLORATION_MAP) return;
    if (!c || !curResult || qaBusy) return;
    const QK = window.Reading.LK("qa");
    qaBusy = true; qaErrs[qid] = null;
    routeRefresh();
    const fpSeed = [c.date, c.time, c.lat.toFixed(4), c.lon.toFixed(4)].join("|");
    window.Reading.fetchQuestion(curResult, qid, fpSeed, c[window.Reading.LK("reading")], c[window.Reading.LK("topics")], c[QK], c).then(function (data) {
      qaBusy = false;
      if (!activeChart() || activeChart().id !== c.id) return;
      c[QK] = c[QK] || {};
      data.ver = window.Reading.CONTENT_VER;
      c[QK][qid] = data;
      window.Cloud.updateChart(c).catch(function (e) { console.warn("cloud", e); });
      renderQA(); routeRefresh();
    }).catch(function (e) {
      qaBusy = false;
      qaErrs[qid] = { msg: (e && e.message) || String(e), hint: "" };
      routeRefresh();
      diagnose(e).then(function (d) { if (qaErrs[qid]) { qaErrs[qid].hint = d.hint; routeRefresh(); } });
    });
  }

  function renderMap() {
    const c = activeChart(), panel = $("mapPanel"), body = $("mapBody");
    if (!c || !curResult) { panel.style.display = "none"; return; }
    const readCount = Object.keys(c[window.Reading.LK("topics")] || {}).length;
    panel.style.display = "";
    const saved = window.Reading.reviveTopic(c[window.Reading.LK("lifemap")]);
    const head = $("mapHint");
    body.innerHTML = "";   // 内容一律在独立页面呈现(#/map)
    if (saved) {
      head.textContent = "";
      $("mapBtn").textContent = T("openRead") + " \u2192";
      $("mapBtn").style.display = "";
    } else if (mapErr) {
      head.textContent = T("failed");
      $("mapBtn").textContent = T("tryAgain");
      $("mapBtn").style.display = "";
    } else if (readCount < 3) {
      head.textContent = T("mapNeedMore", readCount);
      $("mapBtn").style.display = "none";
    } else {
      head.textContent = T("mapReady");
      $("mapBtn").textContent = mapBusy ? T("mapBusy") : T("mapBtn");
      $("mapBtn").style.display = "";
    }
  }
  function toggleMap() {
    const c = activeChart();
    if (!c || !curResult || mapBusy) return;
    const MK = window.Reading.LK("lifemap"), TK2 = window.Reading.LK("topics");
    const saved = window.Reading.reviveTopic(c[MK]);
    if (saved) { location.hash = "#/map"; return; }   // 已生成 → 开独立页面
    mapBusy = true; mapErr = null;
    renderMap(); routeRefresh();
    const fpSeed = [c.date, c.time, c.lat.toFixed(4), c.lon.toFixed(4), Object.keys(c[TK2] || {}).sort().join(",")].join("|");
    const needSrcM = window.I18N.isEN() && !window.Reading.hasChinese(c, "map");
    const jobM = needSrcM
      ? window.Reading.fetchMap(curResult, fpSeed, c.reading, c.topics, c, "zh").then(function (zhData) {
          zhData.ver = window.Reading.CONTENT_VER;
          if (window.Reading.guardWriteZh(c, "map", null, zhData)) {
            window.Cloud.updateChart(c).catch(function () { });
          }
          return window.Reading.fetchMap(curResult, fpSeed, c[window.Reading.LK("reading")], c[TK2], c, "en");
        })
      : window.Reading.fetchMap(curResult, fpSeed, c[window.Reading.LK("reading")], c[TK2], c);
    jobM.then(function (data) {
      mapBusy = false;
      if (!activeChart() || activeChart().id !== c.id) return;
      data.ver = window.Reading.CONTENT_VER;
      c[MK] = data;
      window.Cloud.updateChart(c).catch(function (e) { console.warn("cloud", e); });
      renderMap();
      location.hash = "#/map";   // 生成完成直接进入页面
    }).catch(function (e) {
      mapBusy = false;
      mapErr = { msg: (e && e.message) || String(e), hint: "" };
      renderMap(); routeRefresh();
      diagnose(e).then(function (d) { if (mapErr) { mapErr.hint = d.hint; routeRefresh(); } });
    });
  }

  let autoGenBusy = false;
  function renderReading(retrying, forceGen) {
    const c = activeChart(), body = $("nineBody");
    if (!c || !curResult) { body.innerHTML = ""; return; }
    const RK = window.Reading.LK("reading");
    const revived = window.Reading.reviveReading(c[RK]);
    if (revived) {
      if (revived !== c[RK]) {          // 本地修复成功:回存,以后直接可用
        c[RK] = revived;
        window.Cloud.updateChart(c).catch(function () { });
      }
      renderBlueprintEntry(revived, body);   // 主页只放入口卡,全文在 #/reading 独立页面
      $("readState").textContent = "";
      renderTopics();
      routeRefresh();
      return;
    }
    // 英文版本尚未生成时,不自动呼叫 AI:显示按钮,由使用者决定。
    // 中文维持原本行为(首次开盘自动整理),既有资料一律直接读取。
    if (window.I18N.isEN() && !autoGenBusy && !forceGen) {
      body.innerHTML = "";
      $("readState").textContent = "";
      const box = document.createElement("div");
      box.innerHTML = missingLangHtml("bpGen");
      body.appendChild(box);
      const bg = document.getElementById("bpGen");
      if (bg) bg.addEventListener("click", function () { renderReading(false, true); });
      renderTopics();
      return;
    }
    if (window.Reading.hasSupabase() && !autoGenBusy) {
      autoGenBusy = true;
      body.innerHTML = '<div style="padding:30px 8px;text-align:center;color:var(--muted);font-size:13px;line-height:2">' +
        '<div style="font-size:22px;color:var(--gold);margin-bottom:10px">✶</div>' +
        (retrying ? T("regenerating") : T("genBlueprint")) +
        '<br><span style="font-size:11.5px;opacity:.75">' + T("firstTimeHint") + '</span></div>';
      $("readState").textContent = "";
      const fpSeed = [c.date, c.time, c.lat.toFixed(4), c.lon.toFixed(4)].join("|");
      // 中文是 source of truth:要产出英文而中文版尚未存在时,
      // 先产生中文来源并保存(它本身就是完整的中文解读),再据以改写英文。
      const needSource = window.I18N.isEN() && !window.Reading.hasChinese(c, "blueprint");
      const job = needSource
        ? window.Reading.fetchReading(curResult, fpSeed, c, "zh").then(function (zhParsed) {
            var zhVal = Object.assign({ ts: new Date().toISOString().slice(0, 10), ver: window.Reading.CONTENT_VER }, zhParsed);
            if (window.Reading.guardWriteZh(c, "blueprint", null, zhVal)) {
              window.Cloud.updateChart(c).catch(function () { });
            }
            return window.Reading.fetchReading(curResult, fpSeed, c, "en");
          })
        : window.Reading.fetchReading(curResult, fpSeed, c);
      job
        .then(function (parsed) {
          autoGenBusy = false;
          if (!activeChart() || activeChart().id !== c.id) return;
          c[RK] = Object.assign({ ts: new Date().toISOString().slice(0, 10), ver: window.Reading.CONTENT_VER }, parsed);   // 含 raw 原文
          window.Cloud.updateChart(c).catch(function (e) { console.warn(T("syncFail"), e); });
          renderReading();
        })
        .catch(function (e) {
          autoGenBusy = false;
          if (!retrying) { setTimeout(function () { renderReading(true, true); }, 1500); return; }
          // 两次都失败:给出说明与重试入口
          body.innerHTML = "";
          $("readState").textContent = "";
          const tip = document.createElement("div");
          tip.style.cssText = "margin-top:16px;padding:12px 14px;border:1px dashed var(--line);border-radius:10px;font-size:12.5px;color:var(--muted);line-height:1.8";
          tip.innerHTML = esc0(T("failed")) + '<a href="#" id="againLink" style="color:var(--gold)">' + esc0(T("tryAgain")) + '</a>' +
            '<div id="diagBox" style="margin-top:8px;font-size:11.5px;opacity:.8"></div>';
          body.appendChild(tip);
          routeRefresh();
          const a2 = document.getElementById("againLink");
          if (a2) a2.addEventListener("click", function (ev) { ev.preventDefault(); renderReading(false, true); });
          diagnose(e).then(function (d) {
            const box = document.getElementById("diagBox");
            if (box) box.innerHTML = T("diagnosis") + d.hint + '<br><span style="opacity:.65">(' + d.raw + T("probe") + d.probe + " " + d.detail + ")</span>";
          });
        });
    } else if (!autoGenBusy) {
      body.innerHTML = '<div style="padding:24px 8px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.9">' + esc0(T("noService")) + '</div>';
    }
  }

  // ---------- 蓝图入口卡(主页):全文移到 #/reading 独立页面 ----------
  function renderBlueprintEntry(r, body) {
    const chs = r.chapters || [];
    function chName(ch, i) {
      return ch.title || ((window.I18N.isEN() ? "Chapter " : "第" + "一二三四五"[i]) + (window.I18N.isEN() ? String(i + 1) : "章"));
    }
    body.innerHTML =
      '<div style="padding:6px 2px 2px">' +
      (r.spine ? '<div style="font-size:14.5px;line-height:2;color:var(--parchment);padding:12px 16px;margin:0 0 14px;border-left:2px solid var(--gold-soft);background:rgba(var(--accent-rgb),.05);border-radius:0 10px 10px 0">' + esc0(r.spine) + '</div>' : "") +
      '<div style="display:grid;gap:7px;margin-bottom:14px">' +
      chs.map(function (ch, i) {
        return '<a href="#/reading/' + i + '" style="display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--line);border-radius:11px;text-decoration:none;color:var(--parchment);background:var(--card-soft)">' +
          '<span style="color:var(--gold);font-size:12px">✦</span>' +
          '<span style="font-size:13.5px;font-weight:600">' + esc0(chName(ch, i)) + '</span>' +

      }).join("") + "</div>" +
      '<a href="#/reading" style="display:inline-block;font-size:13px;color:var(--gold);text-decoration:none;border:1px solid var(--gold-soft);border-radius:16px;padding:7px 18px">' + esc0(T("openRead")) + ' →</a>' +
      "</div>";
  }

  /* ============================================================
     星盘渲染器(新版设计语言)
     variant "compact" = 生命蓝图里的简化预览
     variant "full"    = 我的星空的完整星盘
     两者读同一份 curResult(Single Source of Truth),
     只有信息密度不同,行星位置与宫头永远一致,不做任何视觉性挪动。
     ============================================================ */
  const DP_ELEM_TINT = { 火: "#d08a72", 水: "#7fa8d4", 土: "#b39a76", 风: "#86bfbc" };
  const DP_MAJOR = ["Sun", "Moon", "Mercury", "Venus", "Mars", "Jupiter", "Saturn", "Uranus", "Neptune", "Pluto"];

  function dpChartGeom(V) {
    // V = viewBox 尺寸;半径按比例给出,compact 与 full 共用
    const c = V / 2;
    return { c: c, edge: V * .48, zi: V * .393, house: V * .25, ring0: V * .333, ring1: V * .295 };
  }

  function drawChartWheel(svg, res, opts) {
    opts = opts || {};
    const full = opts.variant === "full";
    const V = 600, G = dpChartGeom(V);
    svg.setAttribute("viewBox", "0 0 " + V + " " + V);
    svg.innerHTML = "";
    if (!res) return;

    const asc = res.ang.asc;
    // 与完整盘同一套投影:上升永远在正左(180°屏幕角)
    const scr = function (lon) { return (180 + C.n360(lon - asc)) * Math.PI / 180; };
    const pt2 = function (r, lon) { const a = scr(lon); return [G.c + r * Math.cos(a), G.c - r * Math.sin(a)]; };
    const ptA2 = function (r, aDeg) { const a = aDeg * Math.PI / 180; return [G.c + r * Math.cos(a), G.c - r * Math.sin(a)]; };
    const E = function (tag, attrs, parent) {
      const e = document.createElementNS(svgNS, tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      (parent || svg).appendChild(e);
      return e;
    };

    // 盘面底
    E("circle", { cx: G.c, cy: G.c, r: G.edge, fill: "var(--dp-cloud)", stroke: "var(--dp-line)", "stroke-width": 1.2 });
    // 黄道十二宫扇区
    for (let i = 0; i < 12; i++) {
      const a0 = i * 30, a1 = a0 + 30;
      const [x0, y0] = pt2(G.edge, a0), [x1, y1] = pt2(G.edge, a1);
      const [xi1, yi1] = pt2(G.zi, a1), [xi0, yi0] = pt2(G.zi, a0);
      E("path", {
        d: "M " + x0 + " " + y0 + " A " + G.edge + " " + G.edge + " 0 0 0 " + x1 + " " + y1 +
           " L " + xi1 + " " + yi1 + " A " + G.zi + " " + G.zi + " 0 0 1 " + xi0 + " " + yi0 + " Z",
        fill: DP_ELEM_TINT[C.SIGNS[i].elem], "fill-opacity": .16, stroke: "none"
      });
    }
    E("circle", { cx: G.c, cy: G.c, r: G.zi, fill: "none", stroke: "var(--dp-line)", "stroke-width": 1 });
    E("circle", { cx: G.c, cy: G.c, r: G.house, fill: "var(--dp-cloud)", stroke: "var(--dp-line)", "stroke-width": 1 });

    // 星座分隔与符号
    for (let i = 0; i < 12; i++) {
      const lonB = i * 30;
      const [x0, y0] = pt2(G.zi, lonB), [x1, y1] = pt2(G.edge, lonB);
      E("line", { x1: x0, y1: y0, x2: x1, y2: y1, stroke: "var(--dp-line)", "stroke-width": .9 });
      const [gx, gy] = pt2((G.zi + G.edge) / 2, lonB + 15);
      svg.appendChild(GL.symbolGroup(svgNS, C.SIGNS[i].glyph, gx, gy, full ? 19 : 17, "var(--dp-lav)"));
      // 完整盘才画 5° 刻度
      if (full) for (let d = 5; d < 30; d += 5) {
        const [t0x, t0y] = pt2(G.zi, lonB + d), [t1x, t1y] = pt2(G.zi + 5, lonB + d);
        E("line", { x1: t0x, y1: t0y, x2: t1x, y2: t1y, stroke: "var(--dp-line)", "stroke-width": .6 });
      }
    }

    // 宫头与宫号(真实 cusp,不做任何调整)
    for (let i = 0; i < 12; i++) {
      const cl = res.cusps[i];
      const isAxis = (i === 0 || i === 3 || i === 6 || i === 9);
      const [hx0, hy0] = pt2(G.house, cl), [hx1, hy1] = pt2(G.zi, cl);
      E("line", {
        x1: hx0, y1: hy0, x2: hx1, y2: hy1,
        stroke: isAxis ? "var(--dp-lav)" : "var(--dp-line)",
        "stroke-width": isAxis ? 1.6 : .9
      });
      const mid = cl + C.n360(res.cusps[(i + 1) % 12] - cl) / 2;
      const [nx, ny] = pt2(G.house + 15, mid);
      const t = E("text", {
        x: nx, y: ny + 4, "text-anchor": "middle", "font-size": full ? 12 : 11,
        fill: "var(--dp-mut)", "font-family": "inherit"
      });
      t.textContent = i + 1;
    }

    // 四轴标签
    const AX = [["ASC", res.ang.asc], ["MC", res.ang.mc], ["DSC", C.n360(res.ang.asc + 180)], ["IC", C.n360(res.ang.mc + 180)]];
    AX.forEach(function (ax) {
      if (!full && (ax[0] === "DSC" || ax[0] === "IC")) return;   // 简化版只标 ASC / MC
      const [lx, ly] = pt2(G.edge - 13, ax[1]);
      const t = E("text", {
        x: lx, y: ly + 3.5, "text-anchor": "middle", "font-size": 10,
        fill: "var(--dp-lav)", "font-weight": 600, "font-family": "inherit"
      });
      t.textContent = ax[0];
    });

    // 行星:真实黄经决定角度,仅在重叠时分层,不改变位置读数
    const items = res.planets.filter(function (p) { return DP_MAJOR.indexOf(p.key) >= 0; });
    const sorted = items.slice().sort(function (a, b) { return C.n360(a.lon - asc) - C.n360(b.lon - asc); });
    const ringOf = {};
    let lastRel = -99, lastRing = 0;
    sorted.forEach(function (p) {
      const rel = C.n360(p.lon - asc);
      if (rel - lastRel < 9) { lastRing = lastRing === 0 ? 1 : 0; }
      else lastRing = 0;
      ringOf[p.key] = lastRing;
      lastRel = rel;
    });

    items.forEach(function (p) {
      const r = ringOf[p.key] === 1 ? G.ring1 : G.ring0;
      // 真实位置刻度线
      const [m0x, m0y] = pt2(G.zi, p.lon), [m1x, m1y] = pt2(G.zi - 6, p.lon);
      E("line", { x1: m0x, y1: m0y, x2: m1x, y2: m1y, stroke: "var(--dp-ink)", "stroke-width": 1.1, "stroke-opacity": .5 });
      const [gx, gy] = pt2(r, p.lon);
      if (ringOf[p.key] === 1) {
        E("line", { x1: m1x, y1: m1y, x2: gx, y2: gy, stroke: "var(--dp-line)", "stroke-width": .8 });
      }
      svg.appendChild(GL.symbolGroup(svgNS, p.glyphKey, gx, gy, full ? 19 : 17, "var(--dp-ink)"));
      if (p.retro) {
        const rt = E("text", {
          x: gx + 11, y: gy + 10, "text-anchor": "start", "font-size": 8.5,
          fill: "#b4645a", "font-family": "inherit"
        });
        rt.textContent = "℞";
      }
      // 完整盘显示度数
      if (full) {
        const g2 = C.lonToSign(p.lon);
        const [dx, dy] = pt2(r - 22, p.lon);
        const t = E("text", {
          x: dx, y: dy + 3, "text-anchor": "middle", "font-size": 8.5,
          fill: "var(--dp-mut)", "font-family": "inherit"
        });
        t.textContent = Math.floor(g2.deg) + "°";
      }
    });

    // 相位线:只有完整盘才画
    if (full) {
      // 相位 key 来自 AstroCore.ASPECTS(con/sex/squ/tri/opp)
      const ASP_COLOR = { con: "#a89a6b", sex: "#8a86b8", squ: "#b4645a", tri: "#6f9d8c", opp: "#b4645a" };
      (res.aspects || []).forEach(function (a) {
        const pa = res.planets[a.a], pb = res.planets[a.b];
        if (!pa || !pb) return;
        if (DP_MAJOR.indexOf(pa.key) < 0 || DP_MAJOR.indexOf(pb.key) < 0) return;
        const [x1, y1] = pt2(G.house - 4, pa.lon), [x2, y2] = pt2(G.house - 4, pb.lon);
        E("line", {
          x1: x1, y1: y1, x2: x2, y2: y2,
          stroke: ASP_COLOR[a.type] || "var(--dp-mut)",
          "stroke-width": .8, "stroke-opacity": .42
        });
      });
    }
  }

  // 一行行星读数:星座 · 第 N 宫
  function dpPlaceRows(list, small) {
    return list.map(function (it) {
      const p = dpPlacement(it[0]);
      if (!p) return "";
      const glyph = GL.symbolSVG ? GL.symbolSVG(p.glyph, 17, "currentColor") : "";
      return '<div class="row' + (small ? " sm" : "") + '">' +
        '<span class="gl">' + glyph + '</span>' +
        '<span><span class="nm">' + esc0(it[1]) + '</span>' +
        '<span class="vl">' + esc0(p.sign) + ' · ' + esc0(window.I18N.houseLabel ? window.I18N.houseLabel(p.house) : ("第" + p.house + "宫")) + '</span></span>' +
        (p.retro ? '<span class="rx">℞</span>' : "") + '</div>';
    }).join("");
  }
  function dpAscRow() {
    const a = dpAscSign();
    if (!a) return "";
    return '<div class="row"><span class="gl">↑</span>' +
      '<span><span class="nm">' + esc0(dpT("上升", "Rising")) + '</span>' +
      '<span class="vl">' + esc0(a.sign) + '</span></span></div>';
  }

  // 行星资料:供两个页面共用的读数(星座 · 宫位 · 度数 · 逆行)
  function dpPlacement(key) {
    if (!curResult) return null;
    const p = curResult.planets.find(function (x) { return x.key === key; });
    if (!p) return null;
    const g = C.lonToSign(p.lon);
    return {
      key: key, name: p.name, glyph: p.glyphKey,
      sign: window.I18N.isEN() ? window.I18N.TSign(g.sign) : g.sign,
      deg: g.deg, house: p.house, retro: !!p.retro
    };
  }
  function dpAscSign() {
    if (!curResult) return null;
    const g = C.lonToSign(curResult.ang.asc);
    return { sign: window.I18N.isEN() ? window.I18N.TSign(g.sign) : g.sign, deg: g.deg };
  }

  /* ============================================================
     独立页面路由
     #/topic/<id>  九大主题    #/q/<qid>  三十问
     #/reading[/n] 生命蓝图    #/map      探索地图

  let readingTab = 0;
  let curRoute = null;

  function dpT(zh, en) { return window.I18N.isEN() ? en : zh; }

  function parseRoute() {
    const h = location.hash || "";
    let m;
    if ((m = h.match(/^#\/topic\/([a-z]+)$/))) return { k: "topic", id: m[1] };
    if ((m = h.match(/^#topic-([a-z]+)$/))) return { k: "topic", id: m[1] };
    if ((m = h.match(/^#\/q\/(q\d\d)$/))) return { k: "q", id: m[1] };
    if ((m = h.match(/^#\/reading(?:\/(\d))?$/))) return { k: "reading", tab: m[1] ? +m[1] : 0 };
    if (h === "#/map") return { k: "map" };
    if (h === "#/my-sky") return { k: "mysky" };
    if (h === "#/favorites") return { k: "favorites" };
    return null;
  }
  /* 受保护的路由:全部依赖用户星盘资料
     未登录 → 登录页;已登录但资料不完整 → 出生资料 onboarding(主页表单)
     onboarding 本身不是路由,不会触发二次跳转,因此不存在 redirect loop */
  let chartsLoaded = false;
  function routeGuard() {
    if (!curRoute) return true;
    if (!window.Cloud.hasSession()) {
      const ov = $("authOverlay");
      if (ov) ov.style.display = "";
      return false;
    }
    if (!chartsLoaded) return true;   // 资料还没拉完,先放行,载入后会再判断一次
    if (!hasCompleteBirthProfile()) {
      location.hash = "";                       // 退出受保护页面
      document.body.classList.remove("dp-open");
      const dp0 = $("dpage");
      if (dp0) dp0.style.display = "none";
      const form = $("newChartBody");
      if (form) {
        form.style.display = "";
        setTimeout(function () {
          form.scrollIntoView({ behavior: "smooth", block: "center" });
          const nick = $("f_nick");
          if (nick) nick.focus();
        }, 240);
      }
      return false;
    }
    return true;
  }

  function applyRoute() {
    curRoute = parseRoute();
    const dp = $("dpage");
    if (!dp) return;
    if (!curRoute) {
      dp.style.display = "none";
      document.body.classList.remove("dp-open");
      return;
    }
    if (!routeGuard()) return;
    document.body.classList.add("dp-open");
    dp.style.display = "";
    window.scrollTo(0, 0);
    renderRoute();
  }
  function routeRefresh() { if (curRoute) renderRoute(); }
  function renderRoute() {
    const r = curRoute;
    if (!r) return;
    if (r.k === "topic") renderTopicPage(r.id);
    else if (r.k === "q") renderQPage(r.id);
    else if (r.k === "reading") { readingTab = r.tab || 0; renderReadingPage(); }
    else if (r.k === "map") renderMapPage();
    else if (r.k === "mysky") renderMySkyPage();
    else if (r.k === "favorites") renderFavoritesPage();
  }
  window.addEventListener("hashchange", applyRoute);
  applyRoute();   // 冷启动带路由 hash 时立即渲染(登录后 applyDeepLink 会再刷新一次)

  // ---------- 页面骨架与共用件 ----------
  function dpStars(n, seed) {
    let sd = (seed || 7) * 977 + 13, h = "";
    const rnd = function () { sd = (sd * 1103515245 + 12345) % 2147483648; return sd / 2147483648; };
    for (let i = 0; i < n; i++) {
      const r = rnd();
      const size = r < .7 ? (.6 + rnd() * .7) : (r < .94 ? (1.3 + rnd()) : (2.2 + rnd() * 1.2));
      const op = r < .7 ? (.16 + rnd() * .3) : (.45 + rnd() * .4);
      h += '<i style="left:' + (rnd() * 100).toFixed(2) + '%;top:' + (rnd() * 100).toFixed(2) +
        '%;width:' + size.toFixed(2) + 'px;height:' + size.toFixed(2) + 'px;--o:' + op.toFixed(2) +
        ';--d:' + (3 + rnd() * 5).toFixed(1) + 's;--delay:' + (rnd() * 6).toFixed(1) + 's"></i>';
    }
    return '<div class="dp-stars" aria-hidden="true">' + h + "</div>";
  }
  function dpScaffold(o) {
    $("dpage").innerHTML =
      '<div class="dp-hero">' + dpStars(90, o.seed || 7) +
      '<div class="dp-topbar"><span class="dp-brand"><span class="s">✶</span> INNER SKY</span>' +
      '<a class="dp-back" href="' + (o.backHref || LANDING_TOPICS) + '">← ' + esc0(o.backLabel || dpT("返回主页", "Back")) + '</a></div>' +
      '<div class="dp-hero-grid"><div>' +
      (o.chip ? '<span class="dp-chip">' + esc0(o.chip) + '</span>' : "") +
      '<h1 class="dp-title">' + esc0(o.title || "") + '</h1>' +
      (o.sub ? '<div class="dp-sub">' + esc0(o.sub) + '</div>' : "") +
      '</div>' +
      (o.art ? '<img class="dp-hero-art" src="' + o.art + '" alt="">' : "") +
      '</div></div>' +
      '<div class="dp-body">' + (o.body || "") + (o.foot || "") + '</div>';
  }
  function dpPara(x) {
    return esc0(x).split(/\n\s*\n|\n/).filter(function (y) { return y.trim(); })
      .map(function (y) { return "<p>" + y.trim() + "</p>"; }).join("");
  }
  function dpAnswerHtml(data, favSource) {
    let h = "";
    if (data.tagline)
      h += '<div class="dp-card"><div class="dp-quote"><span class="q">“</span>' + esc0(data.tagline) + "</div></div>";
    h += '<div class="dp-card"><div class="dp-sec-label">' + dpT("主题解读", "READING") + "</div>";
    h += (data.sections || []).map(function (sc) {
      const k = favKey(favSource, sc.title || "", sc.body || "");
      const btn = '<button class="fav-btn' + (isFaved(k) ? " on" : "") + '" data-fav="' + esc0(k) +
        '" data-text="' + esc0(String(sc.body || "").slice(0, 300)) + '" data-source="' + esc0(favSource) +
        '" data-section="' + esc0(sc.title || "") + '" title="' + esc0(T("saveIt")) + '">' + (isFaved(k) ? "★" : "☆") + "</button>";
      return '<div style="margin:0 0 22px"><div class="dp-h-row">' +
        (sc.title ? '<h3 class="dp-h">' + esc0(sc.title) + "</h3>" : "<span></span>") + btn + "</div>" +
        '<div class="dp-prose" data-saveable data-source="' + esc0(favSource) +
        '" data-section="' + esc0(sc.title || "") + '">' + dpPara(sc.body) + "</div></div>";
    }).join("");
    h += "</div>";
    if (data.steps && data.steps.length)
      h += '<div class="dp-card"><div class="dp-sec-label">' + dpT("从这里开始", "WHERE TO START") + '</div><div class="dp-steps">' +
        data.steps.map(function (st, i) {
          return '<div class="st"><b>' + (i + 1) + " · " + esc0(st.title) + "</b><div>" + dpPara(st.body) + "</div></div>";
        }).join("") + "</div></div>";
    if (data.aha && data.aha.length)
      h += '<div class="dp-card"><div class="dp-sec-label">' + dpT("值得记住", "WORTH KEEPING") + '</div><div class="dp-aha">' +
        data.aha.map(function (q) { return '<div class="a">' + esc0(q) + "</div>"; }).join("") + "</div></div>";
    // 两个独立 Card:各自有 border / 背景,不嵌套在同一个外框里
    if (data.question)
      h += '<div class="dp-think"><div class="t">' + dpT("留给你的思考", "A QUESTION FOR YOU") + '</div>' +
        '<div class="dp-prose">' + dpPara(data.question) + "</div></div>";
    if (data.action)
      h += '<div class="dp-think"><div class="t">' + dpT("试试看", "TRY THIS") + '</div>' +
        '<div class="dp-prose">' + dpPara(data.action) + "</div></div>";
    return h;
  }
  function dpNeedChart() {
    return '<div class="dp-card dp-loading"><span class="g">✹</span>' +
      dpT("请先回到主页选择或建立一张星盘", "Please choose or create a chart first") +
      '<br><a class="dp-cta" style="margin-top:16px" href="' + LANDING_URL + '">' + dpT("回到主页", "Back to home") + "</a></div>";
  }
  function dpLoading(msg) { return '<div class="dp-card dp-loading"><span class="g">✶</span>' + esc0(msg) + "</div>"; }
  function dpError(err, retryId) {
    return '<div class="dp-card dp-loading">' + dpT("这次没有生成成功。", "Generation didn’t go through.") +
      '<br><span style="font-size:12px;opacity:.8">' + esc0((err && err.hint) || (err && err.msg) || "") + "</span><br>" +
      '<button class="dp-cta" style="margin-top:16px" id="' + retryId + '">' + dpT("再试一次", "Try again") + "</button></div>";
  }
  function dpReturnFoot() {
    return '<div class="dp-return"><span class="say">' +
      dpT("你不是来寻找答案,\n而是来重新看见自己。", "You are not here for answers —\nyou are here to see yourself again.").replace(/\n/g, "<br>") +
      '</span><a class="dp-cta" href="' + LANDING_TOPICS + '">' + dpT("返回主题列表", "Back to topics") + "</a></div>";
  }

  // ---------- 页面:九大主题 ----------
  function renderTopicPage(tid) {
    const t = window.Reading.findTopic(tid);
    if (!t) { location.hash = ""; return; }
    const tName = window.I18N.TTopic(tid, "name") || t.name;
    const tSub = window.I18N.TTopic(tid, "sub") || t.sub;
    const tTeaser = window.I18N.TTopic(tid, "teaser") || t.teaser;
    const c = activeChart();
    let body;
    if (!c || !curResult) body = dpNeedChart();
    else {
      const saved = window.Reading.reviveTopic((c[window.Reading.LK("topics")] || {})[tid]);
      if (saved) body = dpAnswerHtml(saved, tName);
      else if (topicBusy) body = dpLoading(dpT("正在为你整理这一章,大约需要一分钟…", "Preparing this chapter for you — about a minute…"));
      else if (topicErrs[tid]) body = dpError(topicErrs[tid], "dpRetryT");
      else if (window.I18N.isEN()) body = '<div class="dp-card">' + missingLangHtml("dpGenT") + "</div>";
      else body = dpLoading(dpT("正在为你整理这一章,大约需要一分钟…", "Preparing…"));
    }
    // 底部「上一个 / 1 of 9 / 下一个」主题导航已整组移除(含其 wrapper 与留白)
    const foot = dpReturnFoot();
