<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inner Sky · Know Yourself Through the Stars</title>
<meta name="description" content="看见完整的自己。Inner Sky 用星盘陪你慢慢理解自己,不被定义、不被标签。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Noto+Serif+SC:wght@400;500&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Inner Sky — Design Tokens(与 globals.css 逐字一致)
   本项目无构建流程,tokens 以原生 CSS 变量使用。
   改颜色或字体请回 Figma,不要在组件样式里写死。
   ============================================================ */
:root {
  --background-midnight-navy: #09122e;
  --background-deep-space: #101a3e;
  --background-soft-night: #18224a;
  --background-story-navy: #0c1534;
  --surface-moon-cream: #f8f2ed;
  --surface-cloud-white: #fcf9f6;
  --surface-soft-blush: #f3e3e0;
  --accent-moon-lavender: #aaa0d5;
  --accent-sunset-pink: #ebc4c3;
  --accent-starlight-gold: #e8d3a2;
  --text-dark: #22233a;
  --text-light: #f9f6f2;
  --text-secondary: #77778a;
  --border-card: #f0e8e3;
  --gradient-primary: linear-gradient(135deg, #8176ad 0%, #e9b9b6 100%);
  --shadow-button: 0 8px 24px rgba(9, 18, 46, 0.15);
  --shadow-button-hover: 0 12px 30px rgba(9, 18, 46, 0.22);
  --shadow-card: 0 12px 40px rgba(9, 18, 46, 0.08);
  --font-display: "Cormorant Garamond", Georgia, serif;
  --font-serif-sc: "Noto Serif SC", Georgia, serif;
  --font-sans-sc: "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
  --display-en-72-font-size: 72px;  --display-en-72-line-height: 78px;
  --heading-h1-40-font-size: 40px;  --heading-h1-40-line-height: 60px;
  --heading-h2-36-font-size: 36px;  --heading-h2-36-line-height: 54px;
  --heading-h3-20-font-size: 20px;  --heading-h3-20-line-height: 32px;
  --body-regular-16-font-size: 16px; --body-regular-16-line-height: 30px;
  --body-caption-14-font-size: 14px; --body-caption-14-line-height: 26px;
  --body-label-12-font-size: 12px;  --body-label-12-line-height: 20px;
  --layout-max-width: 1200px;
  --layout-gutter: 24px;
  --layout-margin: 120px;
  --radius-card: 24px;
  --radius-card-sm: 16px;
  --radius-button: 28px;
  --ease-soft: cubic-bezier(0.22, 1, 0.36, 1);
  --duration-hover: 300ms;
  --duration-scroll: 400ms;
}
.type-display { font-family: var(--font-display); font-size: var(--display-en-72-font-size); font-weight: 300; line-height: var(--display-en-72-line-height); }
.type-h1 { font-family: var(--font-serif-sc); font-size: var(--heading-h1-40-font-size); font-weight: 500; line-height: var(--heading-h1-40-line-height); }
.type-h2 { font-family: var(--font-serif-sc); font-size: var(--heading-h2-36-font-size); font-weight: 500; line-height: var(--heading-h2-36-line-height); }
.type-h3 { font-family: var(--font-sans-sc); font-size: var(--heading-h3-20-font-size); font-weight: 500; line-height: var(--heading-h3-20-line-height); }
.type-body { font-family: var(--font-sans-sc); font-size: var(--body-regular-16-font-size); font-weight: 300; line-height: var(--body-regular-16-line-height); }
.type-caption { font-family: var(--font-sans-sc); font-size: var(--body-caption-14-font-size); font-weight: 300; line-height: var(--body-caption-14-line-height); }
.type-label { font-family: var(--font-sans-sc); font-size: var(--body-label-12-font-size); font-weight: 400; line-height: var(--body-label-12-line-height); }
@media (max-width: 767px) {
  :root {
    --display-en-72-font-size: 42px; --display-en-72-line-height: 48px;
    --heading-h1-40-font-size: 26px; --heading-h1-40-line-height: 40px;
    --heading-h2-36-font-size: 24px; --heading-h2-36-line-height: 38px;
    --heading-h3-20-font-size: 17px; --heading-h3-20-line-height: 28px;
    --layout-margin: 24px;
  }
}
@keyframes fade-in { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }
@keyframes fade-up { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
@keyframes twinkle { 0%,100% { opacity: var(--o, .5); } 50% { opacity: calc(var(--o, .5) * 0.35); } }
.animate-fade-in { animation: fade-in 1s var(--animation-delay, 0s) var(--ease-soft) both; }
.animate-fade-up { animation: fade-up 1s var(--animation-delay, 0s) var(--ease-soft) both; }
@media (prefers-reduced-motion: reduce) {
  .animate-fade-in, .animate-fade-up { animation: none; opacity: 1; transform: none; }
  .starfield i { animation: none !important; }
}

/* ============================================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { background: var(--surface-cloud-white); color: var(--text-dark); font-family: var(--font-sans-sc); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }
.wrap { max-width: var(--layout-max-width); margin: 0 auto; padding: 0 var(--layout-gutter); }

/* ---------- 星空:细小、不规则、疏密不均 ---------- */
.starfield { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.starfield i {
  position: absolute; display: block; border-radius: 50%;
  background: #fff; opacity: var(--o); animation: twinkle var(--d) ease-in-out var(--delay) infinite;
}
.starfield i.bright { box-shadow: 0 0 var(--glow) var(--glow) rgba(255,255,255,.45); }

/* ---------- 按钮 ---------- */
.btn-primary {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 14px 34px; border-radius: var(--radius-button);
  background: var(--gradient-primary); color: var(--text-light);
  font-family: var(--font-sans-sc); font-size: 15px; letter-spacing: .05em;
  box-shadow: var(--shadow-button);
  transition: box-shadow var(--duration-hover) var(--ease-soft), transform var(--duration-hover) var(--ease-soft);
}
.btn-primary:hover { box-shadow: var(--shadow-button-hover); transform: translateY(-2px); }
.btn-ghost {
  display: inline-block; padding: 11px 26px; border-radius: var(--radius-button);
  border: 1px solid rgba(249,246,242,.45); color: var(--text-light); font-size: 14px; letter-spacing: .04em;
  transition: border-color var(--duration-hover) var(--ease-soft), background var(--duration-hover) var(--ease-soft);
}
.btn-ghost:hover { border-color: rgba(249,246,242,.9); background: rgba(249,246,242,.06); }

/* ---------- Header ---------- */
header.site { position: absolute; inset: 0 0 auto 0; z-index: 5; }
.nav { display: flex; align-items: center; padding-top: 34px; }
.brand { font-family: var(--font-display); font-size: 19px; letter-spacing: .42em; color: var(--text-light); }
.nav-links { display: flex; gap: 32px; margin-left: auto; align-items: center; }
.nav-links a { color: rgba(249,246,242,.82); font-size: 14px; letter-spacing: .06em; transition: color var(--duration-hover); }
.nav-links a:hover { color: var(--text-light); }
/* 注册 / 登入:Header 最右,位于「关于我们」右侧 */
.nav-cta {
  margin-left: 28px; padding: 9px 22px; border-radius: var(--radius-button);
  background: linear-gradient(135deg, rgba(170,160,213,.9), rgba(235,196,195,.9));
  color: var(--background-midnight-navy); font-size: 13.5px; font-weight: 500; letter-spacing: .04em;
  transition: box-shadow var(--duration-hover) var(--ease-soft);
}
.nav-cta:hover { box-shadow: 0 6px 20px rgba(170,160,213,.4); }
@media (max-width: 860px) { .nav-links a:not(.nav-cta) { display: none; } .nav-links { margin-left: auto; } .nav-cta { margin-left: 0; } }

/* ---------- Hero ---------- */
.hero { position: relative; overflow: hidden; color: var(--text-light);
  background: radial-gradient(1100px 640px at 76% 34%, #17204a 0%, var(--background-midnight-navy) 58%); }
.hero .wrap { position: relative; z-index: 2; display: grid; grid-template-columns: 1fr 1fr;
  align-items: center; min-height: 660px; padding-top: 120px; padding-bottom: 96px; }
.hero-copy h1 { color: var(--text-light); }
.hero-copy .sub { margin-top: 26px; color: rgba(249,246,242,.78); letter-spacing: .3em; font-weight: 300; font-size: 17px; font-family: var(--font-serif-sc); }
.hero-copy .rule { width: 54px; height: 1px; background: rgba(249,246,242,.35); margin: 26px 0 0; }
.hero-copy .cta-row { margin-top: 40px; }
/* 行星:完整显示,永不裁切 */
.hero-visual { position: relative; display: flex; align-items: center; justify-content: center; min-height: 460px; }
.hero-visual img {
  width: 100%; max-width: 560px; height: auto; object-fit: contain;
  filter: drop-shadow(0 0 80px rgba(180,150,220,.35));
  animation: fade-up 1.4s .2s var(--ease-soft) both;
}
@media (max-width: 900px) {
  .hero .wrap { grid-template-columns: 1fr; min-height: 0; padding-top: 118px; padding-bottom: 60px; }
  .hero-visual { min-height: 0; margin-top: 30px; }
  .hero-visual img { max-width: 78vw; }
}

/* ---------- 人生章节(星体入口) ---------- */
.chapters { background: var(--surface-moon-cream); padding: 96px 0 108px; text-align: center; }
.chapters .lead { margin-top: 14px; color: var(--text-secondary); }
.chapter-grid {
  margin-top: 62px; display: grid; gap: 40px var(--layout-gutter);
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
}
/* 一个星体 = 一个完整单元:星球、标题、描述共用同一列,天然居中对齐 */
.planet-chapter {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  gap: 4px; padding: 6px 4px;
}
.planet-chapter .orb { width: 104px; height: 104px; display: grid; place-items: center; margin-bottom: 16px; }
.planet-chapter .orb img {
  width: 100%; height: 100%; object-fit: contain;
  transition: transform var(--duration-hover) var(--ease-soft), filter var(--duration-hover) var(--ease-soft);
}
.planet-chapter:hover .orb img { transform: translateY(-5px) scale(1.04); filter: drop-shadow(0 10px 22px rgba(9,18,46,.16)); }
.planet-chapter .name { font-family: var(--font-serif-sc); font-size: 18px; font-weight: 500; letter-spacing: .05em; }
.planet-chapter .cap { color: var(--text-secondary); font-size: 13px; line-height: 23px; font-weight: 300; }
.planet-chapter .done { margin-top: 5px; font-size: 11px; letter-spacing: .1em; color: var(--accent-moon-lavender); min-height: 14px; }
@media (max-width: 767px) { .chapter-grid { grid-template-columns: repeat(2, 1fr); gap: 34px 12px; } .planet-chapter .orb { width: 86px; height: 86px; } }

/* ---------- Dashboard 预览 ---------- */
.preview { padding: 40px 0 96px; background: var(--surface-cloud-white); }
.preview-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: var(--layout-gutter); align-items: start; }
.card { background: #fff; border: 1px solid var(--border-card); border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding: 30px 32px; }
.card h4 { font-family: var(--font-serif-sc); font-size: 20px; font-weight: 500; }
.card .link { float: right; color: var(--text-secondary); font-size: 13px; }
.card .link:hover { color: var(--text-dark); }
.greet { font-family: var(--font-serif-sc); font-size: 26px; font-weight: 500; }
.greet-sub { color: var(--text-secondary); font-size: 13.5px; margin-top: 6px; }
.section-label { margin: 26px 0 12px; font-size: 12.5px; letter-spacing: .08em; color: var(--text-secondary); }
/* 未读章节滑轨 */
.rail { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; scrollbar-width: thin; }
.rail::-webkit-scrollbar { height: 4px; }
.rail::-webkit-scrollbar-thumb { background: var(--border-card); border-radius: 2px; }
.chapter-card {
  scroll-snap-align: start; flex: 0 0 min(100%, 420px);
  position: relative; overflow: hidden; border-radius: var(--radius-card-sm);
  min-height: 158px; padding: 24px 26px; color: var(--text-light);
  display: flex; flex-direction: column; justify-content: space-between;
  background-color: var(--background-deep-space); background-size: cover; background-position: center;
}
.chapter-card::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(100deg, rgba(12,21,52,.93) 0%, rgba(12,21,52,.78) 46%, rgba(12,21,52,.25) 100%); }
.chapter-card > * { position: relative; z-index: 1; }
.chapter-card .q { font-family: var(--font-serif-sc); font-size: 20px; line-height: 33px; max-width: 62%; }
.chapter-card .go { align-self: flex-start; padding: 8px 18px; border-radius: var(--radius-button); border: 1px solid rgba(249,246,242,.5); font-size: 13px; }
.chapter-card .tag { font-size: 11px; letter-spacing: .16em; color: rgba(249,246,242,.62); font-family: var(--font-display); }
/* 推荐 */
.reco-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.reco { border: 1px solid var(--border-card); border-radius: var(--radius-card-sm); padding: 14px; transition: box-shadow var(--duration-hover) var(--ease-soft), transform var(--duration-hover) var(--ease-soft); }
.reco:hover { box-shadow: var(--shadow-card); transform: translateY(-3px); }
.reco .win { height: 108px; border-radius: 56px 56px 12px 12px; margin-bottom: 12px; background-size: cover; background-position: center 22%; }
.reco .q { font-size: 13.5px; line-height: 22px; min-height: 44px; }
.reco .tag { display: inline-block; margin-top: 10px; padding: 3px 10px; border-radius: 10px; background: var(--surface-soft-blush); color: #a5766f; font-size: 11.5px; }
/* 侧栏 */
.side { display: flex; flex-direction: column; gap: var(--layout-gutter); }
.sky-card { background: linear-gradient(150deg, #f5dfe6, #e6def2 55%, #f8ecdf); border: none; }
.wheel { position: relative; width: 100%; aspect-ratio: 1; margin-top: 18px; display: grid; place-items: center; }
.wheel img, .wheel svg { width: 100%; height: 100%; object-fit: contain; }
.wheel .hint { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; font-size: 11px; color: var(--text-secondary); }
.fav { background: var(--surface-moon-cream); border-radius: var(--radius-card-sm); padding: 20px 22px; margin-top: 16px; }
.fav blockquote { font-family: var(--font-serif-sc); font-size: 15.5px; line-height: 30px; }
.fav .meta { display: flex; justify-content: space-between; margin-top: 12px; color: var(--text-secondary); font-size: 12px; }
.empty { color: var(--text-secondary); font-size: 13px; line-height: 26px; margin-top: 14px; }
@media (max-width: 900px) { .preview-grid { grid-template-columns: 1fr; } .reco-grid { grid-template-columns: repeat(2, 1fr); } .chapter-card .q { max-width: 100%; } }

/* ---------- 品牌故事 ---------- */
.story { padding: 20px 0 110px; background: var(--surface-cloud-white); }
.story-panel { position: relative; overflow: hidden; border-radius: var(--radius-card); color: var(--text-light);
  background: radial-gradient(900px 480px at 85% 20%, #1b2a5c 0%, var(--background-story-navy) 60%);
  display: grid; grid-template-columns: 1fr 1.05fr; gap: 40px; padding: 74px 70px; }
.story-panel .wrap-in { position: relative; z-index: 2; }
.story-copy h2 { color: var(--text-light); }
.story-copy p { margin-top: 26px; color: rgba(249,246,242,.75); }
.story-copy .btn-ghost { margin-top: 38px; }
.story-visual { position: relative; z-index: 2; border-radius: var(--radius-card-sm); overflow: hidden; min-height: 300px;
  background-size: cover; background-position: center; }
@media (max-width: 900px) { .story-panel { grid-template-columns: 1fr; padding: 46px 28px; } .story-visual { min-height: 200px; } }

/* ---------- 页脚 ---------- */
footer.site { background: var(--background-midnight-navy); color: rgba(249,246,242,.75); position: relative; overflow: hidden; }
footer .wrap { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; padding-top: 46px; padding-bottom: 46px; }
footer .brand { color: var(--text-light); }
footer .fine { font-size: 12.5px; display: flex; align-items: center; gap: 20px; }
.seal-img { width: 74px; height: auto; opacity: .9; }
@media (max-width: 640px) { footer .wrap { flex-direction: column; gap: 18px; text-align: center; } }
</style>
</head>
<body>

<script>
/* ============================================================
   应用入口。现有应用是独立 HTML,建议与本页同目录并命名 app.html。
   若沿用其他文件名,只改这一行即可全站生效。
   ============================================================ */
var APP_URL = "app.html";
// Supabase 邮箱确认链接若跳回站点根目录,会带 token 落在本页;原样转交应用页,登录状态不丢。
(function () {
  var h = location.hash || "", q = location.search || "";
  if (/access_token=|type=signup|type=recovery|code=/.test(h + q)) location.replace(APP_URL + q + h);
})();
</script>

<div class="hero">
  <div class="starfield" id="heroStars" aria-hidden="true"></div>
  <header class="site">
    <div class="wrap nav">
      <a class="brand" href="#top">INNER&nbsp;SKY</a>
      <nav class="nav-links">
        <a href="#chapters">探索</a>
        <a href="#sky" data-app-hash="#chart">我的星空</a>
        <a href="#favs" data-app-hash="#favs">收藏</a>
        <a href="#story">关于我们</a>
        <a class="nav-cta" href="app.html" data-app>注册 / 登入</a>
      </nav>
    </div>
  </header>

  <div class="wrap" id="top">
    <div class="hero-copy">
      <h1 class="type-display animate-fade-up">Know Yourself<br>Through the<br>Stars</h1>
      <div class="sub animate-fade-up" style="--animation-delay:.15s">看 见 完 整 的 自 己</div>
      <div class="rule animate-fade-up" style="--animation-delay:.22s"></div>
      <div class="cta-row animate-fade-up" style="--animation-delay:.3s">
        <!-- 开启我的星空 = 打开用户既有的生命蓝图,不生成新内容 -->
        <a class="btn-primary" href="app.html#blueprint" data-app-hash="#blueprint">开启我的星空 <span aria-hidden="true">✦</span></a>
      </div>

<script>
/* ============================================================
   1. 星空:细小、大小不一、亮度不一、疏密不均
      不是等距圆点,也不是 particle animation
   ============================================================ */
function paintStars(el, count, seed) {
  if (!el) return;
  var rnd = (function (s) { return function () { s = (s * 1103515245 + 12345) % 2147483648; return s / 2147483648; }; })(seed);
  var html = "";
  for (var i = 0; i < count; i++) {
    var r = rnd();
    // 绝大多数极细(0.6–1.2px),少数中等,极少数稍亮
    var size = r < 0.72 ? (0.6 + rnd() * 0.6) : (r < 0.95 ? (1.3 + rnd() * 0.9) : (2.2 + rnd() * 1.1));
    var op = r < 0.72 ? (0.18 + rnd() * 0.3) : (r < 0.95 ? (0.4 + rnd() * 0.3) : (0.75 + rnd() * 0.25));
    // 疏密不均:用平方分布让星点自然聚散,而不是平均铺满
    var x = Math.pow(rnd(), 0.85) * 100, y = rnd() * 100;
    var bright = r >= 0.97;
    html += '<i class="' + (bright ? "bright" : "") + '" style="left:' + x.toFixed(2) + '%;top:' + y.toFixed(2) +
      '%;width:' + size.toFixed(2) + 'px;height:' + size.toFixed(2) + 'px;--o:' + op.toFixed(2) +
      ';--d:' + (3 + rnd() * 5).toFixed(1) + 's;--delay:' + (rnd() * 6).toFixed(1) + 's' +
      (bright ? ';--glow:' + (1 + rnd() * 2).toFixed(1) + 'px' : '') + '"></i>';
  }
  el.innerHTML = html;
}
paintStars(document.getElementById("heroStars"), 150, 20260818);
paintStars(document.getElementById("footStars"), 40, 7788);

/* ============================================================
   4. 读取应用写入的本地快照(只读展示,不写回、不改任何解读)
      profile 昵称 / 已读章节 / 星盘 SVG / 最近收藏
   ============================================================ */
function readCache(key) {
  try { return JSON.parse(localStorage.getItem(key) || "null"); } catch (e) { return null; }
}
var PROFILE = readCache("inner_sky_profile_v1") || {};
var READ = readCache("inner_sky_read_v1") || {};      // { topicId: true }
var WHEEL = null;
try { WHEEL = localStorage.getItem("inner_sky_wheel_v1"); } catch (e) { }
var FAVS = readCache("inner_sky_favs_v1") || [];

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }
function appHref(hash) { return APP_URL + (hash || ""); }

/* ---------- 渲染星体章节 ---------- */
(function () {
  var grid = document.getElementById("chapterGrid");
  grid.innerHTML = CHAPTERS.map(function (c, i) {
    return '<a class="planet-chapter animate-fade-up" style="--animation-delay:' + (0.04 * i).toFixed(2) + 's" href="' +
      appHref("#topic-" + c.id) + '" data-app-hash="#topic-' + c.id + '">' +
      '<span class="orb"><img src="' + c.orb + '" alt=""></span>' +
      '<span class="name">' + esc(c.name) + '</span>' +
      '<span class="cap">' + esc(c.cap) + '</span>' +
      '<span class="done">' + (READ[c.id] ? "已读" : "") + '</span></a>';
  }).join("");
})();

/* ---------- 我的收藏 ---------- */
(function () {
  var slot = document.getElementById("favSlot");
  if (FAVS.length) {
    slot.innerHTML = FAVS.slice(0, 2).map(function (f) {
      return '<div class="fav"><blockquote>“ ' + esc(f.text) + '</blockquote>' +
        '<div class="meta"><span>' + esc(f.source || "") + (f.ts ? " · " + esc(f.ts) : "") + '</span><span>★</span></div></div>';
    }).join("");
  } else {
    slot.innerHTML = '<div class="empty">读到有共鸣的句子时,点一下句子旁的星号,<br>它就会留在这里。</div>';
  }
})();

/* ---------- 全站入口统一走 APP_URL ---------- */
document.querySelectorAll("a[data-app]").forEach(function (a) { a.setAttribute("href", APP_URL); });
document.querySelectorAll("a[data-app-hash]").forEach(function (a) {
  a.setAttribute("href", APP_URL + a.getAttribute("data-app-hash"));
});

/* ---------- 问候:随时段变化;已登入换成本人名字 ---------- */
(function () {
  var h = new Date().getHours();
  document.getElementById("greetWord").textContent =
    (h >= 5 && h < 11) ? "早安" : (h >= 11 && h < 18) ? "午安" : (h >= 18 && h < 23) ? "晚安" : "夜深了";
  var name = PROFILE.nick || "";
  if (!name) {
    var sess = readCache("xingli_session_v1");
    if (sess && sess.access_token && sess.email) name = sess.email.split("@")[0];
  }
  if (name) {
    document.getElementById("greetName").textContent = name;
  } else {
    document.getElementById("greetName").textContent = "";
    document.getElementById("greetComma").textContent = "";
    document.getElementById("greetSub").textContent = "欢迎来到你的内在宇宙";
  }
})();
</script>
