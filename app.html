  // ---------- 初始化 ----------
  function init() {
    // 旧版界面从此不参与任何使用者流程(仅保留 DOM 供计算与快照复用)
    document.body.classList.add("legacy-off");
    // —— 星空登录页的星点(细小、大小不一、疏密不均)——
    (function () {
      const el = document.getElementById("authStars");
      if (!el) return;
      let s = 987654321;
      const rnd = function () { s = (s * 1103515245 + 12345) % 2147483648; return s / 2147483648; };
      let h = "";
      for (let i = 0; i < 110; i++) {
        const r = rnd();
        const size = r < .72 ? (.6 + rnd() * .6) : (r < .95 ? (1.3 + rnd() * .9) : (2.2 + rnd() * 1.1));
        const op = r < .72 ? (.18 + rnd() * .3) : (r < .95 ? (.4 + rnd() * .3) : (.75 + rnd() * .25));
        h += '<i style="left:' + (rnd() * 100).toFixed(2) + '%;top:' + (rnd() * 100).toFixed(2) +
          '%;width:' + size.toFixed(2) + 'px;height:' + size.toFixed(2) + 'px;--o:' + op.toFixed(2) +
          ';--d:' + (3 + rnd() * 5).toFixed(1) + 's;--delay:' + (rnd() * 6).toFixed(1) + 's"></i>';
      }
      el.innerHTML = h;
    })();

    // —— 语言切换器 ——
    function paintLangBtns() {
      document.querySelectorAll("#langSwitch button").forEach(function (b) {
        b.classList.toggle("on", b.dataset.lang === window.I18N.lang);
      });
    }
    document.querySelectorAll("#langSwitch button").forEach(function (b) {
      b.addEventListener("click", function () { window.I18N.setLang(b.dataset.lang); });
    });
    // 语言变更 → 只重画介面与已存在的内容,不发出任何生成请求
    window.I18N.onChange(function () {
      paintLangBtns();
      closeDrawer();
      renderChartList();
      if (activeChart() && curResult) {
        ensureToggleBar();
        drawWheel();
        drawPosTable();
        curTopic = null; mapOpen = false; curDomain = null; curQ = null;
        renderReading();
        renderTopics();
      }
      applyRoute();   // 独立页面跟随语言切换重绘
    });
    window.I18N.applyStatic();
    paintLangBtns();

    initForm();
    // —— 云端登录门 ——
    // 主视觉(渐变按钮)永远落在当前这一步真正要做的动作上
    function swapAuthEmphasis(signup) {
      const login = $("authLogin"), sign = $("authSignup");
      login.className = signup ? "btn-alt" : "btn-main";
      sign.className = signup ? "btn-main" : "btn-alt";
      const card = sign.parentNode;
      if (signup) card.insertBefore(sign, login); else card.insertBefore(login, sign);
    }
    function setAuthMsg(t, ok) { const m = $("authMsg"); m.textContent = t || ""; m.style.color = ok ? "var(--gold)" : "var(--fire)"; }
    // 登入页上的等待状态(不跳页、不换背景)
    function setAuthLoading(on, msg) {
      const card = document.querySelector(".sky-auth-card");
      if (!card) return;
      card.classList.toggle("loading", !!on);
      if (msg) { const t = card.querySelector(".sky-auth-loading .tx"); if (t) t.textContent = msg; }
    }
    function leaveAuth() {
      setAuthLoading(false);
      $("authOverlay").style.display = "none";
    }

    // silent = 已经登录的回访者:不显示登入页,直接进入内容
    function enterApp(silent) {
      if (!silent) {
        // 只有刚提交帐密的使用者才停在登入页看 Loading
        $("authOverlay").style.display = "";
        setAuthLoading(true, window.I18N.isEN() ? "Entering your sky…" : "正在进入你的星空…");
      }
      // 页面顶部右上角账号条(位于 header 内,随页面滚动一起离开画面)
      const bar = document.getElementById("acctBar");
      if (bar && !bar.dataset.ready) {
        bar.dataset.ready = "1";
        bar.style.display = "flex";
        bar.innerHTML = '<span></span><button id="logoutBtn" data-i18n="logout"></button>';
        bar.firstChild.textContent = window.Cloud.nick() || window.Cloud.email();
        document.getElementById("logoutBtn").textContent = T("logout");
        document.getElementById("logoutBtn").addEventListener("click", doLogout);
      }
      // 拉取偏好与星盘。
      // loadCharts 失败必须当成「不知道」,不能当成「这个帐号没有星盘」——
      // 后者会把已有星盘的使用者推去重新输入出生资料。
      chartsError = null;
      return Promise.all([
        window.Cloud.loadPrefs().catch(function () { return {}; }),
        window.Cloud.loadCharts()
      ]).then(function (r) {
        const prefs = r[0] || {};
        store.charts = r[1] || [];
        applyCloudPrefs(prefs);
        chartsLoaded = true;
        if (!store.charts.length) {
          // 首次登录:自动迁移旧本地数据
          return window.Cloud.migrateLegacy().then(function (mig) {
            if (mig.length) store.charts = mig;
          }).catch(function () { });
        }
      }).then(function () {
        chartsSettled = true;   // 到这里才算「资料库已经确认过」
        if (!store.activeId || !store.charts.some(c => c.id === store.activeId)) {
          const usable = store.charts.filter(isCompleteBirthData);
          store.activeId = usable.length ? usable[0].id : (store.charts.length ? store.charts[0].id : null);
        }
        renderChartList(); drawActive();
        refreshAcctBar(); saveProfileCache();
        routeAfterEntry();
        // 目标页面已经渲染,这时才收起登入页,中间不会露出任何其他背景
        requestAnimationFrame(function () { requestAnimationFrame(leaveAuth); });
        setTimeout(function () { saveWheelSnapshot(); renderFavs(); applyDeepLink(); }, 600);
        // Username 以帐号自己的 user_metadata 为准,拿到后静默更新一次
        window.Cloud.fetchUser().then(function () { refreshAcctBar(); saveProfileCache(); }).catch(function () { });
      }).catch(function (e) {
        console.warn(e);
        chartsError = e;
        chartsSettled = false;
        if (/会话已过期|no session/.test(String(e && e.message))) { requireLogin("expired"); return; }
        // 资料读不到:留在原本的页面显示可重试的提示,不跳 onboarding、不清资料
        if (!silent) { setAuthLoading(false); setAuthMsg(window.I18N.isEN() ? "Could not load your data. Please try again." : "资料载入失败，请再试一次"); return; }
        leaveAuth();
        applyRoute();
      });
    }

    /* 闲置回来 / refresh / 手动重试:重新跟资料库确认真实状态,而不是相信前端 state */
    let reloading = null;
    function reloadUserData() {
      if (!window.Cloud.hasSession()) { requireLogin("none"); return Promise.resolve(); }
      if (!window.Cloud.dayValid()) { requireLogin("day"); return Promise.resolve(); }
      if (reloading) return reloading;
      reloading = enterApp(true);
      const done = function () { reloading = null; };
      Promise.resolve(reloading).then(done, done);
      return reloading;
    }
    window.__reloadUserData = reloadUserData;

    function refreshAcctBar() {
      const bar = document.getElementById("acctBar");
      if (!bar || !bar.firstChild) return;
      bar.firstChild.textContent = window.Cloud.nick() || window.Cloud.email() || "";
    }
    $("authLogin").addEventListener("click", function () {
      if (signupMode) {   // 从注册态退回登录态
        signupMode = false;
        $("authIdField").style.display = "none";
        $("authSignup").textContent = T("signup");
        $("authLogin").textContent = T("login");
        swapAuthEmphasis(false);
        setAuthMsg("");
        return;
      }
      const em = $("authEmail").value.trim(), pw = $("authPw").value;
      if (!em || pw.length < 6) { setAuthMsg(T("authNeed")); return; }
      setAuthMsg(T("loggingIn"), true);
      window.Cloud.login(em, pw).then(enterApp).catch(function (e) { setAuthMsg(e.message); });
    });
    // 第一次点「注册」先展开 User ID 栏位,第二次才真的送出
    let signupMode = false;
    $("authSignup").addEventListener("click", function () {
      if (!signupMode) {
        signupMode = true;
        $("authIdField").style.display = "";
        $("authSignup").textContent = T("signupGo");
        $("authLogin").textContent = T("backToLogin");
        swapAuthEmphasis(true);
        setAuthMsg("");
        $("authUserId").focus();
        return;
      }
      const em = $("authEmail").value.trim(), pw = $("authPw").value, uid = $("authUserId").value.trim();
      if (!em || pw.length < 6) { setAuthMsg(T("authNeed")); return; }
      if (!uid) { setAuthMsg(T("userIdNeed")); return; }
      setAuthMsg(T("signingUp"), true);
      window.Cloud.signup(em, pw, uid).then(function (r) {
        // 绑定到这个帐号的 user_id,换人登入时不会被误用
        try { localStorage.setItem("inner_sky_userid_v1", JSON.stringify({ uid: window.Cloud.userId(), nick: uid })); } catch (e) { }
        if (r.loggedIn) enterApp();
        else setAuthMsg(T("signupOk"), true);
      }).catch(function (e) { setAuthMsg(e.message); });
    });
    $("authPw").addEventListener("keydown", function (e) { if (e.key === "Enter") $("authLogin").click(); });
    window.__setAuthLoading = setAuthLoading;

    /* 冷启动。
       以前是「enterApp 与 refresh 并发」,两条路会同时用同一个 refresh_token 续期,
       第二个必然失败并清空会话 → 已有星盘的人被当成新用户。
       现在改成串行:先把令牌换新,再用新令牌去读资料。 */
    if (window.Cloud.hasSession()) {
      if (!window.Cloud.dayValid()) {
        // 跨日了:记住原本要去的地方,重新登入后直接回去
        requireLogin("day");
      } else {
        if (!parseRoute()) showBootLoading();
        window.Cloud.refresh()
          .catch(function (e) {
            // 令牌确实被拒 → 回登入页;只是暂时失败(断网 / 5xx)→ 仍用旧令牌继续,由 REST 层自行重试
            if (e && e.hard) { requireLogin("expired"); throw e; }
          })
          .then(function () { if (window.Cloud.hasSession()) enterApp(true); })
          .catch(function () { });
      }
    } else {
      $("authOverlay").style.display = "";
    }

    /* 闲置回来(切回分页 / 视窗重新取得焦点 / bfcache 复原)。
       同一天之内不因为闲置而要求重新登入,只是重新跟资料库确认一次真实状态;
       已跨日才导向登入页。 */
    (function () {
      let lastCheck = Date.now();
      const IDLE_MS = 5 * 60 * 1000;
      function wake(force) {
        if (!window.Cloud.hasSession()) return;
        if (!window.Cloud.dayValid()) { requireLogin("day"); return; }
        const idled = Date.now() - lastCheck > IDLE_MS;
        lastCheck = Date.now();
        if (!force && !idled) return;
        // 先续期,再重新取资料;失败也不会把使用者当成新用户
        window.Cloud.refresh()
          .catch(function (e) { if (e && e.hard) { requireLogin("expired"); throw e; } })
          .then(function () { if (window.Cloud.hasSession()) reloadUserData(); })
          .catch(function () { });
      }
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") wake(false);
      });
      /* 网页一直开着、跨到隔天:不主动把人踢出去,而是在「再次操作网站时」要求重新登入,
         并记住这一下原本想去哪里。 */
      document.addEventListener("click", function (ev) {
        if (!window.Cloud.hasSession() || window.Cloud.dayValid()) return;
        const ov = $("authOverlay");
        if (ov && ov.style.display !== "none" && ov.contains(ev.target)) return;  // 正在登入页上操作
        const a = ev.target && ev.target.closest ? ev.target.closest("a[href]") : null;
        const href = a ? a.getAttribute("href") : "";
        ev.preventDefault();
        ev.stopPropagation();
        requireLogin("day");
        if (href && href.charAt(0) === "#") rememberNext(href);
      }, true);
      window.addEventListener("focus", function () { wake(false); });
      window.addEventListener("pageshow", function (e) {
        // 从 bfcache 还原(例如登出后按 Browser Back):没有会话就立刻回到登入页,
        // 不能让上一刻还处于登入状态的私人页面又出现在画面上。
        if (!window.Cloud.hasSession()) {
          const dp = $("dpage");
          if (dp) { dp.innerHTML = ""; dp.style.display = "none"; }
          document.body.classList.remove("dp-open");
          if (parseRoute()) requireLogin("none");
          return;
        }
        if (e.persisted) wake(true);
      });
    })();
    // —— 解读面板按钮 ——
    function copyText(txt, btn, okLabel) {
      function done() { const t = btn.textContent; btn.textContent = okLabel; setTimeout(function () { btn.textContent = t; }, 1800); }
      function fallback() {
        const ta = document.createElement("textarea");
        ta.value = txt; document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); done(); } catch (e) { }
        document.body.removeChild(ta);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback);
      else fallback();
    }
    $("mapBtn").addEventListener("click", toggleMap);
    // 「你的人生章节」整区收合
    $("topicHead").addEventListener("click", function () {
      const g = $("topicGrid");
      const closed = g.style.display === "none";
      g.style.display = closed ? "" : "none";
      $("topicArrow").textContent = closed ? "\u2227" : "\u2228";
    });
    // 「人生探索地图」整区收合(Version 1 隐藏中,事件保留)
    $("qaHead").addEventListener("click", function () {
      if (!SHOW_EXPLORATION_MAP) return;
      qaOpen = !qaOpen;
      renderQA();
    });
    $("posHead").addEventListener("click", function () {
      const tb = $("posTable");
      const closed = tb.style.display === "none";
      tb.style.display = closed ? "" : "none";
      $("posArrow").textContent = closed ? "\u2227" : "\u2228";
    });
    document.querySelectorAll("#sysSeg button").forEach(function (b) {
      b.addEventListener("click", function () {
        const c = activeChart();
        if (!c) return;
        c.sys = b.dataset.sys;
        window.Cloud.updateChart(c).catch(function (e) { console.warn(T("syncFail"), e); });
        drawActive();
      });
    });
    $("drawerX").addEventListener("click", closeDrawer);
    $("scrim").addEventListener("click", closeDrawer);
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDrawer(); });
    renderChartList();
    drawActive();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
  else init();
})();

</script>
</body>
</html>
